<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#9333ea">
<title>Fire Mountain Groupforge</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#9333ea,#2563eb);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}
.header p{font-size:12px;opacity:.92}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#f5f3ff;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#6d28d9;font-weight:700;text-transform:uppercase}
.v{font-size:18px;font-weight:800;color:#111827}
.mission{background:linear-gradient(135deg,#f5f3ff,#e0e7ff);border:2px solid #c4b5fd;border-radius:12px;padding:10px;margin-bottom:10px}
.mission h3{font-size:14px;color:#4c1d95}
.mission p{font-size:12px;color:#4338ca;line-height:1.45;margin-top:4px}
.state{background:#0f172a;color:#fff;border-radius:10px;padding:10px;text-align:center;font-family:'Courier New',monospace;font-size:18px;font-weight:900}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.choice{padding:10px;border:2px solid #d1d5db;border-radius:10px;background:#fff;font-weight:800;cursor:pointer}
.choice.sel{border-color:#9333ea;background:#ede9fe;color:#4c1d95}
.choice.ok{border-color:#16a34a;background:#dcfce7;color:#166534}
.choice.bad{border-color:#dc2626;background:#fef2f2;color:#991b1b}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.btn.check{background:#9333ea;color:#fff}
.btn.next{background:#0ea5e9;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.45}
.msg.good{background:#dcfce7;color:#166534}
.msg.bad{background:#fef2f2;color:#991b1b}
.msg.info{background:#eff6ff;color:#1e3a8a}
.insight{margin-top:12px;background:linear-gradient(135deg,#f5f3ff,#e0e7ff);border-left:4px solid #9333ea;border-radius:12px;padding:12px;font-size:12px;color:#111827;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Fire Mountain Groupforge</h1>
    <p>Choose expression that matches called number grouping</p>
  </div>
  <div class="card" id="sim"></div>
  <div class="insight"><b>Concept:</b> if total students = T and called number = n, expression is q*n + r where q=floor(T/n), r=T mod n.</div>
</div>
<script>
const sim = document.getElementById('sim');
const ROUNDS = [
  {T:33, n:5, ans:'6×5+3'},
  {T:33, n:4, ans:'8×4+1'},
  {T:33, n:7, ans:'4×7+5'},
  {T:40, n:6, ans:'6×6+4'},
  {T:28, n:9, ans:'3×9+1'},
  {T:52, n:8, ans:'6×8+4'}
];

let st = {run:true, idx:0, score:0, lives:3, pick:'', resolved:false, msg:'', msgType:'info', opts:[]};

function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}

function mkOptions(r){
  const q = Math.floor(r.T/r.n), rem = r.T%r.n;
  return shuffle([
    r.ans,
    `${q+1}×${r.n}+${Math.max(0,rem-r.n)}`,
    `${q}×${r.n-1}+${rem+q}`,
    `${q}×${r.n}-${rem}`
  ]).slice(0,4);
}

function setupRound(){
  st.pick=''; st.resolved=false; st.msg=''; st.msgType='info';
  st.opts = mkOptions(ROUNDS[st.idx]);
}

function choose(v){ if(!st.run || st.resolved) return; st.pick=v; render(); }

function check(){
  if(!st.run || st.resolved || !st.pick) return;
  const r = ROUNDS[st.idx];
  st.resolved = true;
  if(st.pick===r.ans){
    st.score += 12;
    st.msg = `Correct forge! ${r.ans}`;
    st.msgType = 'good';
  }else{
    st.lives--;
    st.msg = `Not correct. Use quotient and remainder: ${r.ans}`;
    st.msgType = 'bad';
    if(st.lives<=0) st.run=false;
  }
  render();
}

function next(){
  if(!st.resolved) return;
  st.idx += 1;
  if(st.idx>=ROUNDS.length){
    st.run = false;
    st.msg = 'Groupforge complete!';
    st.msgType = 'good';
    render();
    return;
  }
  setupRound();
  render();
}

function restart(){
  st = {run:true, idx:0, score:0, lives:3, pick:'', resolved:false, msg:'', msgType:'info', opts:[]};
  setupRound();
  render();
}

function render(){
  const done = !st.run;
  const r = ROUNDS[Math.min(st.idx, ROUNDS.length-1)];
  sim.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="k">Round</div><div class="v">${Math.min(st.idx+1,ROUNDS.length)}/${ROUNDS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Call</div><div class="v">${r.n}</div></div>
    </div>
    <div class="mission">
      <h3>Total students: ${r.T}</h3>
      <p>Teacher calls "${r.n}". Pick the expression for complete groups and leftover.</p>
    </div>
    <div class="state">${r.T} = ?</div>
    <div class="choices">
      ${st.opts.map(v=>{
        const cls = st.resolved ? (v===r.ans?'ok':(v===st.pick?'bad':'')) : (v===st.pick?'sel':'');
        return `<button class="choice ${cls}" data-v="${v}">${v}</button>`;
      }).join('')}
    </div>
    <div class="actions">
      ${done ? `<button class="btn next" id="restartBtn">Restart</button>` :
      (st.resolved ? `<button class="btn next" id="nextBtn">${st.idx===ROUNDS.length-1?'Finish':'Next Round'}</button>` :
      `<button class="btn check" id="checkBtn">Check Expression</button>`)}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Pick one expression then check.</div>`}
  `;
  sim.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(b.dataset.v));
  const c = sim.querySelector('#checkBtn'); if(c) c.onclick=check;
  const n = sim.querySelector('#nextBtn'); if(n) n.onclick=next;
  const rr = sim.querySelector('#restartBtn'); if(rr) rr.onclick=restart;
  // --- V5 coach: quotient x group + remainder ---
  var _q=Math.floor(r.T/r.n), _rem=r.T%r.n;
  var _ansEl=[].slice.call(sim.querySelectorAll('.choice')).find(function(b){return b.dataset.v===r.ans;});
  if(done){
    window.__eduRound={native:true,line:(st.idx>=ROUNDS.length?(st.msg||'Groupforge complete!'):st.msg),voice:'Round over.',submit:sim.querySelector('#restartBtn'),key:'done-'+st.idx};
  } else if(st.resolved){
    window.__eduRound={native:true,line:st.msg,voice:(st.msgType==='good'?'Correct.':'Not correct.'),submit:sim.querySelector('#nextBtn'),key:'res-'+st.idx};
  } else {
    window.__eduRound={native:true,
      hint:'There are '+r.T+' students and the teacher calls groups of '+r.n+'. Which expression shows the full groups and the leftover?',
      hintVoice:'How many full groups, and how many left over?',
      why:'Divide the total by the group size: the quotient is the number of full groups and the remainder is the leftover — write it as quotient × group + remainder.',
      detail:'Step 1 — Divide '+r.T+' by '+r.n+'.\nStep 2 — '+r.T+' ÷ '+r.n+' = '+_q+' remainder '+_rem+'.\nStep 3 — So '+r.T+' = '+_q+'×'+r.n+'+'+_rem+' → tap "'+r.ans+'".\nWhy it works — full groups of '+r.n+' account for '+_q+'×'+r.n+' = '+(_q*r.n)+', and the extra '+_rem+' cannot form another group.\nTip — the remainder is always smaller than the group size ('+r.n+').',
      line:r.T+' = '+r.ans+' ('+_q+' groups of '+r.n+', '+_rem+' left over).',
      voice:'Choose '+r.ans,
      glow:_ansEl,
      submit:st.pick?sim.querySelector('#checkBtn'):null,
      key:'r-'+st.idx};
  }
}

setupRound();
render();
</script>
  <script src="edu-coach.js"></script>
</body>
</html>
