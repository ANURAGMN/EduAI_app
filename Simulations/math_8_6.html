<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0ea5e9">
<title>Fraction Operation Duel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#0ea5e9,#1d4ed8);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}
.header p{font-size:12px;opacity:.92}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#ecfeff;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#0f766e;font-weight:700;text-transform:uppercase}
.v{font-size:18px;font-weight:800;color:#111827}
.mission{background:linear-gradient(135deg,#ecfeff,#e0f2fe);border:2px solid #67e8f9;border-radius:12px;padding:10px;margin-bottom:10px}
.expr{font-family:'Courier New',monospace;font-size:22px;font-weight:900;color:#0c4a6e;text-align:center;margin-top:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{padding:10px;border:2px solid #d1d5db;border-radius:10px;background:#fff;cursor:pointer;font-family:'Courier New',monospace;font-weight:800}
.opt.sel{border-color:#0284c7;background:#e0f2fe;color:#0c4a6e}
.opt.ok{border-color:#16a34a;background:#dcfce7;color:#166534}
.opt.bad{border-color:#dc2626;background:#fef2f2;color:#991b1b}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.btn.check{background:#0284c7;color:#fff}
.btn.next{background:#0f766e;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.45}
.msg.good{background:#dcfce7;color:#166534}
.msg.bad{background:#fef2f2;color:#991b1b}
.msg.info{background:#eff6ff;color:#1e3a8a}
.insight{margin-top:12px;background:linear-gradient(135deg,#ecfeff,#e0f2fe);border-left:4px solid #0284c7;border-radius:12px;padding:12px;font-size:12px;color:#111827;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Fraction Operation Duel</h1>
    <p>Solve fraction operations using correct denominator logic</p>
  </div>
  <div class="card" id="sim"></div>
  <div class="insight"><b>Chapter 8 seed:</b> operation fluency with fractions (add/subtract/multiply/divide).</div>
</div>
<script>
const sim = document.getElementById('sim');
const ROUNDS = [
  {q:'1/2 + 1/3', ans:'5/6', opts:['2/5','5/6','2/6','1/5']},
  {q:'3/4 - 1/8', ans:'5/8', opts:['2/8','5/8','1/2','3/8']},
  {q:'2/3 × 3/5', ans:'2/5', opts:['6/15','2/5','5/2','3/8']},
  {q:'4/7 ÷ 2/7', ans:'2', opts:['2','1/2','8/49','4/14']},
  {q:'5/6 + 1/6', ans:'1', opts:['6/12','1','5/12','11/6']},
  {q:'7/9 - 2/9', ans:'5/9', opts:['5/9','9/5','5/18','1/9']}
];

let st={run:true,idx:0,score:0,lives:3,pick:null,resolved:false,msg:'',msgType:'info'};
function choose(i){ if(!st.run||st.resolved) return; st.pick=i; render(); }
function check(){
  if(!st.run||st.resolved||st.pick===null) return;
  const r=ROUNDS[st.idx];
  st.resolved=true;
  if(r.opts[st.pick]===r.ans){ st.score+=12; st.msg='Correct fraction result.'; st.msgType='good'; }
  else { st.lives--; st.msg=`Correct answer: ${r.ans}`; st.msgType='bad'; if(st.lives<=0) st.run=false; }
  render();
}
function next(){
  if(!st.resolved) return;
  st.idx++;
  if(st.idx>=ROUNDS.length){ st.run=false; st.msg='Duel complete!'; st.msgType='good'; render(); return; }
  st.pick=null; st.resolved=false; st.msg=''; st.msgType='info'; render();
}
function restart(){ st={run:true,idx:0,score:0,lives:3,pick:null,resolved:false,msg:'',msgType:'info'}; render(); }
function render(){
  const done=!st.run;
  const r=ROUNDS[Math.min(st.idx,ROUNDS.length-1)];
  sim.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="k">Round</div><div class="v">${Math.min(st.idx+1,ROUNDS.length)}/${ROUNDS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Mode</div><div class="v">Duel</div></div>
    </div>
    <div class="mission">
      <div style="font-size:12px;color:#0c4a6e">Solve and choose correct result</div>
      <div class="expr">${r.q} = ?</div>
    </div>
    <div class="opts">
      ${r.opts.map((o,i)=>{
        const cls=st.resolved?(o===r.ans?'ok':(i===st.pick?'bad':'')):(i===st.pick?'sel':'');
        return `<button class="opt ${cls}" data-i="${i}">${o}</button>`;
      }).join('')}
    </div>
    <div class="actions">
      ${done?`<button class="btn next" id="restartBtn">Restart</button>`:(st.resolved?`<button class="btn next" id="nextBtn">${st.idx===ROUNDS.length-1?'Finish':'Next Round'}</button>`:`<button class="btn check" id="checkBtn">Check Result</button>`)}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Select one option then check.</div>`}
  `;
  sim.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(parseInt(b.dataset.i,10)));
  const c=sim.querySelector('#checkBtn'); if(c) c.onclick=check;
  const n=sim.querySelector('#nextBtn'); if(n) n.onclick=next;
  const rbtn=sim.querySelector('#restartBtn'); if(rbtn) rbtn.onclick=restart;
  try{
    var _r=ROUNDS[Math.min(st.idx,ROUNDS.length-1)];
    var _ai=_r.opts.indexOf(_r.ans);
    var _opts=Array.prototype.slice.call(sim.querySelectorAll('.opt'));
    var _ansEl=_opts[_ai];
    if(!st.run){ window.__eduRound={native:true,line:(st.msg||'Duel complete!'),voice:(st.msgType==='good'?'Done.':'Try again.'),glow:sim.querySelector('#restartBtn'),submit:sim.querySelector('#restartBtn'),key:'over-'+st.idx}; }
    else if(st.resolved){ window.__eduRound={native:true,line:st.msg,voice:(st.msgType==='good'?'Correct.':'Not quite.'),submit:sim.querySelector('#nextBtn'),key:'res-'+st.idx}; }
    else { window.__eduRound={native:true,
      hint:'What is '+_r.q+'?',hintVoice:'Solve the expression.',
      why:'Add/subtract over a common denominator; multiply across; divide by inverting the second fraction.',
      detail:'Step 1 - Pick the rule for the sign: common denominator for + or -, across for *, invert-and-multiply for /.\nStep 2 - Apply it to '+_r.q+'.\nStep 3 - Simplify if needed, then tap '+_r.ans+'.\nWhy it works - you can only add same-size pieces, so match denominators first.\nTip - dividing by a fraction = multiplying by its reciprocal.',
      line:_r.q+' = '+_r.ans+'.',
      voice:'The answer is '+_r.ans+'.',
      glow:(st.pick!==null?sim.querySelector('#checkBtn'):_ansEl),submit:(st.pick!==null?sim.querySelector('#checkBtn'):null),key:'m-'+st.idx}; }
  }catch(e){}
}
render();
</script>
  <script src="edu-coach.js"></script>
</body>
</html>
