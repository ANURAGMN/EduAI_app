<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#059669">
<title>Distribute Maze Runner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#059669 0%,#1d4ed8 100%);min-height:100vh}
#app{max-width:420px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}
.header p{font-size:12px;opacity:.9}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#ecfdf5;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#065f46;font-weight:700;text-transform:uppercase}
.v{font-size:18px;font-weight:800;color:#111827}
.mission{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:2px solid #86efac;border-radius:12px;padding:10px;margin-bottom:10px}
.expr{font-family:'Courier New',monospace;font-size:20px;font-weight:800;text-align:center;color:#111827;margin-top:6px}
.maze{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
.lane{padding:10px;border:2px solid #e5e7eb;border-radius:10px;background:#fff;cursor:pointer;text-align:center;font-family:'Courier New',monospace;font-weight:800}
.lane.sel{border-color:#0369a1;background:#dbeafe;color:#1e3a8a}
.lane.ok{border-color:#16a34a;background:#dcfce7;color:#166534}
.lane.bad{border-color:#dc2626;background:#fef2f2;color:#991b1b}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.btn.start{background:linear-gradient(135deg,#059669,#1d4ed8);color:#fff}
.btn.next{background:#0ea5e9;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.45}
.msg.good{background:#dcfce7;color:#166534}
.msg.bad{background:#fef2f2;color:#991b1b}
.msg.info{background:#eff6ff;color:#1e3a8a}
.insight{margin-top:12px;background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-left:4px solid #059669;border-radius:12px;padding:12px;font-size:12px;color:#0f172a;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Distribute Maze Runner</h1>
    <p>Pick the correct distributive expansion path</p>
  </div>
  <div class="card" id="sim"></div>
  <div class="insight"><b>Rule:</b> a(b+c)=ab+ac and a(b−c)=ab−ac. Signs matter in every lane.</div>
</div>
<script>
const sim = document.getElementById('sim');
const MISSIONS = [
  {expr:'3(6+7)', ok:'3×6 + 3×7', bad:['3+6+7','6×7+3','3×6−3×7']},
  {expr:'5(9−2)', ok:'5×9 − 5×2', bad:['5×9 + 5×2','9−2×5','5+9−2']},
  {expr:'(8+3)×4', ok:'8×4 + 3×4', bad:['8+3×4','8×4 − 3×4','(8+3)+4']},
  {expr:'(14−6)×10', ok:'14×10 − 6×10', bad:['14×10 + 6×10','14−6+10','14×6−10']},
  {expr:'7(20+5)', ok:'7×20 + 7×5', bad:['7+20+5','20×5+7','7×20−7×5']}
];
let st = {run:false, idx:0, score:0, lives:3, msg:'', msgType:'info', resolved:false, pick:'', lanes:[]};

function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}
function prepare(){
  const m = MISSIONS[Math.min(st.idx, MISSIONS.length - 1)];
  st.lanes = shuffle([m.ok, ...m.bad]);
}
function start(){ st={...st, run:true, idx:0, score:0, lives:3, resolved:false, msg:'', pick:'', lanes:[]}; prepare(); render(); }
function choose(v){
  if(!st.run || st.resolved) return;
  const m = MISSIONS[st.idx];
  st.pick = v;
  st.resolved = true;
  if(v===m.ok){ st.score+=12; st.msg='Correct lane! Distribution preserved.'; st.msgType='good'; }
  else { st.lives--; st.msg='Wrong lane. Check sign and multiplier distribution.'; st.msgType='bad'; if(st.lives<=0) st.run=false; }
  render(v);
}
function next(){
  if(!st.resolved) return;
  st.idx++;
  if(st.idx>=MISSIONS.length){ st.run=false; st.msg='Maze cleared!'; st.msgType='good'; }
  st.resolved=false; st.pick=''; prepare();
  render();
}
function render(chosen=''){
  const done = !st.run;
  const m = MISSIONS[Math.min(st.idx, MISSIONS.length-1)];
  if(st.lanes.length===0) prepare();
  const lanes = st.lanes;
  sim.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="k">Level</div><div class="v">${Math.min(st.idx+1, MISSIONS.length)}/${MISSIONS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Mode</div><div class="v">Maze</div></div>
    </div>
    <div class="mission">
      <div>Choose the correct expansion path</div>
      <div class="expr">${m.expr}</div>
    </div>
    <div class="maze">
      ${lanes.map(l=>`<button class="lane ${st.resolved?(l===m.ok?'ok':(l===chosen?'bad':'')):(l===st.pick?'sel':'')}" data-v="${l}">${l}</button>`).join('')}
    </div>
    <div class="actions">
      ${done ? `<button class="btn start" id="startBtn">Start Maze Run</button>` : (st.resolved ? `<button class="btn next" id="nextBtn">Next Maze</button>` : '')}
    </div>
    ${st.msg ? `<div class="msg ${st.msgType}">${st.msg}</div>` : `<div class="msg info">One multiplier must distribute to every term inside brackets.</div>`}
  `;
  sim.querySelectorAll('.lane').forEach(b=>b.onclick=()=>choose(b.dataset.v));
  const s=sim.querySelector('#startBtn'); if(s) s.onclick=start;
  const n=sim.querySelector('#nextBtn'); if(n) n.onclick=next;
}
start();
</script>
</body>
</html>
