<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0ea5e9">
<title>Decimal Context Decoder</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#0ea5e9,#0284c7);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}
.header p{font-size:12px;opacity:.9}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#ecfeff;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#0f766e;font-weight:700;text-transform:uppercase}
.v{font-size:18px;font-weight:800;color:#0f172a}
.mission{background:linear-gradient(135deg,#ecfeff,#e0f2fe);border:2px solid #67e8f9;border-radius:12px;padding:10px;margin-bottom:10px}
.mission h3{font-size:14px;color:#0c4a6e}
.mission p{font-size:13px;color:#155e75;line-height:1.45;margin-top:4px}
.opts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.opt{padding:10px;border:2px solid #d1d5db;border-radius:10px;background:#fff;cursor:pointer;text-align:left;font-size:13px;font-weight:700}
.opt.sel{border-color:#0284c7;background:#e0f2fe;color:#0c4a6e}
.opt.ok{border-color:#16a34a;background:#dcfce7;color:#166534}
.opt.bad{border-color:#dc2626;background:#fef2f2;color:#991b1b}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.btn.check{background:#0284c7;color:#fff}
.btn.next{background:#0f766e;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.45}
.msg.good{background:#dcfce7;color:#166534}
.msg.bad{background:#fef2f2;color:#991b1b}
.msg.info{background:#eff6ff;color:#1e3a8a}
.insight{margin-top:12px;background:linear-gradient(135deg,#ecfeff,#e0f2fe);border-left:4px solid #0284c7;border-radius:12px;padding:12px;font-size:12px;color:#0f172a;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Decimal Context Decoder</h1>
    <p>Decode what decimals really mean in context</p>
  </div>
  <div class="card" id="sim"></div>
  <div class="insight"><b>Concept:</b> same decimal notation can mean different things by context (hours, overs, units). Decode meaning correctly.</div>
</div>
<script>
const sim = document.getElementById('sim');
const CASES = [
  {q:'4.5 hours means...', ans:'4 hours 30 minutes', opts:['4 hours 50 minutes','4 hours 30 minutes','4 hours 5 minutes','4 hours 45 minutes']},
  {q:'Cricket score: 5.5 overs means...', ans:'5 overs and 5 balls', opts:['5.5 overs out of 10 balls each','5 overs and 5 balls','5 overs and 50 balls','5 overs and 30 balls']},
  {q:'₹2.50 means...', ans:'2 rupees and 50 paise', opts:['2 rupees and 5 paise','2 rupees and 50 paise','250 rupees','2 rupees 500 paise']},
  {q:'0.20 and 0.2 are...', ans:'equal values', opts:['different values','equal values','0.20 is ten times bigger','cannot compare']},
  {q:'0.2 and 0.02 are...', ans:'different; 0.2 is 10 times 0.02', opts:['equal','different; 0.2 is 10 times 0.02','different; 0.02 is 10 times 0.2','cannot decide']},
  {q:'1.01 is closest to...', ans:'1', opts:['0.9','1.1','1','1.11']}
];

let st = {run:true, idx:0, score:0, lives:3, pick:null, resolved:false, msg:'', msgType:'info'};

function choose(i){ if(!st.run||st.resolved) return; st.pick=i; render(); }
function check(){
  if(!st.run || st.resolved || st.pick===null) return;
  const c = CASES[st.idx];
  st.resolved = true;
  if(c.opts[st.pick]===c.ans){
    st.score += 12;
    st.msg = 'Decoded correctly!';
    st.msgType = 'good';
  } else {
    st.lives -= 1;
    st.msg = `Not correct. Correct meaning: ${c.ans}.`;
    st.msgType = 'bad';
    if(st.lives<=0) st.run=false;
  }
  render();
}
function next(){
  if(!st.resolved) return;
  st.idx++;
  if(st.idx>=CASES.length){
    st.run=false;
    st.msg='Decoder run complete!';
    st.msgType='good';
    render();
    return;
  }
  st.pick=null; st.resolved=false; st.msg=''; st.msgType='info';
  render();
}
function restart(){ st={run:true,idx:0,score:0,lives:3,pick:null,resolved:false,msg:'',msgType:'info'}; render(); }

function render(){
  const done = !st.run;
  const c = CASES[Math.min(st.idx, CASES.length-1)];
  sim.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="k">Case</div><div class="v">${Math.min(st.idx+1,CASES.length)}/${CASES.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Mode</div><div class="v">Decode</div></div>
    </div>
    <div class="mission">
      <h3>What does this mean?</h3>
      <p>${c.q}</p>
    </div>
    <div class="opts">
      ${c.opts.map((o,i)=>{
        const cls = st.resolved ? (o===c.ans?'ok':(i===st.pick?'bad':'')) : (i===st.pick?'sel':'');
        return `<button class="opt ${cls}" data-i="${i}">${o}</button>`;
      }).join('')}
    </div>
    <div class="actions">
      ${done ? `<button class="btn next" id="restartBtn">Restart</button>` :
      (st.resolved ? `<button class="btn next" id="nextBtn">${st.idx===CASES.length-1?'Finish':'Next Case'}</button>` :
      `<button class="btn check" id="checkBtn">Check Meaning</button>`)}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Select one interpretation and check.</div>`}
  `;
  sim.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(parseInt(b.dataset.i,10)));
  const cbtn = sim.querySelector('#checkBtn'); if(cbtn) cbtn.onclick=check;
  const nbtn = sim.querySelector('#nextBtn'); if(nbtn) nbtn.onclick=next;
  const rbtn = sim.querySelector('#restartBtn'); if(rbtn) rbtn.onclick=restart;
}
render();
</script>
</body>
</html>
