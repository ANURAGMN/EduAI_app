<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Fraction Simplify Relay</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#2563eb,#0ea5e9);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}
.header p{font-size:12px;opacity:.92}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#eff6ff;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#1d4ed8;font-weight:700;text-transform:uppercase}
.v{font-size:18px;font-weight:800;color:#111827}
.mission{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:2px solid #93c5fd;border-radius:12px;padding:10px;margin-bottom:10px}
.expr{font-family:'Courier New',monospace;font-size:24px;font-weight:900;color:#1e3a8a;text-align:center;margin-top:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{padding:10px;border:2px solid #d1d5db;border-radius:10px;background:#fff;cursor:pointer;font-family:'Courier New',monospace;font-weight:800}
.opt.sel{border-color:#2563eb;background:#dbeafe;color:#1d4ed8}
.opt.ok{border-color:#16a34a;background:#dcfce7;color:#166534}
.opt.bad{border-color:#dc2626;background:#fef2f2;color:#991b1b}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.btn.check{background:#2563eb;color:#fff}
.btn.next{background:#0ea5e9;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.45}
.msg.good{background:#dcfce7;color:#166534}
.msg.bad{background:#fef2f2;color:#991b1b}
.msg.info{background:#eff6ff;color:#1e3a8a}
.insight{margin-top:12px;background:linear-gradient(135deg,#eff6ff,#dbeafe);border-left:4px solid #2563eb;border-radius:12px;padding:12px;font-size:12px;color:#111827;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Fraction Simplify Relay</h1>
    <p>Simplify fractions to lowest terms in a relay race</p>
  </div>
  <div class="card" id="sim"></div>
  <div class="insight"><b>Chapter 8 focus:</b> reduce fractions by dividing numerator and denominator by common factors.</div>
</div>
<script>
const sim = document.getElementById('sim');
const ROUNDS = [
  {q:'12/18', ans:'2/3', opts:['2/3','3/2','6/9','4/6']},
  {q:'28/42', ans:'2/3', opts:['2/3','14/21','4/7','7/4']},
  {q:'45/60', ans:'3/4', opts:['3/4','4/3','9/12','5/7']},
  {q:'36/54', ans:'2/3', opts:['2/3','3/2','18/27','4/5']},
  {q:'50/70', ans:'5/7', opts:['5/7','7/5','10/14','4/7']},
  {q:'81/108', ans:'3/4', opts:['3/4','9/12','4/3','6/7']}
];
let st={run:true,idx:0,score:0,lives:3,pick:null,resolved:false,msg:'',msgType:'info'};
function choose(i){ if(!st.run||st.resolved) return; st.pick=i; render(); }
function check(){
  if(!st.run||st.resolved||st.pick===null) return;
  const r=ROUNDS[st.idx];
  st.resolved=true;
  if(r.opts[st.pick]===r.ans){ st.score+=12; st.msg='Correct simplification.'; st.msgType='good'; }
  else { st.lives--; st.msg=`Lowest form is ${r.ans}.`; st.msgType='bad'; if(st.lives<=0) st.run=false; }
  render();
}
function next(){
  if(!st.resolved) return;
  st.idx++;
  if(st.idx>=ROUNDS.length){ st.run=false; st.msg='Relay complete!'; st.msgType='good'; render(); return; }
  st.pick=null; st.resolved=false; st.msg=''; st.msgType='info'; render();
}
function restart(){ st={run:true,idx:0,score:0,lives:3,pick:null,resolved:false,msg:'',msgType:'info'}; render(); }
function render(){
  const done=!st.run;
  const r=ROUNDS[Math.min(st.idx,ROUNDS.length-1)];
  sim.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="k">Round</div><div class="v">${Math.min(st.idx+1,ROUNDS.length)}/${ROUNDS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Mode</div><div class="v">Relay</div></div>
    </div>
    <div class="mission">
      <div style="font-size:12px;color:#1e3a8a">Pick the lowest-term equivalent</div>
      <div class="expr">${r.q}</div>
    </div>
    <div class="opts">
      ${r.opts.map((o,i)=>{
        const cls=st.resolved?(o===r.ans?'ok':(i===st.pick?'bad':'')):(i===st.pick?'sel':'');
        return `<button class="opt ${cls}" data-i="${i}">${o}</button>`;
      }).join('')}
    </div>
    <div class="actions">
      ${done?`<button class="btn next" id="restartBtn">Restart</button>`:(st.resolved?`<button class="btn next" id="nextBtn">${st.idx===ROUNDS.length-1?'Finish':'Next Round'}</button>`:`<button class="btn check" id="checkBtn">Check Simplification</button>`)}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Find highest common factor quickly.</div>`}
  `;
  sim.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(parseInt(b.dataset.i,10)));
  const c=sim.querySelector('#checkBtn'); if(c) c.onclick=check;
  const n=sim.querySelector('#nextBtn'); if(n) n.onclick=next;
  const rbtn=sim.querySelector('#restartBtn'); if(rbtn) rbtn.onclick=restart;
  try{
    var _g=function(a,b){return b?_g(b,a%b):a;};
    var _r=ROUNDS[Math.min(st.idx,ROUNDS.length-1)];
    var _qp=_r.q.split('/'), _qa=parseInt(_qp[0],10), _qb=parseInt(_qp[1],10), _h=_g(_qa,_qb);
    var _ai=_r.opts.indexOf(_r.ans);
    var _opts=Array.prototype.slice.call(sim.querySelectorAll('.opt'));
    var _ansEl=_opts[_ai];
    if(!st.run){ window.__eduRound={native:true,line:(st.msg||'Relay complete!'),voice:(st.msgType==='good'?'Done.':'Try again.'),glow:sim.querySelector('#restartBtn'),submit:sim.querySelector('#restartBtn'),key:'over-'+st.idx}; }
    else if(st.resolved){ window.__eduRound={native:true,line:st.msg,voice:(st.msgType==='good'?'Correct.':'Not quite.'),submit:sim.querySelector('#nextBtn'),key:'res-'+st.idx}; }
    else { window.__eduRound={native:true,
      hint:'Write '+_r.q+' in its lowest form. Which option is right?',hintVoice:'Simplify '+_r.q+'.',
      why:'Simplify by dividing top and bottom by their HCF; lowest form has HCF 1.',
      detail:'Step 1 - Find the HCF of top and bottom: HCF('+_qa+', '+_qb+') = '+_h+'.\nStep 2 - Divide both: '+_qa+' / '+_h+' = '+(_qa/_h)+', '+_qb+' / '+_h+' = '+(_qb/_h)+'.\nStep 3 - Tap '+_r.ans+'.\nWhy it works - dividing both by the same factor keeps the value but shrinks the numbers.\nTip - a decoy can be equal but not fully reduced.',
      line:_r.q+' = '+_r.ans+' (divide by '+_h+').',
      voice:'The lowest form is '+_r.ans+'.',
      glow:(st.pick!==null?sim.querySelector('#checkBtn'):_ansEl),submit:(st.pick!==null?sim.querySelector('#checkBtn'):null),key:'m-'+st.idx}; }
  }catch(e){}
}
render();
</script>
  <script src="edu-coach.js"></script>
</body>
</html>
