<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0284c7">
<title>Fraction Route Planner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#0284c7,#0ea5e9);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}.header p{font-size:12px;opacity:.92}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#ecfeff;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#0f766e;font-weight:700;text-transform:uppercase}.v{font-size:17px;font-weight:800;color:#0f172a}
.mission{background:#ecfeff;border:2px solid #67e8f9;border-radius:12px;padding:10px;margin-bottom:10px;font-size:12px;color:#0c4a6e}
.track{position:relative;height:74px;background:#f8fafc;border:2px solid #cbd5e1;border-radius:12px;padding:8px}
.road{position:absolute;left:14px;right:14px;top:36px;height:4px;background:#94a3b8;border-radius:99px}
.node{position:absolute;top:28px;width:18px;height:18px;border-radius:50%;border:2px solid #334155;background:#fff;transform:translateX(-50%)}
.node.goal{border-color:#0284c7;background:#e0f2fe}
.node.active{border-color:#16a34a;background:#dcfce7}
.lbl{position:absolute;top:6px;transform:translateX(-50%);font-size:10px;color:#475569}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.btnMini{padding:8px;border:none;border-radius:8px;background:#dbeafe;color:#1d4ed8;font-weight:800;cursor:pointer}
.slider{width:100%;margin-top:8px}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.check{background:#0284c7;color:#fff}.next{background:#0f766e;color:#fff}.retry{background:#334155;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.4}
.good{background:#dcfce7;color:#166534}.bad{background:#fef2f2;color:#991b1b}.info{background:#eff6ff;color:#1e3a8a}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Fraction Route Planner</h1>
    <p>Land the rover exactly at target fraction on route</p>
  </div>
  <div class="card" id="sim"></div>
</div>
<script>
const sim=document.getElementById('sim');
const MISSIONS=[
  {num:1,den:3},{num:3,den:5},{num:7,den:8},{num:5,den:12},{num:9,den:10}
];
let st={run:true,idx:0,score:0,lives:3,resolved:false,msg:'',msgType:'info',p:0.5};
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function t(){const m=MISSIONS[Math.min(st.idx,MISSIONS.length-1)];return m.num/m.den;}
function setup(){st.p=0.5;st.resolved=false;st.msg='';st.msgType='info';}
function nudge(d){if(!st.run||st.resolved)return;st.p=clamp(st.p+d,0,1);render();}
function setP(v){if(!st.run||st.resolved)return;st.p=clamp(parseFloat(v)||0,0,1);render();}
function check(){
  if(!st.run||st.resolved)return;
  st.resolved=true;
  if(Math.abs(st.p-t())<=0.02){st.score+=12;st.msg='Route locked exactly.';st.msgType='good';}
  else{st.lives--;st.msg=`Need ${(t()).toFixed(3)}. You set ${st.p.toFixed(3)}.`;st.msgType='bad';if(st.lives<=0)st.run=false;}
  render();
}
function next(){if(!st.resolved)return;st.idx++;if(st.idx>=MISSIONS.length){st.run=false;st.msg='Planner complete!';st.msgType='good';render();return;}setup();render();}
function retry(){if(st.run&&st.resolved){setup();render();}}
function restart(){st={run:true,idx:0,score:0,lives:3,resolved:false,msg:'',msgType:'info',p:0.5};setup();render();}
function render(){
  const done=!st.run,m=MISSIONS[Math.min(st.idx,MISSIONS.length-1)];
  const goal=t();
  const nodes=Array.from({length:11},(_,i)=>i/10);
  sim.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="k">Round</div><div class="v">${Math.min(st.idx+1,MISSIONS.length)}/${MISSIONS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Target</div><div class="v">${m.num}/${m.den}</div></div>
    </div>
    <div class="mission">Set rover position to <b>${m.num}/${m.den}</b> on [0,1]. Precision controls and slider both available.</div>
    <div class="track">
      <div class="road"></div>
      ${nodes.map(v=>`<div class="node ${Math.abs(v-goal)<1e-9?'goal':''}" style="left:${14+v*372/4.02}%"></div><div class="lbl" style="left:${14+v*372/4.02}%">${v===0?'0':v===1?'1':''}</div>`).join('')}
      <div class="node active" style="left:${14+st.p*372/4.02}%"></div>
    </div>
    <div class="controls">
      <button class="btnMini" id="m10" ${done||st.resolved?'disabled':''}>-0.10</button>
      <button class="btnMini" id="m01" ${done||st.resolved?'disabled':''}>-0.01</button>
      <button class="btnMini" id="p01" ${done||st.resolved?'disabled':''}>+0.01</button>
      <button class="btnMini" id="p10" ${done||st.resolved?'disabled':''}>+0.10</button>
    </div>
    <input class="slider" id="pSlider" type="range" min="0" max="1" step="0.001" value="${st.p.toFixed(3)}" ${done||st.resolved?'disabled':''}>
    <div style="margin-top:6px;font-size:12px;color:#0c4a6e">Rover: ${st.p.toFixed(3)}</div>
    <div class="actions">
      ${done?`<button class="btn next" id="restartBtn">Restart</button>`:st.resolved?`<button class="btn retry" id="retryBtn">Retry</button><button class="btn next" id="nextBtn">${st.idx===MISSIONS.length-1?'Finish':'Next'}</button>`:`<button class="btn check" id="checkBtn">Lock Route</button>`}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Use step buttons for exact placement.</div>`}
  `;
  const bind=(id,d)=>{const el=sim.querySelector('#'+id);if(el)el.onclick=()=>nudge(d);};
  bind('m10',-0.10);bind('m01',-0.01);bind('p01',0.01);bind('p10',0.10);
  const ps=sim.querySelector('#pSlider');if(ps)ps.oninput=e=>setP(e.target.value);
  const c=sim.querySelector('#checkBtn');if(c)c.onclick=check;
  const n=sim.querySelector('#nextBtn');if(n)n.onclick=next;
  const r=sim.querySelector('#retryBtn');if(r)r.onclick=retry;
  const rs=sim.querySelector('#restartBtn');if(rs)rs.onclick=restart;
  try{
    var _m=MISSIONS[Math.min(st.idx,MISSIONS.length-1)];
    var _t=_m.num/_m.den, _ok=Math.abs(st.p-_t)<=0.02;
    var _sl=sim.querySelector('#pSlider'), _ck=sim.querySelector('#checkBtn');
    if(!st.run){ window.__eduRound={native:true,line:(st.msg||'Planner complete!'),voice:(st.msgType==='good'?'Done.':'Try again.'),glow:sim.querySelector('#restartBtn'),submit:sim.querySelector('#restartBtn'),key:'over-'+st.idx}; }
    else if(st.resolved){ window.__eduRound={native:true,line:st.msg,voice:(st.msgType==='good'?'Correct.':'Not quite.'),submit:(sim.querySelector('#nextBtn')||sim.querySelector('#retryBtn')),key:'res-'+st.idx}; }
    else { window.__eduRound={native:true,
      hint:'Set the route to '+_m.num+'/'+_m.den+' of the way.',hintVoice:'Where is '+_m.num+'/'+_m.den+'?',
      why:'Every fraction is a point between 0 and 1 at its decimal value num / den.',
      detail:'Step 1 - Convert to a decimal: '+_m.num+' / '+_m.den+' = '+_t.toFixed(3)+'.\nStep 2 - Slide toward '+_t.toFixed(2)+'.\nStep 3 - Stop within 0.02.\nWhy it works - the slider is the numberline; the fraction decimal is its position.\nTip - landmarks: 1/2 = 0.5, 3/4 = 0.75.',
      line:(_ok?('At '+st.p.toFixed(2)+' - tap Check.'):('At '+st.p.toFixed(2)+' - nudge toward '+_t.toFixed(2)+' ('+_m.num+'/'+_m.den+').')),
      voice:'Set it to '+_m.num+' over '+_m.den+'.',
      glow:(_ok?_ck:_sl),submit:(_ok?_ck:null),key:'m-'+st.idx}; }
  }catch(e){}
}
setup();render();
</script>
  <script src="edu-coach.js"></script>
</body>
</html>
