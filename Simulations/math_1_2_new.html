<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Comma System Relay Arena</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#0f766e,#0284c7);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}
.header p{font-size:12px;opacity:.9}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#ecfeff;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#0f766e;font-weight:700;text-transform:uppercase}
.v{font-size:18px;font-weight:800;color:#111827}
.mission{background:linear-gradient(135deg,#ecfeff,#dbeafe);border:2px solid #7dd3fc;border-radius:12px;padding:10px;margin-bottom:10px}
.digits{text-align:center;font-size:26px;font-weight:900;font-family:'Courier New',monospace;color:#0f172a}
.note{font-size:12px;color:#0f766e;margin-top:4px}
.opts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.opt{padding:10px;border:2px solid #d1d5db;border-radius:10px;background:#fff;cursor:pointer;text-align:left}
.opt .t{font-size:11px;color:#475569}
.opt .v{font-size:14px;font-weight:800;font-family:'Courier New',monospace;color:#0f172a}
.opt.ok{border-color:#16a34a;background:#dcfce7}
.opt.bad{border-color:#dc2626;background:#fef2f2}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.btn.next{background:#0284c7;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.45}
.msg.good{background:#dcfce7;color:#166534}
.msg.bad{background:#fef2f2;color:#991b1b}
.msg.info{background:#eff6ff;color:#1e3a8a}
.insight{margin-top:12px;background:linear-gradient(135deg,#ecfeff,#dbeafe);border-left:4px solid #0f766e;border-radius:12px;padding:12px;font-size:12px;color:#0f172a;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Comma System Relay Arena</h1>
    <p>Match both Indian and International formats</p>
  </div>
  <div class="card" id="sim"></div>
  <div class="insight"><b>Concept:</b> Indian system groups as 3,2,2,... while International groups as 3,3,3,...</div>
</div>
<script>
const sim = document.getElementById("sim");
const ROUNDS = [
  {raw:"27582914", indian:"2,75,82,914", intl:"27,582,914"},
  {raw:"348902715", indian:"34,89,02,715", intl:"348,902,715"},
  {raw:"7924510", indian:"79,24,510", intl:"7,924,510"},
  {raw:"1456708902", indian:"1,45,67,08,902", intl:"1,456,708,902"},
  {raw:"92004567", indian:"9,20,04,567", intl:"92,004,567"},
  {raw:"63050014", indian:"6,30,50,014", intl:"63,050,014"}
];

let st = {run:true, idx:0, score:0, lives:3, resolved:false, msg:"", msgType:"info", options:[]};

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function pairVariants(round){
  const wrong1 = {indian: round.intl, intl: round.indian};
  const wrong2 = {indian: round.indian.replace(/,/g,""), intl: round.intl};
  const wrong3 = {indian: round.indian, intl: round.intl.replace(/,/g,"")};
  return shuffle([{...round, ok:true}, wrong1, wrong2, wrong3]).slice(0,4);
}

function setupRound(){
  const round = ROUNDS[st.idx];
  st.options = pairVariants(round);
  st.resolved = false;
  st.msg = "";
  st.msgType = "info";
}

function choose(i){
  if(!st.run || st.resolved) return;
  const picked = st.options[i];
  st.resolved = true;
  if(picked.ok){
    st.score += 12;
    st.msg = "Relay checkpoint cleared. Both formats are correct.";
    st.msgType = "good";
  } else {
    st.lives -= 1;
    const r = ROUNDS[st.idx];
    st.msg = `Mismatch. Correct pair: Indian ${r.indian}, International ${r.intl}.`;
    st.msgType = "bad";
    if(st.lives<=0) st.run = false;
  }
  render(i);
}

function nextRound(){
  if(!st.resolved) return;
  st.idx += 1;
  if(st.idx >= ROUNDS.length){
    st.run = false;
    st.msg = "Relay completed!";
    st.msgType = "good";
    render(-1);
    return;
  }
  setupRound();
  render(-1);
}

function render(last){
  const done = !st.run;
  const round = ROUNDS[Math.min(st.idx, ROUNDS.length - 1)];
  sim.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="k">Round</div><div class="v">${Math.min(st.idx+1,ROUNDS.length)}/${ROUNDS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Mode</div><div class="v">Relay</div></div>
    </div>
    <div class="mission">
      <div class="digits">${round.raw}</div>
      <div class="note">Pick the card with both correct comma systems.</div>
    </div>
    <div class="opts">
      ${st.options.map((o,i)=>{
        const cls = st.resolved ? (o.ok ? "ok" : (i===last ? "bad" : "")) : "";
        return `<button class="opt ${cls}" data-i="${i}">
          <div class="t">Indian</div><div class="v">${o.indian}</div>
          <div class="t" style="margin-top:4px">International</div><div class="v">${o.intl}</div>
        </button>`;
      }).join("")}
    </div>
    <div class="actions">
      ${st.resolved ? `<button class="btn next" id="nextBtn">${st.idx===ROUNDS.length-1?"Finish Relay":"Next Round"}</button>` : ``}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Tip: verify both lines before you tap.</div>`}
  `;
  sim.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(parseInt(b.dataset.i,10)));
  const n = sim.querySelector("#nextBtn"); if(n) n.onclick = nextRound;
  // --- V5 Socratic coach: ask about the grouping rule, reveal the right card only if stuck ---
  if(!st.run){
    window.__eduRound={native:true,line:st.msg||"Relay completed!",voice:"Relay completed.",key:"done-"+st.idx};
  } else if(st.resolved){
    window.__eduRound={native:true,line:st.msg,voice:(st.msgType==="good"?"Correct.":"Check both formats next time."),submit:sim.querySelector("#nextBtn"),key:"res-"+st.idx};
  } else {
    const _ok=st.options.findIndex(o=>o.ok);
    window.__eduRound={native:true,hint:"Indian groups the last 3 digits then 2s; International groups in 3s. Which card has BOTH right?",hintVoice:"Which card has both formats correct?",line:"Pick the card where both the Indian and International commas are placed correctly.",voice:"Pick the card with both formats correct.",glow:sim.querySelector('.opt[data-i="'+_ok+'"]'),key:"r-"+st.idx};
  }
}

setupRound();
render(-1);
</script>
  <script src="edu-coach.js"></script>
</body>
</html>
