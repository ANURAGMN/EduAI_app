<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0ea5e9">
<title>Divisor Ladder Duel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#0ea5e9,#0284c7);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}.header p{font-size:12px;opacity:.92}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#ecfeff;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#0f766e;font-weight:700;text-transform:uppercase}.v{font-size:17px;font-weight:800;color:#0f172a}
.mission{background:#ecfeff;border:2px solid #99f6e4;border-radius:12px;padding:10px;margin-bottom:10px;font-size:12px;color:#134e4a}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:9px 10px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-weight:800;cursor:pointer}
.chip.sel{border-color:#0284c7;background:#e0f2fe;color:#0c4a6e}
.chip.bad{border-color:#ef4444;background:#fef2f2;color:#991b1b}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.box{background:#f8fafc;border:2px solid #cbd5e1;border-radius:10px;padding:8px}
.box h4{font-size:11px;color:#475569}.line{font-size:14px;font-weight:800;color:#0f172a;margin-top:6px}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.check{background:#0284c7;color:#fff}.next{background:#0f766e;color:#fff}.retry{background:#334155;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.4}
.good{background:#dcfce7;color:#166534}.badm{background:#fef2f2;color:#991b1b}.info{background:#eff6ff;color:#1e3a8a}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Divisor Ladder Duel</h1>
    <p>Pick valid divisors to climb each target ladder</p>
  </div>
  <div class="card" id="sim"></div>
</div>
<script>
const sim=document.getElementById('sim');
const ROUNDS=[
  {n:24},{n:36},{n:45},{n:48},{n:60}
];
let st={run:true,idx:0,score:0,lives:3,resolved:false,msg:'',msgType:'info',picked:[],mistakes:0};
function divisors(n){ const out=[]; for(let i=1;i<=n;i++) if(n%i===0) out.push(i); return out; }
function options(n){
  const good=divisors(n), bad=[n-1,n+1,n+2,n+3].filter(v=>v>1);
  return [...new Set([...good,...bad])].sort((a,b)=>a-b);
}
function setup(){ st.resolved=false; st.msg=''; st.msgType='info'; st.picked=[]; st.mistakes=0; }
function toggle(v){
  if(!st.run||st.resolved) return;
  const n=ROUNDS[st.idx].n;
  if(n%v!==0){ st.mistakes++; st.msg=`${v} is not a divisor of ${n}.`; st.msgType='badm'; render(); return; }
  if(st.picked.includes(v)) st.picked=st.picked.filter(x=>x!==v);
  else st.picked=[...st.picked,v].sort((a,b)=>a-b);
  render();
}
function check(){
  if(!st.run||st.resolved) return;
  const n=ROUNDS[st.idx].n, need=divisors(n);
  st.resolved=true;
  const ok=need.length===st.picked.length && need.every((v,i)=>v===st.picked[i]) && st.mistakes<=2;
  if(ok){ st.score+=15; st.msg='Perfect divisor ladder!'; st.msgType='good'; }
  else{ st.lives--; st.msg=`Need all divisors: ${need.join(', ')}`; st.msgType='badm'; if(st.lives<=0) st.run=false; }
  render();
}
function next(){ if(!st.resolved) return; st.idx++; if(st.idx>=ROUNDS.length){st.run=false; st.msg='Duel complete!'; st.msgType='good'; render(); return;} setup(); render(); }
function retry(){ if(st.run&&st.resolved){ setup(); render(); } }
function restart(){ st={run:true,idx:0,score:0,lives:3,resolved:false,msg:'',msgType:'info',picked:[],mistakes:0}; setup(); render(); }
function render(){
  const done=!st.run, r=ROUNDS[Math.min(st.idx,ROUNDS.length-1)], opts=options(r.n);
  sim.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="k">Round</div><div class="v">${Math.min(st.idx+1,ROUNDS.length)}/${ROUNDS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Mistakes</div><div class="v">${st.mistakes}</div></div>
    </div>
    <div class="mission">Mission: Build full divisor ladder for <b>${r.n}</b>. Keep wrong picks low.</div>
    <div class="chips">
      ${opts.map(v=>`<button class="chip ${st.picked.includes(v)?'sel':''} ${(st.msgType==='badm'&&r.n%v!==0)?'bad':''}" data-v="${v}" ${done||st.resolved?'disabled':''}>${v}</button>`).join('')}
    </div>
    <div class="row">
      <div class="box"><h4>Your ladder</h4><div class="line">${st.picked.join(' , ')||'...'}</div></div>
      <div class="box"><h4>Target number</h4><div class="line">${r.n}</div></div>
    </div>
    <div class="actions">
      ${done?`<button class="btn next" id="restartBtn">Restart</button>`:st.resolved?`<button class="btn retry" id="retryBtn">Retry</button><button class="btn next" id="nextBtn">${st.idx===ROUNDS.length-1?'Finish':'Next'}</button>`:`<button class="btn check" id="checkBtn">Check Ladder</button>`}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Tap number chips to include valid divisors.</div>`}
  `;
  sim.querySelectorAll('.chip').forEach(b=>b.onclick=()=>toggle(parseInt(b.dataset.v,10)));
  const c=sim.querySelector('#checkBtn'); if(c) c.onclick=check;
  const n=sim.querySelector('#nextBtn'); if(n) n.onclick=next;
  const rt=sim.querySelector('#retryBtn'); if(rt) rt.onclick=retry;
  const rs=sim.querySelector('#restartBtn'); if(rs) rs.onclick=restart;
}
setup(); render();
</script>
</body>
</html>
