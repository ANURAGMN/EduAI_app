<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>Triangle Congruence Detector</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#7c3aed,#5b21b6);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}.header h1{font-size:20px;font-weight:800}.header p{font-size:12px;opacity:.92}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#f5f3ff;border-radius:10px;padding:8px;text-align:center}.k{font-size:10px;color:#6d28d9;font-weight:700;text-transform:uppercase}.v{font-size:17px;font-weight:800;color:#0f172a}
.mission{background:#faf5ff;border:2px solid #ddd6fe;border-radius:12px;padding:10px;margin-bottom:10px;font-size:12px;color:#5b21b6}
.stage{height:250px;background:#fafafa;border:2px solid #cbd5e1;border-radius:12px;overflow:hidden}
svg{width:100%;height:100%;display:block;touch-action:none}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{padding:10px;border:2px solid #d1d5db;border-radius:10px;background:#fff;font-weight:800;cursor:pointer}
.opt.sel{border-color:#7c3aed;background:#f3e8ff;color:#5b21b6}
.opt.ok{border-color:#16a34a;background:#dcfce7;color:#166534}
.opt.bad{border-color:#dc2626;background:#fef2f2;color:#991b1b}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.check{background:#7c3aed;color:#fff}.next{background:#0f766e;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.4}
.good{background:#dcfce7;color:#166534}.bad{background:#fef2f2;color:#991b1b}.info{background:#eff6ff;color:#1e3a8a}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Triangle Congruence Detector</h1>
    <p>Drag one triangle and detect valid congruence rule</p>
  </div>
  <div class="card" id="sim"></div>
</div>
<script>
const sim=document.getElementById('sim');
const ROUNDS=[
  {type:'SSS',ok:'SSS'},
  {type:'SAS',ok:'SAS'},
  {type:'ASA',ok:'ASA'},
  {type:'RHS',ok:'RHS'},
  {type:'AAA',ok:'Not Congruent'}
];
const RULES=['SSS','SAS','ASA','RHS','Not Congruent'];
let st={run:true,idx:0,score:0,lives:3,pick:null,resolved:false,msg:'',msgType:'info',dx:0,dy:0};
let drag=false;
function setup(){ st.pick=null; st.resolved=false; st.msg=''; st.msgType='info'; st.dx=-30+Math.random()*60; st.dy=-25+Math.random()*50; }
function choose(i){ if(!st.run||st.resolved) return; st.pick=i; render(); }
function check(){
  if(!st.run||st.resolved||st.pick===null) return;
  const r=ROUNDS[st.idx]; st.resolved=true;
  if(RULES[st.pick]===r.ok){ st.score+=15; st.msg='Correct congruence decision.'; st.msgType='good'; }
  else{ st.lives--; st.msg=`Expected: ${r.ok}`; st.msgType='bad'; if(st.lives<=0) st.run=false; }
  render();
}
function next(){ if(!st.resolved) return; st.idx++; if(st.idx>=ROUNDS.length){st.run=false; st.msg='Detector complete!'; st.msgType='good'; render(); return;} setup(); render(); }
function restart(){ st={run:true,idx:0,score:0,lives:3,pick:null,resolved:false,msg:'',msgType:'info',dx:0,dy:0}; setup(); render(); }
function desc(t){ return t==='AAA'?'Same angles only':`${t} given`; }
function render(){
  const done=!st.run, r=ROUNDS[Math.min(st.idx,ROUNDS.length-1)];
  sim.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="k">Round</div><div class="v">${Math.min(st.idx+1,ROUNDS.length)}/${ROUNDS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Given</div><div class="v">${r.type}</div></div>
    </div>
    <div class="mission">Mission: Drag the purple triangle and decide if pair is congruent by <b>${desc(r.type)}</b>.</div>
    <div class="stage">
      <svg id="svg" viewBox="0 0 400 250">
        <rect x="0" y="0" width="400" height="250" fill="#fafafa"/>
        <polygon points="80,200 150,80 220,200" fill="rgba(59,130,246,.2)" stroke="#2563eb" stroke-width="3"/>
        <polygon id="movTri" points="${240+st.dx},200${' '} ${310+st.dx},80${' '} ${380+st.dx},200" fill="rgba(124,58,237,.2)" stroke="#7c3aed" stroke-width="3" transform="translate(0,${st.dy})"/>
        <text x="70" y="220" font-size="12" fill="#1d4ed8">Triangle A</text>
        <text x="${250+st.dx}" y="${220+st.dy}" font-size="12" fill="#6d28d9">Triangle B</text>
      </svg>
    </div>
    <div class="opts">
      ${RULES.map((o,i)=>`<button class="opt ${st.resolved?(o===r.ok?'ok':(i===st.pick?'bad':'')):(i===st.pick?'sel':'')}" data-i="${i}">${o}</button>`).join('')}
    </div>
    <div class="actions">
      ${done?`<button class="btn next" id="restartBtn">Restart</button>`:st.resolved?`<button class="btn next" id="nextBtn">${st.idx===ROUNDS.length-1?'Finish':'Next'}</button>`:`<button class="btn check" id="checkBtn">Check Rule</button>`}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Move triangle B and select the matching rule.</div>`}
  `;
  const svg=sim.querySelector('#svg');
  if(svg&&!done&&!st.resolved){
    const move=(e)=>{
      const rct=svg.getBoundingClientRect();
      const x=(e.clientX-rct.left)*(400/rct.width), y=(e.clientY-rct.top)*(250/rct.height);
      st.dx=Math.max(-90,Math.min(20,x-310)); st.dy=Math.max(-50,Math.min(40,y-150)); render();
    };
    svg.onpointerdown=e=>{drag=true;svg.setPointerCapture(e.pointerId);move(e);};
    svg.onpointermove=e=>{if(drag) move(e);};
    svg.onpointerup=()=>drag=false; svg.onpointercancel=()=>drag=false;
  }
  sim.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(parseInt(b.dataset.i,10)));
  const c=sim.querySelector('#checkBtn'); if(c) c.onclick=check;
  const n=sim.querySelector('#nextBtn'); if(n) n.onclick=next;
  const rs=sim.querySelector('#restartBtn'); if(rs) rs.onclick=restart;
  try{
    var _r=ROUNDS[Math.min(st.idx,ROUNDS.length-1)], _idx=RULES.indexOf(_r.ok);
    var _g=[].slice.call(sim.querySelectorAll('.opt')).find(function(b){return (+b.dataset.i)===_idx;});
    var _ck=sim.querySelector('#checkBtn');
    if(!st.run){ window.__eduRound={native:true,line:(st.msg||'Detector complete!'),voice:(st.msgType==='good'?'Done.':'Try again.'),glow:sim.querySelector('#restartBtn'),submit:sim.querySelector('#restartBtn'),key:'over-'+st.idx}; }
    else if(st.resolved){ window.__eduRound={native:true,line:st.msg,voice:(st.msgType==='good'?'Correct.':'Not quite.'),submit:(sim.querySelector('#nextBtn')||sim.querySelector('#retryBtn')),key:'res-'+st.idx}; }
    else { window.__eduRound={native:true,
      hint:'Which rule proves these triangles congruent - or are they not congruent?',hintVoice:'Which congruence rule applies?',
      why:(_r.ok==='Not Congruent')?'Equal angles alone (AAA) fix the shape but not the size, so the triangles are only similar, not congruent.':(_r.ok+' fixes the triangle exactly, so the two are congruent.'),
      detail:'Step 1 - Read which parts are marked equal (sides S, angles A, a right angle R with hypotenuse H).\nStep 2 - Match to a rule: SSS, SAS, ASA, or RHS.\nStep 3 - If only angles match (AAA), choose Not Congruent.\nWhy it works - three sides, or two sides and the included angle, pin the triangle; three angles do not fix size.\nTip - the equal parts must be in the right positions (the included side or angle).',
      line:_r.ok+' - '+((_r.ok==='Not Congruent')?'equal angles do not fix the size.':'this fixes the triangle exactly.'),
      voice:'The answer is '+_r.ok+'.',
      glow:_g,submit:(st.pick!==null?_ck:null),key:'r-'+st.idx}; }
  }catch(e){}
}
setup(); render();
</script>
  <script src="edu-coach.js"></script>
</body>
</html>
