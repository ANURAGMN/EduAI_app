<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0ea5e9">
<title>Mixed Fraction Converter Track</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#0ea5e9,#0284c7);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}.header p{font-size:12px;opacity:.92}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#ecfeff;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#0f766e;font-weight:700;text-transform:uppercase}.v{font-size:17px;font-weight:800;color:#0f172a}
.mission{background:#ecfeff;border:2px solid #99f6e4;border-radius:12px;padding:10px;margin-bottom:10px;font-size:12px;color:#134e4a}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box{background:#f8fafc;border:2px solid #cbd5e1;border-radius:10px;padding:8px}
.box h4{font-size:12px;color:#334155}
.val{font-size:24px;text-align:center;font-family:'Courier New',monospace;font-weight:900;color:#0f172a;margin-top:8px}
.ctrl{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
.b{padding:8px;border:none;border-radius:8px;background:#e0f2fe;color:#075985;font-weight:800;cursor:pointer}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.check{background:#0284c7;color:#fff}.next{background:#0f766e;color:#fff}.retry{background:#334155;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.4}
.good{background:#dcfce7;color:#166534}.bad{background:#fef2f2;color:#991b1b}.info{background:#eff6ff;color:#1e3a8a}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Mixed Fraction Converter Track</h1>
    <p>Convert mixed numbers to improper fractions and back</p>
  </div>
  <div class="card" id="sim"></div>
</div>
<script>
const sim=document.getElementById('sim');
const ROUNDS=[
  {whole:1,num:1,den:2},
  {whole:2,num:3,den:4},
  {whole:3,num:2,den:5},
  {whole:1,num:5,den:6},
  {whole:4,num:1,den:3}
];
let st={run:true,idx:0,score:0,lives:3,resolved:false,msg:'',msgType:'info',n:1,d:2};
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function setup(){ const r=ROUNDS[st.idx]; st.n=r.whole*r.den+r.num; st.d=r.den; st.resolved=false; st.msg=''; st.msgType='info'; }
function nudgeN(d){ if(!st.run||st.resolved) return; st.n=clamp(st.n+d,1,80); render(); }
function nudgeD(d){ if(!st.run||st.resolved) return; st.d=clamp(st.d+d,2,20); render(); }
function check(){
  if(!st.run||st.resolved) return;
  const r=ROUNDS[st.idx], needN=r.whole*r.den+r.num;
  st.resolved=true;
  if(st.n===needN && st.d===r.den){ st.score+=12; st.msg='Correct conversion!'; st.msgType='good'; }
  else { st.lives--; st.msg=`Need ${needN}/${r.den}`; st.msgType='bad'; if(st.lives<=0) st.run=false; }
  render();
}
function next(){ if(!st.resolved) return; st.idx++; if(st.idx>=ROUNDS.length){ st.run=false; st.msg='Track complete!'; st.msgType='good'; render(); return;} setup(); render(); }
function retry(){ if(st.run&&st.resolved){ setup(); render(); } }
function restart(){ st={run:true,idx:0,score:0,lives:3,resolved:false,msg:'',msgType:'info',n:1,d:2}; setup(); render(); }
function render(){
  const done=!st.run, r=ROUNDS[Math.min(st.idx,ROUNDS.length-1)];
  sim.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="k">Round</div><div class="v">${Math.min(st.idx+1,ROUNDS.length)}/${ROUNDS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Mode</div><div class="v">Convert</div></div>
    </div>
    <div class="mission">Build improper form of mixed number <b>${r.whole} ${r.num}/${r.den}</b>.</div>
    <div class="grid">
      <div class="box">
        <h4>Target mixed</h4>
        <div class="val">${r.whole} ${r.num}/${r.den}</div>
      </div>
      <div class="box">
        <h4>Your improper</h4>
        <div class="val">${st.n}/${st.d}</div>
        <div class="ctrl">
          <button class="b" id="nMinus">N -1</button><button class="b" id="nPlus">N +1</button>
          <button class="b" id="dMinus">D -1</button><button class="b" id="dPlus">D +1</button>
        </div>
      </div>
    </div>
    <div class="actions">
      ${done?`<button class="btn next" id="restartBtn">Restart</button>`:st.resolved?`<button class="btn retry" id="retryBtn">Retry</button><button class="btn next" id="nextBtn">${st.idx===ROUNDS.length-1?'Finish':'Next'}</button>`:`<button class="btn check" id="checkBtn">Check Conversion</button>`}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Use N/D controls to match exact improper fraction.</div>`}
  `;
  const nm=sim.querySelector('#nMinus'); if(nm) nm.onclick=()=>nudgeN(-1);
  const np=sim.querySelector('#nPlus'); if(np) np.onclick=()=>nudgeN(1);
  const dm=sim.querySelector('#dMinus'); if(dm) dm.onclick=()=>nudgeD(-1);
  const dp=sim.querySelector('#dPlus'); if(dp) dp.onclick=()=>nudgeD(1);
  const c=sim.querySelector('#checkBtn'); if(c) c.onclick=check;
  const n=sim.querySelector('#nextBtn'); if(n) n.onclick=next;
  const retryBtn=sim.querySelector('#retryBtn'); if(retryBtn) retryBtn.onclick=retry;
  const rs=sim.querySelector('#restartBtn'); if(rs) rs.onclick=restart;
}
setup(); render();
</script>
</body>
</html>
