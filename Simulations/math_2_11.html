<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#dc2626">
<title>Sign Flip Bracket Sprint</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#dc2626,#7f1d1d);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}
.header p{font-size:12px;opacity:.92}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#fef2f2;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#991b1b;font-weight:700;text-transform:uppercase}
.v{font-size:18px;font-weight:800;color:#111827}
.mission{background:linear-gradient(135deg,#fef2f2,#fee2e2);border:2px solid #fca5a5;border-radius:12px;padding:10px;margin-bottom:10px}
.expr{font-family:'Courier New',monospace;font-size:20px;font-weight:900;color:#7f1d1d;text-align:center;margin-top:6px}
.opts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.opt{padding:10px;border:2px solid #d1d5db;border-radius:10px;background:#fff;cursor:pointer;font-family:'Courier New',monospace;font-weight:800;text-align:left}
.opt.sel{border-color:#dc2626;background:#fee2e2;color:#7f1d1d}
.opt.ok{border-color:#16a34a;background:#dcfce7;color:#166534}
.opt.bad{border-color:#dc2626;background:#fef2f2;color:#991b1b}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.btn.check{background:#dc2626;color:#fff}
.btn.next{background:#0ea5e9;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.45}
.msg.good{background:#dcfce7;color:#166534}
.msg.bad{background:#fef2f2;color:#991b1b}
.msg.info{background:#eff6ff;color:#1e3a8a}
.insight{margin-top:12px;background:linear-gradient(135deg,#fef2f2,#fee2e2);border-left:4px solid #dc2626;border-radius:12px;padding:12px;font-size:12px;color:#111827;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Sign Flip Bracket Sprint</h1>
    <p>Remove brackets with correct sign changes</p>
  </div>
  <div class="card" id="sim"></div>
  <div class="insight"><b>Concept:</b> minus before bracket flips every sign inside, plus before bracket keeps signs.</div>
</div>
<script>
const sim = document.getElementById('sim');
const ROUNDS = [
  {q:'200-(40+3)', ans:'200-40-3'},
  {q:'500-(250-100)', ans:'500-250+100'},
  {q:'28+(35-10)', ans:'28+35-10'},
  {q:'27-(8-3)', ans:'27-8+3'},
  {q:'90-(-10+30)', ans:'90+10-30'},
  {q:'-22-(12+10)+22', ans:'-22-12-10+22'}
];
let st={run:true,idx:0,score:0,lives:3,pick:null,resolved:false,msg:'',msgType:'info',opts:[]};
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}
function setup(){
  const r=ROUNDS[st.idx];
  st.pick=null; st.resolved=false; st.msg=''; st.msgType='info';
  const w1=r.ans.replace(/\+/g,'#').replace(/-/g,'+').replace(/#/g,'-');
  const w2=r.ans.replace(/\+/g,'-');
  const w3=r.ans.replace(/-/g,'+');
  st.opts=shuffle([r.ans,w1,w2,w3]);
}
function choose(i){ if(!st.run||st.resolved) return; st.pick=i; render(); }
function check(){
  if(!st.run||st.resolved||st.pick===null) return;
  const r=ROUNDS[st.idx];
  st.resolved=true;
  if(st.opts[st.pick]===r.ans){ st.score+=12; st.msg='Correct sign handling!'; st.msgType='good'; }
  else { st.lives--; st.msg=`Correct form: ${r.ans}`; st.msgType='bad'; if(st.lives<=0) st.run=false; }
  render();
}
function next(){
  if(!st.resolved) return;
  st.idx++;
  if(st.idx>=ROUNDS.length){ st.run=false; st.msg='Sprint complete!'; st.msgType='good'; render(); return; }
  setup(); render();
}
function restart(){ st={run:true,idx:0,score:0,lives:3,pick:null,resolved:false,msg:'',msgType:'info',opts:[]}; setup(); render(); }
function render(){
  const done=!st.run;
  const r=ROUNDS[Math.min(st.idx,ROUNDS.length-1)];
  sim.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="k">Round</div><div class="v">${Math.min(st.idx+1,ROUNDS.length)}/${ROUNDS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Mode</div><div class="v">Flip</div></div>
    </div>
    <div class="mission">
      <div style="font-size:12px;color:#991b1b">Remove bracket correctly</div>
      <div class="expr">${r.q}</div>
    </div>
    <div class="opts">
      ${st.opts.map((o,i)=>{
        const cls=st.resolved?(o===r.ans?'ok':(i===st.pick?'bad':'')):(i===st.pick?'sel':'');
        return `<button class="opt ${cls}" data-i="${i}">${o}</button>`;
      }).join('')}
    </div>
    <div class="actions">
      ${done?`<button class="btn next" id="restartBtn">Restart</button>`:(st.resolved?`<button class="btn next" id="nextBtn">${st.idx===ROUNDS.length-1?'Finish':'Next'}</button>`:`<button class="btn check" id="checkBtn">Check Signs</button>`)}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Pick transformed expression and check.</div>`}
  `;
  sim.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(parseInt(b.dataset.i,10)));
  const c=sim.querySelector('#checkBtn'); if(c) c.onclick=check;
  const n=sim.querySelector('#nextBtn'); if(n) n.onclick=next;
  const rbtn=sim.querySelector('#restartBtn'); if(rbtn) rbtn.onclick=restart;
}
setup();
render();
</script>
  <script src="edu-coach.js"></script>
</body>
</html>
