<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0284c7">
<title>Fraction Compare Numberline Race</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#0284c7,#0ea5e9);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}.header h1{font-size:20px;font-weight:800}.header p{font-size:12px;opacity:.92}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#ecfeff;border-radius:10px;padding:8px;text-align:center}.k{font-size:10px;color:#0f766e;font-weight:700;text-transform:uppercase}.v{font-size:17px;font-weight:800;color:#0f172a}
.mission{background:#ecfeff;border:2px solid #67e8f9;border-radius:12px;padding:10px;margin-bottom:10px;font-size:12px;color:#134e4a}
.line{position:relative;height:58px;background:#f8fafc;border:2px solid #cbd5e1;border-radius:10px;padding:10px}
.track{position:absolute;left:16px;right:16px;top:28px;height:4px;background:#94a3b8;border-radius:999px}
.tick{position:absolute;top:20px;width:2px;height:20px;background:#64748b}
.tok{position:absolute;top:8px;transform:translateX(-50%);padding:6px 8px;border-radius:8px;font-size:12px;font-weight:800;color:#fff;cursor:pointer;border:none}
.a{background:#0284c7}.b{background:#16a34a}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.mini{padding:8px;border:none;border-radius:8px;background:#dbeafe;color:#1d4ed8;font-weight:800;cursor:pointer}
.labels{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.lab{background:#f8fafc;border:2px solid #cbd5e1;border-radius:10px;padding:8px;text-align:center;font-family:'Courier New',monospace;font-weight:900}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.check{background:#0284c7;color:#fff}.next{background:#0f766e;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.4}
.good{background:#dcfce7;color:#166534}.bad{background:#fef2f2;color:#991b1b}.info{background:#eff6ff;color:#1e3a8a}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Fraction Compare Numberline Race</h1>
    <p>Move two fraction markers and compare correctly</p>
  </div>
  <div class="card" id="sim"></div>
</div>
<script>
const sim=document.getElementById('sim');
const ROUNDS=[
  {a:[1,3],b:[1,2]},
  {a:[3,5],b:[2,3]},
  {a:[5,8],b:[3,4]},
  {a:[7,10],b:[2,3]},
  {a:[4,9],b:[5,12]}
];
let st={run:true,idx:0,score:0,lives:3,posA:.2,posB:.8,pick:null,resolved:false,msg:'',msgType:'info'};
function val(f){return f[0]/f[1]}
function clamp(x){return Math.max(0,Math.min(1,x))}
function setup(){const r=ROUNDS[st.idx]; st.posA=val(r.a); st.posB=val(r.b); st.pick=null; st.resolved=false; st.msg=''; st.msgType='info';}
function move(which,d){if(!st.run||st.resolved)return; if(which==='A') st.posA=clamp(st.posA+d); else st.posB=clamp(st.posB+d); render();}
function choose(v){if(!st.run||st.resolved)return; st.pick=v; render();}
function check(){
  if(!st.run||st.resolved||!st.pick) return;
  const r=ROUNDS[st.idx], real=val(r.a)>val(r.b)?'A>B':(val(r.a)<val(r.b)?'A<B':'A=B');
  st.resolved=true;
  if(st.pick===real){st.score+=12; st.msg='Correct comparison!'; st.msgType='good';}
  else{st.lives--; st.msg=`Actual relation is ${real.replace('A',r.a[0]+'/'+r.a[1]).replace('B',r.b[0]+'/'+r.b[1])}.`; st.msgType='bad'; if(st.lives<=0) st.run=false;}
  render();
}
function next(){if(!st.resolved)return; st.idx++; if(st.idx>=ROUNDS.length){st.run=false; st.msg='Race complete!'; st.msgType='good'; render(); return;} setup(); render();}
function restart(){st={run:true,idx:0,score:0,lives:3,posA:.2,posB:.8,pick:null,resolved:false,msg:'',msgType:'info'}; setup(); render();}
function render(){
  const done=!st.run, r=ROUNDS[Math.min(st.idx,ROUNDS.length-1)];
  sim.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="k">Round</div><div class="v">${Math.min(st.idx+1,ROUNDS.length)}/${ROUNDS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Goal</div><div class="v">Compare</div></div>
    </div>
    <div class="mission">Mission: compare <b>${r.a[0]}/${r.a[1]}</b> and <b>${r.b[0]}/${r.b[1]}</b>. Use nudges to place markers on [0,1], then choose relation.</div>
    <div class="line">
      <div class="track"></div>
      ${[0,.25,.5,.75,1].map(t=>`<div class="tick" style="left:${16+t*calc(100)}%"></div>`).join('')}
      <button class="tok a" style="left:${16+st.posA*calc(100)}%" ${done||st.resolved?'disabled':''}>${r.a[0]}/${r.a[1]}</button>
      <button class="tok b" style="left:${16+st.posB*calc(100)}%" ${done||st.resolved?'disabled':''}>${r.b[0]}/${r.b[1]}</button>
    </div>
    <div class="controls">
      <button class="mini" id="aM">A -0.01</button><button class="mini" id="aP">A +0.01</button>
      <button class="mini" id="bM">B -0.01</button><button class="mini" id="bP">B +0.01</button>
    </div>
    <div class="labels">
      <div class="lab">A ≈ ${st.posA.toFixed(3)}</div>
      <div class="lab">B ≈ ${st.posB.toFixed(3)}</div>
    </div>
    <div class="controls">
      <button class="mini ${st.pick==='A>B'?'sel':''}" id="gt">A > B</button>
      <button class="mini ${st.pick==='A<B'?'sel':''}" id="lt">A < B</button>
      <button class="mini ${st.pick==='A=B'?'sel':''}" id="eq">A = B</button>
      <button class="mini" id="resetBtn">Reset</button>
    </div>
    <div class="actions">
      ${done?`<button class="btn next" id="restartBtn">Restart</button>`:(st.resolved?`<button class="btn next" id="nextBtn">${st.idx===ROUNDS.length-1?'Finish':'Next'}</button>`:`<button class="btn check" id="checkBtn">Check Compare</button>`)}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Tune positions, choose relation, and check.</div>`}
  `;
  const wire=(id,fn)=>{const el=sim.querySelector('#'+id); if(el) el.onclick=fn;};
  wire('aM',()=>move('A',-0.01)); wire('aP',()=>move('A',0.01)); wire('bM',()=>move('B',-0.01)); wire('bP',()=>move('B',0.01));
  wire('gt',()=>choose('A>B')); wire('lt',()=>choose('A<B')); wire('eq',()=>choose('A=B'));
  wire('resetBtn',()=>{if(!done&&!st.resolved){setup(); render();}});
  wire('checkBtn',check); wire('nextBtn',next); wire('restartBtn',restart);
  try{
    var _r=ROUNDS[Math.min(st.idx,ROUNDS.length-1)];
    var _va=val(_r.a),_vb=val(_r.b);
    var _rel=_va>_vb?'A>B':(_va<_vb?'A<B':'A=B');
    var _relBtn=sim.querySelector(_rel==='A>B'?'#gt':(_rel==='A<B'?'#lt':'#eq'));
    var _aStr=_r.a[0]+'/'+_r.a[1],_bStr=_r.b[0]+'/'+_r.b[1];
    var _sym=_rel==='A>B'?'>':(_rel==='A<B'?'<':'=');
    if(!st.run){ window.__eduRound={native:true,line:(st.msg||'Race complete!'),voice:(st.msgType==='good'?'Done.':'Try again.'),glow:sim.querySelector('#restartBtn'),submit:sim.querySelector('#restartBtn'),key:'over-'+st.idx}; }
    else if(st.resolved){ window.__eduRound={native:true,line:st.msg,voice:(st.msgType==='good'?'Correct.':'Not quite.'),submit:sim.querySelector('#nextBtn'),key:'res-'+st.idx}; }
    else { window.__eduRound={native:true,
      hint:'Is '+_aStr+' less than, equal to, or greater than '+_bStr+'?',hintVoice:'Compare the two fractions.',
      why:'Compare with a common denominator (or cross-multiply); the larger equivalent numerator wins.',
      detail:'Step 1 - Give both a common denominator, or cross-multiply.\nStep 2 - Compare the numerators.\nStep 3 - Tap the matching relation, then Check.\nWhy it works - same denominator means equal-size pieces, so the count decides.\nTip - cross-multiply: a/b vs c/d compares a*d with b*c.',
      line:_aStr+' '+_sym+' '+_bStr+'.',
      voice:'Choose '+_aStr+' '+_sym+' '+_bStr+'.',
      glow:(st.pick?sim.querySelector('#checkBtn'):_relBtn),submit:(st.pick?sim.querySelector('#checkBtn'):null),key:'m-'+st.idx}; }
  }catch(e){}
}
function calc(v){return v*3.68;}
setup(); render();
</script>
  <script src="edu-coach.js"></script>
</body>
</html>
