<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>Associative Chain Reactor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#7c3aed,#2563eb);min-height:100vh}
#app{max-width:420px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}
.header p{font-size:12px;opacity:.9}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#f5f3ff;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#6d28d9;font-weight:700;text-transform:uppercase}
.v{font-size:18px;font-weight:800;color:#111827}
.mission{background:linear-gradient(135deg,#ede9fe,#dbeafe);border:2px solid #c4b5fd;border-radius:12px;padding:10px;margin-bottom:10px}
.mission h3{font-size:14px;color:#5b21b6}
.expr{font-family:'Courier New',monospace;background:#0f172a;color:#fff;border-radius:12px;padding:10px;margin-top:6px;font-size:18px;font-weight:800;text-align:center}
.choices{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.choice{padding:10px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-family:'Courier New',monospace;font-size:14px;font-weight:800;color:#1f2937;cursor:pointer}
.choice:hover{border-color:#a78bfa}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.btn.start{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff}
.btn.next{background:#16a34a;color:#fff}
.btn.retry{background:#e2e8f0;color:#374151}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.45}
.msg.good{background:#dcfce7;color:#166534}
.msg.bad{background:#fef2f2;color:#991b1b}
.msg.info{background:#eff6ff;color:#1e3a8a}
.insight{margin-top:12px;background:linear-gradient(135deg,#f5f3ff,#ede9fe);border-left:4px solid #7c3aed;border-radius:12px;padding:12px;font-size:12px;color:#0f172a}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Associative Chain Reactor</h1>
    <p>Regroup terms to keep the chain stable</p>
  </div>
  <div class="card" id="sim"></div>
  <div class="insight"><b>Concept:</b> addition is associative — grouping changes can be made without changing total value.</div>
</div>
<script>
const sim = document.getElementById('sim');
const MISSIONS = [
  {base:[12,-7,5], options:[[12+(-7),5],[12,(-7)+5]], answer:0},
  {base:[30,18,-4], options:[[30+18,-4],[30,18+(-4)]], answer:0},
  {base:[9,-6,-2], options:[[9+(-6),-2],[9,(-6)+(-2)]], answer:0},
  {base:[21,-15,8], options:[[21+(-15),8],[21,(-15)+8]], answer:0},
  {base:[14,-8,-5], options:[[14+(-8),-5],[14,(-8)+(-5)]], answer:0}
];
let st={run:false,idx:0,score:0,lives:3,resolved:false,msg:'',msgType:'info'};

function val(a){return a.reduce((x,y)=>x+y,0);}
function expr(arr){return `(${arr[0]}) + (${arr[1]})`;}
function start(){st={run:true,idx:0,score:0,lives:3,resolved:false,msg:'',msgType:'info'};render();}
function select(i){
  if(!st.run||st.resolved) return;
  const m=MISSIONS[st.idx];
  const v=val([val(m.options[i][0] instanceof Array?m.options[i][0]:[m.options[i][0]]), m.options[i][1]]);
  const target=val(m.base);
  st.resolved=true;
  if(v===target){ st.score+=12; st.msg='Stable regrouping! Value preserved.'; st.msgType='good'; }
  else { st.lives--; st.msg='Unstable regrouping. Value changed.'; st.msgType='bad'; if(st.lives<=0) st.run=false; }
  render();
}
function next(){ if(!st.resolved) return; st.idx++; if(st.idx>=MISSIONS.length){ st.run=false; st.msg='All reactors stabilized!'; st.msgType='good'; } else { st.resolved=false; st.msg=''; } render(); }
function retry(){ if(!st.resolved) return; st.resolved=false; st.msg=''; st.msgType='info'; render(); }

function render(){
  const done=!st.run;
  const m=MISSIONS[Math.min(st.idx, MISSIONS.length-1)];
  const baseVal=val(m.base);
  const sgn = (n)=> n<0 ? `(−${-n})` : `${n}`;
  // Show the true regrouping EXPRESSIONS (not evaluated partials): (a+b)+c vs a+(b+c).
  const o0 = `(${sgn(m.base[0])} + ${sgn(m.base[1])}) + ${sgn(m.base[2])}`;
  const o1 = `${sgn(m.base[0])} + (${sgn(m.base[1])} + ${sgn(m.base[2])})`;
  sim.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="k">Mission</div><div class="v">${Math.min(st.idx+1,MISSIONS.length)}/${MISSIONS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Base</div><div class="v">${baseVal}</div></div>
    </div>
    <div class="mission">
      <h3>Both regroupings keep the same total — tap either</h3>
      <div class="expr">${sgn(m.base[0])} + ${sgn(m.base[1])} + ${sgn(m.base[2])}</div>
    </div>
    <div class="choices">
      ${done?``:`<button class="choice" data-i="0">${o0}</button><button class="choice" data-i="1">${o1}</button>`}
    </div>
    <div class="actions">
      ${done?`<button class="btn start" id="startBtn">Start Reactor Run</button>`:(st.resolved?`<button class="btn retry" id="retryBtn">Retry</button><button class="btn next" id="nextBtn">Next Mission</button>`:``)}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Regrouping never changes the total — that's associativity. Tap either.</div>`}
  `;
  sim.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>select(parseInt(b.dataset.i,10)));
  const s=sim.querySelector('#startBtn'); if(s) s.onclick=start;
  const n=sim.querySelector('#nextBtn'); if(n) n.onclick=next;
  const r=sim.querySelector('#retryBtn'); if(r) r.onclick=retry;
  // --- V5 Socratic coach: addition is associative, so regrouping preserves the total ---
  if(!st.run){
    window.__eduRound={native:true,line:(st.idx>=MISSIONS.length?(st.msg||"All reactors stabilized!"):"Tap Start Reactor Run to begin."),voice:(st.idx>=MISSIONS.length?"Series complete.":"Tap start."),glow:sim.querySelector('#startBtn'),key:(st.idx>=MISSIONS.length?"done":"start")+"-"+st.idx};
  } else if(st.resolved){
    window.__eduRound={native:true,line:st.msg,voice:(st.msgType==='good'?"Value preserved.":"That changed the value."),submit:sim.querySelector('#nextBtn'),key:"res-"+st.idx};
  } else {
    window.__eduRound={native:true,hint:`Addition is associative — does regrouping (${m.base[0]}) + (${m.base[1]}) + (${m.base[2]}) change the total?`,hintVoice:"Does regrouping change the total?",why:"Addition is associative: how you group the numbers you add never changes the total.",detail:`Step 1 — Add all three: ${m.base[0]} + ${m.base[1]} + ${m.base[2]} = ${m.base[0]+m.base[1]+m.base[2]}.\nStep 2 — Group the first two or the last two: (${m.base[0]} + ${m.base[1]}) or (${m.base[1]} + ${m.base[2]}) — either way.\nStep 3 — Both regroupings still total ${m.base[0]+m.base[1]+m.base[2]}, so tap a choice to confirm.\nWhy it works — associativity means the grouping of additions doesn't affect the sum.\nTip — regroup so you can add the easy pair first.`,line:"Both groupings keep the same total — tap either to confirm.",voice:"Both keep the same total.",glow:sim.querySelector('.choice[data-i="0"]'),key:"m-"+st.idx};
  }
}
start();
</script>
  <script src="edu-coach.js"></script>
</body>
</html>
