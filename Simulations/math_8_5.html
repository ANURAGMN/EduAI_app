<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Fraction of Quantity Rescue</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#0f766e,#115e59);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}.header p{font-size:12px;opacity:.92}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#ecfeff;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#0f766e;font-weight:700;text-transform:uppercase}.v{font-size:17px;font-weight:800;color:#0f172a}
.mission{background:#ecfeff;border:2px solid #99f6e4;border-radius:12px;padding:10px;margin-bottom:10px;font-size:12px;color:#134e4a}
.tray{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:10px 0}
.cell{height:34px;border:2px solid #cbd5e1;border-radius:8px;background:#f8fafc;cursor:pointer}
.cell.on{background:#14b8a6;border-color:#0f766e}
.legend{font-size:12px;color:#334155}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.check{background:#0f766e;color:#fff}.next{background:#0284c7;color:#fff}.retry{background:#334155;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.4}
.good{background:#dcfce7;color:#166534}.bad{background:#fef2f2;color:#991b1b}.info{background:#eff6ff;color:#1e3a8a}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Fraction of Quantity Rescue</h1>
    <p>Select exactly the fractional part of a set</p>
  </div>
  <div class="card" id="sim"></div>
</div>
<script>
const sim=document.getElementById('sim');
const MISSIONS=[
  {frac:[1,3], total:12},
  {frac:[2,5], total:15},
  {frac:[3,4], total:16},
  {frac:[5,8], total:24},
  {frac:[7,10], total:20}
];
let st={run:true,idx:0,score:0,lives:3,pick:[],resolved:false,msg:'',msgType:'info'};
function setup(){ const m=MISSIONS[st.idx]; st.pick=Array(m.total).fill(false); st.resolved=false; st.msg=''; st.msgType='info'; }
function need(){ const m=MISSIONS[Math.min(st.idx,MISSIONS.length-1)]; return (m.frac[0]*m.total)/m.frac[1]; }
function toggle(i){ if(!st.run||st.resolved) return; st.pick[i]=!st.pick[i]; render(); }
function check(){
  if(!st.run||st.resolved) return;
  const chosen=st.pick.filter(Boolean).length, target=need();
  st.resolved=true;
  if(chosen===target){ st.score+=12; st.msg=`Great! You rescued ${chosen} items.`; st.msgType='good'; }
  else { st.lives--; st.msg=`Need ${target}, but selected ${chosen}.`; st.msgType='bad'; if(st.lives<=0) st.run=false; }
  render();
}
function next(){
  if(!st.resolved) return;
  st.idx++;
  if(st.idx>=MISSIONS.length){ st.run=false; st.msg='All rescues complete!'; st.msgType='good'; render(); return; }
  setup(); render();
}
function retry(){ if(!st.run||!st.resolved) return; setup(); render(); }
function restart(){ st={run:true,idx:0,score:0,lives:3,pick:[],resolved:false,msg:'',msgType:'info'}; setup(); render(); }
function render(){
  const done=!st.run, m=MISSIONS[Math.min(st.idx,MISSIONS.length-1)], chosen=st.pick.filter(Boolean).length;
  sim.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="k">Round</div><div class="v">${Math.min(st.idx+1,MISSIONS.length)}/${MISSIONS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Chosen</div><div class="v">${chosen}</div></div>
    </div>
    <div class="mission">Mission: Select <b>${m.frac[0]}/${m.frac[1]}</b> of <b>${m.total}</b> emergency kits.</div>
    <div class="tray">${Array.from({length:m.total},(_,i)=>`<button class="cell ${st.pick[i]?'on':''}" data-i="${i}"></button>`).join('')}</div>
    <div class="legend">Fill the right number of cells.</div>
    <div class="actions">
      ${done?`<button class="btn next" id="restartBtn">Restart</button>`:st.resolved?`<button class="btn retry" id="retryBtn">Retry</button><button class="btn next" id="nextBtn">${st.idx===MISSIONS.length-1?'Finish':'Next'}</button>`:`<button class="btn check" id="checkBtn">Check Rescue</button>`}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Tap cells to select the required fractional part.</div>`}
  `;
  sim.querySelectorAll('.cell').forEach(b=>b.onclick=()=>toggle(parseInt(b.dataset.i,10)));
  const c=sim.querySelector('#checkBtn'); if(c) c.onclick=check;
  const n=sim.querySelector('#nextBtn'); if(n) n.onclick=next;
  const r=sim.querySelector('#retryBtn'); if(r) r.onclick=retry;
  const rs=sim.querySelector('#restartBtn'); if(rs) rs.onclick=restart;
  try{
    var _m=MISSIONS[Math.min(st.idx,MISSIONS.length-1)];
    var _need=(_m.frac[0]*_m.total)/_m.frac[1];
    var _chosen=st.pick.filter(Boolean).length;
    var _grp=_m.total/_m.frac[1];
    if(!st.run){ window.__eduRound={native:true,line:(st.msg||'All rescues complete!'),voice:(st.msgType==='good'?'Done.':'Try again.'),glow:sim.querySelector('#restartBtn'),submit:sim.querySelector('#restartBtn'),key:'over-'+st.idx}; }
    else if(st.resolved){ window.__eduRound={native:true,line:st.msg,voice:(st.msgType==='good'?'Correct.':'Not quite.'),submit:(sim.querySelector('#nextBtn')||sim.querySelector('#retryBtn')),key:'res-'+st.idx}; }
    else { window.__eduRound={native:true,
      hint:'Rescue '+_m.frac[0]+'/'+_m.frac[1]+' of the '+_m.total+' kits. How many cells?',hintVoice:'How many cells?',
      why:'A fraction of a quantity = (numerator / denominator) times the total.',
      detail:'Step 1 - Split the total into '+_m.frac[1]+' equal groups: '+_m.total+' / '+_m.frac[1]+' = '+_grp+' per group.\nStep 2 - Take '+_m.frac[0]+' group(s): '+_m.frac[0]+' * '+_grp+' = '+_need+'.\nStep 3 - Turn on '+_need+' cells (any), then Check.\nWhy it works - the denominator makes the groups, the numerator counts them.\nTip - "of" means multiply.',
      line:(_chosen===_need?(_chosen+' cells on - tap Check.'):('Turn on '+_need+' cells (you have '+_chosen+').')),
      voice:'Turn on '+_need+' cells.',
      glow:(_chosen===_need?sim.querySelector('#checkBtn'):null),submit:(_chosen===_need?sim.querySelector('#checkBtn'):null),key:'m-'+st.idx}; }
  }catch(e){}
}
setup(); render();
</script>
  <script src="edu-coach.js"></script>
</body>
</html>
