<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Restricted Calculator Rush</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#0f766e,#2563eb);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}
.header p{font-size:12px;opacity:.9}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#ecfeff;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#0f766e;font-weight:700;text-transform:uppercase}
.v{font-size:18px;font-weight:800;color:#111827}
.mission{background:linear-gradient(135deg,#ecfeff,#dbeafe);border:2px solid #7dd3fc;border-radius:12px;padding:10px;margin-bottom:10px}
.mission p{font-size:12px;color:#0f766e;line-height:1.45}
.big{font-family:'Courier New',monospace;font-size:24px;font-weight:900;color:#0f172a;text-align:center;margin-top:6px}
.bar{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:8px}
.fill{height:100%;background:linear-gradient(90deg,#0f766e,#0284c7)}
.row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.btn.tap{background:#0f766e;color:#fff}
.btn.check{background:#0284c7;color:#fff}
.btn.next{background:#16a34a;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.45}
.msg.good{background:#dcfce7;color:#166534}
.msg.bad{background:#fef2f2;color:#991b1b}
.msg.info{background:#eff6ff;color:#1e3a8a}
.insight{margin-top:12px;background:linear-gradient(135deg,#ecfeff,#dbeafe);border-left:4px solid #0f766e;border-radius:12px;padding:12px;font-size:12px;color:#0f172a;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Restricted Calculator Rush</h1>
    <p>Reach targets with only one allowed button</p>
  </div>
  <div class="card" id="sim"></div>
  <div class="insight"><b>Concept:</b> place value efficiency appears when button value grows (e.g., +1000 vs +10).</div>
</div>
<script>
const sim = document.getElementById('sim');
const ROUNDS = [
  {target:10000, step:1000},
  {target:53000, step:1000},
  {target:100000, step:1000},
  {target:500, step:10},
  {target:10000, step:100},
  {target:100000, step:100}
];
let st={run:true,idx:0,score:0,lives:3,current:0,clicks:0,resolved:false,msg:'',msgType:'info'};

function setup(){ st.current=0; st.clicks=0; st.resolved=false; st.msg=''; st.msgType='info'; }
function tap(){ if(!st.run||st.resolved) return; st.current+=ROUNDS[st.idx].step; st.clicks++; render(); }
function check(){
  if(!st.run||st.resolved) return;
  const r=ROUNDS[st.idx];
  st.resolved=true;
  if(st.current===r.target){ st.score+=12; st.msg='Target matched exactly.'; st.msgType='good'; }
  else { st.lives--; st.msg=`Not exact. Needed ${r.target.toLocaleString('en-IN')}.`; st.msgType='bad'; if(st.lives<=0) st.run=false; }
  render();
}
function next(){
  if(!st.resolved) return;
  st.idx++;
  if(st.idx>=ROUNDS.length){ st.run=false; st.msg='Rush complete!'; st.msgType='good'; render(); return; }
  setup(); render();
}
function restart(){ st={run:true,idx:0,score:0,lives:3,current:0,clicks:0,resolved:false,msg:'',msgType:'info'}; setup(); render(); }
function render(){
  const done=!st.run;
  const r=ROUNDS[Math.min(st.idx,ROUNDS.length-1)];
  const pct=Math.min(100,Math.round((st.current/r.target)*100));
  sim.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="k">Round</div><div class="v">${Math.min(st.idx+1,ROUNDS.length)}/${ROUNDS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Clicks</div><div class="v">${st.clicks}</div></div>
    </div>
    <div class="mission">
      <p>Allowed button: <b>+${r.step.toLocaleString('en-IN')}</b></p>
      <p>Target: <b>${r.target.toLocaleString('en-IN')}</b></p>
      <div class="big">${st.current.toLocaleString('en-IN')}</div>
      <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
    </div>
    <div class="row">
      ${done?`<button class="btn next" id="restartBtn">Restart</button>`:(st.resolved?`<button class="btn next" id="nextBtn">${st.idx===ROUNDS.length-1?'Finish':'Next Round'}</button>`:`<button class="btn tap" id="tapBtn">+${r.step.toLocaleString('en-IN')}</button><button class="btn check" id="checkBtn">Check</button>`)}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Press button repeatedly, then check exact match.</div>`}
  `;
  const t=sim.querySelector('#tapBtn'); if(t) t.onclick=tap;
  const c=sim.querySelector('#checkBtn'); if(c) c.onclick=check;
  const n=sim.querySelector('#nextBtn'); if(n) n.onclick=next;
  const rbtn=sim.querySelector('#restartBtn'); if(rbtn) rbtn.onclick=restart;
}
setup();
render();
</script>
  <script src="edu-coach.js"></script>
</body>
</html>
