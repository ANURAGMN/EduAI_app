<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coach variations</title>
<style>
  :root{--ink:#101433;--muted:#6b7093;--line:#e3e5f0;--accent:#4b3fbf;--accentbg:#eeecfb;--ok:#0f7a52;--okbg:#e2f5ec;--bad:#b3261e;--badbg:#fdecea;--amber:#ff9500}
  *{box-sizing:border-box}
  body{margin:0;font:400 16px/1.5 system-ui,-apple-system,sans-serif;color:var(--ink);background:#f4f5fb;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:480px;margin:0 auto;min-height:100vh;padding:12px 14px 24px}
  .pick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .pick button{flex:1 1 auto;font-size:12px;font-weight:600;border:1px solid var(--line);background:#fff;border-radius:16px;padding:8px 10px;color:var(--muted);cursor:pointer}
  .pick button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .desc{font-size:12px;color:var(--muted);margin:0 0 12px;min-height:30px}
  .sim{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
  .stat{font-size:12px;color:var(--muted)}
  .big{font-size:28px;font-weight:600;letter-spacing:1px}
  .cur{font-size:14px;color:var(--muted);margin-top:2px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .pv{border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px 4px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
  .pv:active{transform:scale(.97)}
  .glow{outline:3px solid var(--amber);outline-offset:2px}
  .row{display:flex;gap:8px;margin-top:12px}
  .act{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-size:14px;font-weight:600;cursor:pointer}
  .act.reset{color:var(--bad)}.act.next{background:var(--ok);color:#fff;border-color:var(--ok)}
  .glowg{outline:3px solid var(--ok);outline-offset:2px}
  .coach{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:12px}
  .coachtop{display:flex;gap:10px;align-items:flex-start}
  .ava{width:32px;height:32px;border-radius:50%;background:var(--accentbg);color:var(--accent);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:15px}
  .line{font-size:14px;line-height:1.5}.line b{color:var(--accent)}
  .chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .chip{font-size:12px;font-weight:600;border:1px solid var(--accent);color:var(--accent);border-radius:16px;padding:7px 13px;background:#fff;cursor:pointer}
  .qbtn{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-top:8px;font-size:13px;background:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="pick" id="pick">
    <button data-m="ask" class="on">Try first</button>
    <button data-m="guided">Step-by-step</button>
    <button data-m="self">Self-explain</button>
    <button data-m="ondemand">Answer on tap</button>
  </div>
  <p class="desc" id="desc"></p>

  <div class="sim">
    <div class="stat">Target</div>
    <div class="big" id="target">40,629</div>
    <div class="cur" id="cur">Current: 0</div>
    <div class="grid" id="grid"></div>
    <div class="row">
      <button class="act reset" id="reset">Reset</button>
      <button class="act next" id="next" style="display:none">Next target</button>
    </div>
  </div>

  <div class="coach">
    <div class="coachtop"><div class="ava">◕‿◕</div><div class="line" id="line"></div></div>
    <div class="chips" id="chips"></div>
  </div>
</div>

<script>
(function(){
  var PV=[100000,10000,1000,100,10,1];
  var LABEL={100000:"+1,00,000",10000:"+10,000",1000:"+1,000",100:"+100",10:"+10",1:"+1"};
  var TARGETS=[40629,5072,8300];
  var DESC={
    ask:"Ask-first: states the problem and waits. Tap Hint for a nudge, tap again for the answer. Helps automatically only if you overshoot.",
    guided:"Guided steps: walks you through the whole build one step at a time, glowing each button. Most hand-holding.",
    self:"Self-explain: when you want help it asks WHY first — pick the reasoning, then it confirms and glows the move.",
    ondemand:"On-demand: coach stays quiet. One 'Show answer' button reveals the move whenever you choose."
  };
  var mode='ask',idx=0,current=0,done=false,hintLevel=0,askOpen=false,step=0,selfWrong=0;

  function fmt(n){return n.toLocaleString('en-IN');}
  function target(){return TARGETS[idx];}
  function fit(){return PV.filter(function(v){return current+v<=target();})[0];}

  var grid=document.getElementById('grid');
  PV.forEach(function(v){var b=document.createElement('button');b.className='pv';b.dataset.v=v;b.textContent=LABEL[v];b.onclick=function(){add(v);};grid.appendChild(b);});

  function clearGlow(){[].forEach.call(document.querySelectorAll('.pv'),function(b){b.classList.remove('glow');});document.getElementById('reset').classList.remove('glowg');document.getElementById('next').classList.remove('glowg');}
  function glowFit(){var f=fit();if(f)document.querySelector('.pv[data-v="'+f+'"]').classList.add('glow');}

  function setLine(html){document.getElementById('line').innerHTML=html;}
  function chip(label,fn){var b=document.createElement('button');b.className='chip';b.textContent=label;b.onclick=fn;return b;}

  function renderCoach(){
    var chips=document.getElementById('chips');chips.innerHTML='';clearGlow();
    var t=target(),gap=t-current;
    if(done){setLine('You built <b>'+fmt(t)+'</b>! Tap <b>Next target</b>.');document.getElementById('next').classList.add('glowg');return;}
    if(current>t){setLine('That's <b>over</b> '+fmt(t)+' by '+fmt(current-t)+'. Tap <b>Reset</b> and use a smaller button.');document.getElementById('reset').classList.add('glowg');return;}

    if(mode==='ask'){
      if(hintLevel===0)setLine('Build <b>'+fmt(t)+'</b>. You have '+fmt(current)+', so '+fmt(gap)+' to go. Which button gets closest without going over? <span style="color:var(--muted)">(think, or tap Hint)</span>');
      else if(hintLevel===1)setLine('Nudge: fill the <b>biggest place first</b> — the largest button that still fits under '+fmt(t)+'.');
      else{setLine('Add <b>'+LABEL[fit()]+'</b> — '+fmt(gap)+' to go.');glowFit();}
      if(hintLevel<2)chips.appendChild(chip('Hint '+hintLevel+'/2',function(){hintLevel=Math.min(hintLevel+1,2);renderCoach();}));
    }
    else if(mode==='guided'){
      setLine('Step '+(step+1)+': add <b>'+LABEL[fit()]+'</b> to move toward '+fmt(t)+'. ('+fmt(gap)+' to go)');
      glowFit();
    }
    else if(mode==='self'){
      if(!askOpen){setLine('Build <b>'+fmt(t)+'</b>. You have '+fmt(current)+', so '+fmt(gap)+' to go. Try it — or let's reason it out together.');chips.appendChild(chip('Help me think',function(){askOpen=true;renderCoach();}));}
      else{
        setLine('Which is the smartest next move — and why?');
        var f=fit();var opts=[{v:f,r:'Biggest button that still fits — fewest taps.'},{v:1,r:'the correct value but far too many taps.'}];
        opts.forEach(function(o){var b=document.createElement('button');b.className='qbtn';b.textContent='Add '+LABEL[o.v];b.onclick=function(){
          if(o.v===f){chips.innerHTML='';setLine('Yes! <b>'+LABEL[f]+'</b> — '+o.r);glowFit();askOpen=false;selfWrong=0;}
          else{selfWrong++;
            if(selfWrong>=2){chips.innerHTML='';setLine('No worries — the smartest move is <b>'+LABEL[f]+'</b>: '+opts[0].r);glowFit();askOpen=false;selfWrong=0;}
            else{setLine('Hmm — that's '+o.r+' Try once more.');}
          }
        };chips.appendChild(b);});
      }
    }
    else if(mode==='ondemand'){
      setLine('Build <b>'+fmt(t)+'</b>. You have '+fmt(current)+', so '+fmt(gap)+' to go.');
      chips.appendChild(chip('Show answer',function(){setLine('Add <b>'+LABEL[fit()]+'</b> — '+fmt(gap)+' to go.');glowFit();}));
    }
  }

  function render(){
    document.getElementById('target').textContent=fmt(target());
    document.getElementById('cur').textContent='Current: '+fmt(current);
    document.getElementById('next').style.display=done?'block':'none';
    document.getElementById('desc').textContent=DESC[mode];
    renderCoach();
  }

  function add(v){
    if(done)return;current+=v;
    if(current===target())done=true;
    else if(current<=target()){hintLevel=0;askOpen=false;selfWrong=0;step++;}
    render();
  }
  document.getElementById('reset').onclick=function(){current=0;done=false;hintLevel=0;askOpen=false;selfWrong=0;step=0;render();};
  document.getElementById('next').onclick=function(){idx=(idx+1)%TARGETS.length;current=0;done=false;hintLevel=0;askOpen=false;selfWrong=0;step=0;render();};
  document.getElementById('pick').onclick=function(e){var b=e.target.closest('button');if(!b)return;[].forEach.call(this.children,function(x){x.classList.remove('on');});b.classList.add('on');mode=b.dataset.m;current=0;done=false;hintLevel=0;askOpen=false;selfWrong=0;step=0;render();};

  render();
})();
</script>
</body>
</html>
