<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Distributive Mental Math Burst</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#0f766e,#1d4ed8);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}
.header p{font-size:12px;opacity:.9}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#ecfeff;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#0f766e;font-weight:700;text-transform:uppercase}
.v{font-size:18px;font-weight:800;color:#111827}
.mission{background:linear-gradient(135deg,#ecfeff,#dbeafe);border:2px solid #7dd3fc;border-radius:12px;padding:10px;margin-bottom:10px}
.mission p{font-size:12px;color:#0f766e;line-height:1.45}
.expr{font-family:'Courier New',monospace;font-size:24px;font-weight:900;color:#0f172a;text-align:center;margin-top:6px}
.choices{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.choice{padding:10px;border:2px solid #d1d5db;border-radius:10px;background:#fff;cursor:pointer;font-family:'Courier New',monospace;font-size:14px;font-weight:800;text-align:left}
.choice.sel{border-color:#0f766e;background:#d1fae5;color:#065f46}
.choice.ok{border-color:#16a34a;background:#dcfce7;color:#166534}
.choice.bad{border-color:#dc2626;background:#fef2f2;color:#991b1b}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.btn.check{background:#0f766e;color:#fff}
.btn.next{background:#0284c7;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.45}
.msg.good{background:#dcfce7;color:#166534}
.msg.bad{background:#fef2f2;color:#991b1b}
.msg.info{background:#eff6ff;color:#1e3a8a}
.insight{margin-top:12px;background:linear-gradient(135deg,#ecfeff,#dbeafe);border-left:4px solid #0f766e;border-radius:12px;padding:12px;font-size:12px;color:#0f172a;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Distributive Mental Math Burst</h1>
    <p>Choose the fastest valid decomposition</p>
  </div>
  <div class="card" id="sim"></div>
  <div class="insight"><b>Concept:</b> use a(b+c)=ab+ac or a(b-c)=ab-ac to compute mentally.</div>
</div>
<script>
const sim = document.getElementById('sim');
const ROUNDS = [
  {expr:'97×25', correct:'(100-3)×25 = 2500-75 = 2425', ans:2425},
  {expr:'95×8', correct:'(100-5)×8 = 800-40 = 760', ans:760},
  {expr:'104×15', correct:'(100+4)×15 = 1500+60 = 1560', ans:1560},
  {expr:'49×50', correct:'(50-1)×50 = 2500-50 = 2450', ans:2450},
  {expr:'63×18', correct:'(53+10)×18 = 954+180 = 1134', ans:1134},
  {expr:'72×125', correct:'(72÷8)×1000 = 9×1000 = 9000', ans:9000}
];

let st={run:true,idx:0,score:0,lives:3,pick:null,resolved:false,msg:'',msgType:'info',opts:[]};

function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}
function setup(){
  const r=ROUNDS[st.idx];
  st.pick=null; st.resolved=false; st.msg=''; st.msgType='info';
  st.opts=shuffle([
    r.correct,
    `${r.expr} = ${r.ans-50} (approx)`,
    `${r.expr} = direct long multiplication only`,
    `${r.expr} = ${(r.ans+100)}`
  ]);
}
function choose(i){ if(!st.run||st.resolved) return; st.pick=i; render(); }
function check(){
  if(!st.run||st.resolved||st.pick===null) return;
  const r=ROUNDS[st.idx];
  st.resolved=true;
  if(st.opts[st.pick]===r.correct){ st.score+=12; st.msg='Great mental math split!'; st.msgType='good'; }
  else { st.lives--; st.msg=`Best decomposition: ${r.correct}`; st.msgType='bad'; if(st.lives<=0) st.run=false; }
  render();
}
function next(){
  if(!st.resolved) return;
  st.idx++;
  if(st.idx>=ROUNDS.length){ st.run=false; st.msg='Burst complete!'; st.msgType='good'; render(); return; }
  setup(); render();
}
function restart(){ st={run:true,idx:0,score:0,lives:3,pick:null,resolved:false,msg:'',msgType:'info',opts:[]}; setup(); render(); }

function render(){
  const done=!st.run;
  const r=ROUNDS[Math.min(st.idx,ROUNDS.length-1)];
  sim.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="k">Round</div><div class="v">${Math.min(st.idx+1,ROUNDS.length)}/${ROUNDS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Target</div><div class="v">${r.ans}</div></div>
    </div>
    <div class="mission">
      <p>Select the strongest distributive/shortcut reasoning for:</p>
      <div class="expr">${r.expr}</div>
    </div>
    <div class="choices">
      ${st.opts.map((o,i)=>{
        const cls=st.resolved?(o===r.correct?'ok':(i===st.pick?'bad':'')):(i===st.pick?'sel':'');
        return `<button class="choice ${cls}" data-i="${i}">${o}</button>`;
      }).join('')}
    </div>
    <div class="actions">
      ${done?`<button class="btn next" id="restartBtn">Restart</button>`:(st.resolved?`<button class="btn next" id="nextBtn">${st.idx===ROUNDS.length-1?'Finish':'Next Round'}</button>`:`<button class="btn check" id="checkBtn">Check Strategy</button>`)}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Pick one strategy and verify.</div>`}
  `;
  sim.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(parseInt(b.dataset.i,10)));
  const c=sim.querySelector('#checkBtn'); if(c) c.onclick=check;
  const n=sim.querySelector('#nextBtn'); if(n) n.onclick=next;
  const rbtn=sim.querySelector('#restartBtn'); if(rbtn) rbtn.onclick=restart;
}
setup();
render();
</script>
  <script src="edu-coach.js"></script>
</body>
</html>
