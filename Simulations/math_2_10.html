<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>Operator Ladder Climb</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#7c3aed,#1d4ed8);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}
.header p{font-size:12px;opacity:.9}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#f3e8ff;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#6d28d9;font-weight:700;text-transform:uppercase}
.v{font-size:18px;font-weight:800;color:#111827}
.mission{background:linear-gradient(135deg,#f5f3ff,#ede9fe);border:2px solid #c4b5fd;border-radius:12px;padding:10px;margin-bottom:10px}
.mission h3{font-size:14px;color:#4c1d95}
.mission p{font-size:12px;color:#5b21b6;line-height:1.45;margin-top:4px}
.expr{font-family:'Courier New',monospace;font-size:22px;font-weight:900;color:#312e81;text-align:center;margin-top:8px}
.steps{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.step{padding:10px;border:2px solid #d1d5db;border-radius:10px;background:#fff;cursor:pointer;font-size:13px;font-weight:700;text-align:left}
.step.sel{border-color:#7c3aed;background:#ede9fe;color:#4c1d95;box-shadow:0 0 0 2px rgba(124,58,237,.15) inset}
.step.ok{border-color:#16a34a;background:#dcfce7;color:#166534}
.step.bad{border-color:#dc2626;background:#fef2f2;color:#991b1b}
.calc{margin-top:10px;background:#f8fafc;border-radius:10px;padding:10px}
.calc p{font-size:12px;color:#334155}
.calc input{width:100%;margin-top:6px;padding:9px;border:2px solid #cbd5e1;border-radius:8px;font-size:16px;font-weight:700}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.btn.check{background:#7c3aed;color:#fff}
.btn.next{background:#0ea5e9;color:#fff}
.btn.start{background:linear-gradient(135deg,#7c3aed,#1d4ed8);color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.45}
.msg.good{background:#dcfce7;color:#166534}
.msg.bad{background:#fef2f2;color:#991b1b}
.msg.info{background:#eff6ff;color:#1e3a8a}
.insight{margin-top:12px;background:linear-gradient(135deg,#f5f3ff,#ede9fe);border-left:4px solid #7c3aed;border-radius:12px;padding:12px;font-size:12px;color:#111827;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Operator Ladder Climb</h1>
    <p>Pick the first operation, then lock final value</p>
  </div>
  <div class="card" id="sim"></div>
  <div class="insight"><b>Concept:</b> evaluate expressions by climbing the operator ladder: brackets, multiplication/division, then addition/subtraction.</div>
</div>
<script>
const sim = document.getElementById("sim");

const MISSIONS = [
  {expr:"8 + 3 × 4", first:"3 × 4", value:20, decoys:["8 + 3","8 + 3 × 4 = 11","8 × 3"]},
  {expr:"36 ÷ 6 + 5", first:"36 ÷ 6", value:11, decoys:["6 + 5 = 30","6 + 5 first","36 ÷ 11"]},
  {expr:"50 - 2 × 9", first:"2 × 9", value:32, decoys:["50 - 2","50 × 2","9 - 2"]},
  {expr:"6 + 18 ÷ 3", first:"18 ÷ 3", value:12, decoys:["6 + 18","18 + 3","6 ÷ 3"]},
  {expr:"7 × 5 - 8", first:"7 × 5", value:27, decoys:["5 - 8","7 - 5","7 × 8"]},
  {expr:"90 ÷ 10 + 13", first:"90 ÷ 10", value:22, decoys:["10 + 13 = 103","90 + 10","90 ÷ 13"]}
];

let st = {run:true, idx:0, score:0, lives:3, streak:0, pick:"", answer:"", resolved:false, msg:"", msgType:"info", currentOptions:[]};

function startGame(){
  st = {run:true, idx:0, score:0, lives:3, streak:0, pick:"", answer:"", resolved:false, msg:"", msgType:"info", currentOptions:[]};
  prepareOptions();
  render();
}

function options(m){
  return shuffle([m.first, ...m.decoys]).slice(0,4);
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function chooseStep(v){
  if(!st.run || st.resolved) return;
  st.pick = v;
  render();
}

function prepareOptions(){
  const m = MISSIONS[st.idx];
  st.currentOptions = options(m);
}

function check(){
  if(!st.run || st.resolved) return;
  const m = MISSIONS[st.idx];
  const got = parseFloat(st.answer);
  const firstOk = st.pick === m.first;
  const valOk = Number.isFinite(got) && got === m.value;
  st.resolved = true;

  if(firstOk && valOk){
    st.score += 10 + st.streak;
    st.streak += 1;
    st.msg = "Great climb! Correct first operation and final value.";
    st.msgType = "good";
  } else {
    st.lives -= 1;
    st.streak = 0;
    st.msg = `Not yet. First step: ${m.first}, final value: ${m.value}.`;
    st.msgType = "bad";
    if(st.lives <= 0) st.run = false;
  }
  render();
}

function nextMission(){
  st.idx += 1;
  if(st.idx >= MISSIONS.length){
    st.run = false;
    st.msg = "Ladder summit reached!";
    st.msgType = "good";
    render();
    return;
  }
  st.pick = "";
  st.answer = "";
  st.resolved = false;
  st.currentOptions = [];
  st.msg = "";
  st.msgType = "info";
  prepareOptions();
  render();
}

function render(){
  const done = !st.run;
  const m = MISSIONS[Math.min(st.idx, MISSIONS.length - 1)];
  if(st.currentOptions.length===0) prepareOptions();
  const stepOptions = st.currentOptions;

  sim.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="k">Mission</div><div class="v">${Math.min(st.idx+1, MISSIONS.length)}/${MISSIONS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Streak</div><div class="v">${st.streak}</div></div>
    </div>

    <div class="mission">
      <h3>Climb this expression correctly</h3>
      <p>Select the operation to do first, then enter final value.</p>
      <div class="expr">${m.expr}</div>
    </div>

    <div class="steps">
      ${stepOptions.map(v => {
        const cls = st.resolved ? (v===m.first ? "ok" : (v===st.pick ? "bad" : "")) : (v===st.pick ? "sel" : "");
        return `<button class="step ${cls}" data-v="${v}">${v}</button>`;
      }).join("")}
    </div>

    <div class="calc">
      <p>Final value</p>
      <input id="ans" type="number" value="${st.answer}" placeholder="Enter final answer">
      <p style="margin-top:6px">Selected first step: <b>${st.pick || "-"}</b></p>
    </div>

    <div class="actions">
      ${done
        ? `<button class="btn start" id="startBtn">Start Climb</button>`
        : (st.resolved
            ? `<button class="btn next" id="nextBtn">${st.idx===MISSIONS.length-1 ? "Finish Climb" : "Next Mission"}</button>`
            : `<button class="btn check" id="checkBtn">Lock Answer</button>`)}
    </div>

    ${st.msg ? `<div class="msg ${st.msgType}">${st.msg}</div>` : `<div class="msg info">Use order of operations, not left-to-right guessing.</div>`}
  `;

  sim.querySelectorAll(".step").forEach(b => b.onclick = () => chooseStep(b.dataset.v));
  const a = sim.querySelector("#ans");
  if(a){
    a.oninput = () => { st.answer = a.value; };
    a.disabled = st.resolved || done;
  }
  const s = sim.querySelector("#startBtn"); if(s) s.onclick = startGame;
  const c = sim.querySelector("#checkBtn"); if(c) c.onclick = check;
  const n = sim.querySelector("#nextBtn"); if(n) n.onclick = nextMission;
  // --- V5 coach: pick the operation to do first (× and ÷ before + and −), then the value ---
  var _firstEl=[].slice.call(sim.querySelectorAll('.step')).find(function(b){return b.dataset.v===m.first;});
  var _ansEl=sim.querySelector('#ans');
  if(done){
    window.__eduRound={native:true,line:(st.msg||'Climb over.'),voice:(st.msgType==='good'?'Summit reached.':'Climb over.'),submit:sim.querySelector('#startBtn'),key:'done-'+st.idx+'-'+(st.msg||'')};
  } else if(st.resolved){
    window.__eduRound={native:true,line:st.msg,voice:(st.msgType==='good'?'Correct.':'Not yet.'),submit:sim.querySelector('#nextBtn'),key:'res-'+st.idx};
  } else if(st.pick!==m.first){
    window.__eduRound={native:true,
      hint:'In '+m.expr+', which operation must be done first?',
      hintVoice:'Which operation comes first here?',
      why:'Order of operations: do × and ÷ before + and −. So the multiplication or division is worked out first, not left-to-right.',
      detail:'Step 1 — Scan '+m.expr+' for × or ÷.\nStep 2 — Do that first: '+m.first+'.\nStep 3 — Then finish the + or − to get '+m.value+'.\nWhy it works — × and ÷ bind tighter than + and −, so they are always resolved first regardless of position.\nTip — left-to-right only works when everything is the same rank.',
      line:'Do '+m.first+' first, then the rest gives '+m.value+'.',
      voice:'Do '+m.first+' first',
      glow:_firstEl,
      key:'first-'+st.idx};
  } else {
    window.__eduRound={native:true,
      hint:'You picked the right first step ('+m.first+'). Now finish '+m.expr+' — what is the final value?',
      hintVoice:'What is the final value?',
      why:'After doing × or ÷ first, complete the remaining + or − to reach the final value.',
      detail:'Step 1 — First step done: '+m.first+'.\nStep 2 — Substitute it back into '+m.expr+' and finish the + or −.\nStep 3 — The final value is '+m.value+' → type it and tap Lock Answer.\nWhy it works — once the higher-priority operation is done, the rest is a simple left-to-right + and −.',
      line:m.expr+' = '+m.value+'.',
      voice:'The value is '+m.value,
      input:_ansEl,inputHint:''+m.value,
      submit:(st.answer!==''?sim.querySelector('#checkBtn'):null),
      key:'val-'+st.idx};
  }
}

startGame();
</script>
  <script src="edu-coach.js"></script>
</body>
</html>
