<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>Expression Compare Clash</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#7c3aed,#2563eb);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}
.header p{font-size:12px;opacity:.92}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#f5f3ff;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#6d28d9;font-weight:700;text-transform:uppercase}
.v{font-size:18px;font-weight:800;color:#0f172a}
.mission{background:linear-gradient(135deg,#f5f3ff,#dbeafe);border:2px solid #c4b5fd;border-radius:12px;padding:10px;margin-bottom:10px}
.expr{font-family:'Courier New',monospace;font-size:20px;font-weight:900;color:#312e81;text-align:center}
.xbox{margin-top:8px;background:#f8fafc;border-radius:10px;padding:10px}
.xbox input{width:100%;margin-top:6px;padding:9px;border:2px solid #cbd5e1;border-radius:8px;font-size:15px;font-weight:800}
.read{margin-top:6px;font-size:12px;color:#334155}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.choice{padding:10px;border:2px solid #d1d5db;border-radius:10px;background:#fff;font-weight:800;cursor:pointer}
.choice.sel{border-color:#7c3aed;background:#ede9fe;color:#4c1d95}
.choice.ok{border-color:#16a34a;background:#dcfce7;color:#166534}
.choice.bad{border-color:#dc2626;background:#fef2f2;color:#991b1b}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.btn.check{background:#7c3aed;color:#fff}
.btn.next{background:#16a34a;color:#fff}
.btn.start{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.45}
.msg.good{background:#dcfce7;color:#166534}
.msg.bad{background:#fef2f2;color:#991b1b}
.msg.info{background:#eff6ff;color:#1e3a8a}
.insight{margin-top:12px;background:linear-gradient(135deg,#f5f3ff,#ede9fe);border-left:4px solid #7c3aed;border-radius:12px;padding:12px;font-size:12px;color:#0f172a;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Expression Compare Clash</h1>
    <p>Decide which expression is greater at chosen x</p>
  </div>
  <div class="card" id="sim"></div>
  <div class="insight"><b>Concept:</b> expression comparison depends on substitution. Same-looking forms can swap order at different x values.</div>
</div>
<script>
const sim = document.getElementById('sim');
const MISSIONS = [
  {L:'3x + 4', R:'2x + 9', lv:x=>3*x+4, rv:x=>2*x+9},
  {L:'5x - 7', R:'4x + 1', lv:x=>5*x-7, rv:x=>4*x+1},
  {L:'2(x+6)', R:'2x + 11', lv:x=>2*(x+6), rv:x=>2*x+11},
  {L:'9 + x', R:'3x + 1', lv:x=>9+x, rv:x=>3*x+1},
  {L:'7x - 5', R:'6x + 3', lv:x=>7*x-5, rv:x=>6*x+3},
  {L:'4x + 8', R:'5x + 2', lv:x=>4*x+8, rv:x=>5*x+2}
];

let st = {run:false, idx:0, score:0, lives:3, x:2, pick:'', resolved:false, msg:'', msgType:'info'};

function start(){
  st = {run:true, idx:0, score:0, lives:3, x:2, pick:'', resolved:false, msg:'', msgType:'info'};
  render();
}
function choose(v){ if(!st.run || st.resolved) return; st.pick=v; render(); }
function relation(l,r){ return l===r ? '=' : (l>r?'>':'<'); }
function check(){
  if(!st.run || st.resolved || !st.pick) return;
  const m = MISSIONS[st.idx];
  const l = m.lv(st.x), r = m.rv(st.x), ans = relation(l,r);
  st.resolved = true;
  if(st.pick===ans){ st.score += 12; st.msg = `Correct! Left ${ans} Right at x=${st.x}.`; st.msgType='good'; }
  else { st.lives--; st.msg = `Not correct. At x=${st.x}, left=${l}, right=${r}.`; st.msgType='bad'; if(st.lives<=0) st.run=false; }
  render();
}
function next(){
  if(!st.resolved) return;
  st.idx++;
  if(st.idx>=MISSIONS.length){ st.run=false; st.msg='Clash series complete!'; st.msgType='good'; render(); return; }
  st.x = 2; st.pick=''; st.resolved=false; st.msg=''; st.msgType='info'; render();
}

function render(){
  const done = !st.run;
  const m = MISSIONS[Math.min(st.idx, MISSIONS.length-1)];
  const l = m.lv(st.x), r = m.rv(st.x);
  sim.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="k">Mission</div><div class="v">${Math.min(st.idx+1,MISSIONS.length)}/${MISSIONS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">x</div><div class="v">${st.x}</div></div>
    </div>
    <div class="mission">
      <div class="expr">Left: ${m.L}</div>
      <div class="expr">Right: ${m.R}</div>
      <div class="xbox">
        <div style="font-size:12px;color:#334155">Choose test value x</div>
        <input id="xIn" type="number" min="-20" max="20" step="1" value="${st.x}">
        <div class="read">At x=${st.x}: left=${l}, right=${r}</div>
      </div>
    </div>
    <div class="choices">
      ${['>','=','<'].map(v=>`<button class="choice ${st.resolved?(v===relation(l,r)?'ok':(v===st.pick?'bad':'')):(v===st.pick?'sel':'')}" data-v="${v}">Left ${v} Right</button>`).join('')}
    </div>
    <div class="actions">
      ${done?`<button class="btn start" id="startBtn">Start Clash</button>`:(st.resolved?`<button class="btn next" id="nextBtn">Next Mission</button>`:`<button class="btn check" id="checkBtn">Submit Relation</button>`)}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Selected: <b>${st.pick||'-'}</b>. Set x, choose relation, then submit.</div>`}
  `;
  const xi = sim.querySelector('#xIn');
  if(xi){ xi.oninput=()=>{ st.x=parseInt(xi.value||'0',10); render(); }; xi.disabled = st.resolved || done; }
  sim.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(b.dataset.v));
  const s=sim.querySelector('#startBtn'); if(s) s.onclick=start;
  const c=sim.querySelector('#checkBtn'); if(c) c.onclick=check;
  const n=sim.querySelector('#nextBtn'); if(n) n.onclick=next;
  // --- V5 coach: evaluate both sides at the test value, then compare ---
  var _l=m.lv(st.x), _r=m.rv(st.x), _ans=relation(_l,_r);
  if(!st.run){
    window.__eduRound={native:true,line:(st.idx>=MISSIONS.length?(st.msg||'Clash series complete!'):'Tap Start Clash to begin.'),voice:(st.idx>=MISSIONS.length?'Series complete.':'Tap start.'),glow:sim.querySelector('#startBtn'),key:'start-'+st.idx};
  } else if(st.resolved){
    window.__eduRound={native:true,line:st.msg,voice:(st.msgType==='good'?'Correct.':'Not correct.'),submit:sim.querySelector('#nextBtn'),key:'res-'+st.idx};
  } else {
    window.__eduRound={native:true,
      hint:'At x = '+st.x+', is Left ('+m.L+') greater than, equal to, or less than Right ('+m.R+')?',
      hintVoice:'Which side is bigger at this x?',
      why:'Substitute the test value for x in both sides, work each out, then compare the two numbers.',
      detail:'Step 1 — Put x = '+st.x+' into both sides.\nStep 2 — Left '+m.L+' = '+_l+'; Right '+m.R+' = '+_r+'.\nStep 3 — Compare '+_l+' and '+_r+': '+_l+' '+_ans+' '+_r+', so tap "'+_ans+'".\nWhy it works — an expression in x is just a rule; plug in the value to get a number you can compare.\nTip — a different x can flip the relation, so always test the given value.',
      line:'At x='+st.x+': left='+_l+', right='+_r+' → tap "'+_ans+'".',
      voice:'Tap '+_ans,
      glow:sim.querySelector('.choice[data-v="'+_ans+'"]'),
      submit:st.pick?sim.querySelector('#checkBtn'):null,
      key:'m-'+st.idx+'-'+st.x};
  }
}
start();
</script>
  <script src="edu-coach.js"></script>
</body>
</html>
