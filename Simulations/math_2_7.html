<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Number Cards Target Dash</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#0f766e,#1d4ed8);min-height:100vh}
#app{max-width:420px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}
.header p{font-size:12px;opacity:.9}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#ecfeff;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#0f766e;font-weight:700;text-transform:uppercase}
.v{font-size:18px;font-weight:800;color:#111827}
.mission{background:linear-gradient(135deg,#ecfeff,#dbeafe);border:2px solid #7dd3fc;border-radius:12px;padding:10px;margin-bottom:10px}
.mission h3{font-size:14px;color:#115e59}
.mission p{font-size:12px;color:#155e75;margin-top:4px}
.expr{background:#0f172a;border-radius:12px;padding:12px;margin-bottom:10px;color:#fff;font-family:'Courier New',monospace}
.expr .big{font-size:20px;font-weight:800;word-break:break-all}
.expr .small{font-size:11px;color:#94a3b8;margin-top:4px}
.ops{display:flex;gap:6px;margin-bottom:8px}
.btn-op{flex:1;padding:10px;border:none;border-radius:10px;background:#e2e8f0;color:#0f172a;font-weight:800;cursor:pointer}
.btn-op.active{background:#0f766e;color:#fff}
.cards{display:flex;flex-wrap:wrap;gap:6px}
.cbtn{padding:8px 10px;border-radius:10px;border:2px solid #bfdbfe;background:#fff;font-weight:800;color:#1e3a8a;cursor:pointer}
.cbtn.used{opacity:.4;cursor:not-allowed}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.btn.start{background:linear-gradient(135deg,#0f766e,#1d4ed8);color:#fff}
.btn.check{background:#0f766e;color:#fff}
.btn.next{background:#16a34a;color:#fff}
.btn.reset{background:#e5e7eb;color:#374151}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.45}
.msg.good{background:#dcfce7;color:#166534}
.msg.bad{background:#fef2f2;color:#991b1b}
.msg.info{background:#eff6ff;color:#1e3a8a}
.insight{margin-top:12px;background:linear-gradient(135deg,#ecfeff,#dbeafe);border-left:4px solid #0f766e;border-radius:12px;padding:12px;font-size:12px;color:#0f172a}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Number Cards Target Dash</h1>
    <p>Use operation cards to get close to target numbers</p>
  </div>
  <div class="card" id="sim"></div>
  <div class="insight"><b>Mission rule:</b> use each number card at most once in a round. Build a valid expression and minimize distance from target.</div>
</div>
<script>
const sim = document.getElementById("sim");

const CARDS = [150000,70000,13000,4000,300,20,5];
const TARGETS = [110000,200000,580000,1245000,2090800];

let st = {run:false, idx:0, score:0, lives:3, op:"+", tokens:[], used:new Set(), solved:false, msg:"", msgType:"info"};

function safeEval(tokens){
  const expr = tokens.join(" ");
  if(!expr.trim()) return NaN;
  if(!/^[0-9+\-*/ ()]+$/.test(expr)) return NaN;
  try{
    const v = Function('"use strict";return ('+expr+')')();
    return Number.isFinite(v) ? v : NaN;
  }catch(_){ return NaN; }
}

function start(){ st={...st,run:true,idx:0,score:0,lives:3}; resetRound(); render(); }
function resetRound(){ st.tokens=[]; st.used=new Set(); st.op="+"; st.solved=false; st.msg=""; st.msgType="info"; }

function addCard(n){
  if(!st.run || st.solved || st.used.has(n)) return;
  const last = st.tokens[st.tokens.length-1];
  if(st.tokens.length>0 && typeof last !== "number"){
    st.msg="Pick a number card after operator.";
    st.msgType="info";
    render();
    return;
  }
  if(st.tokens.length>0) st.tokens.push(st.op);
  st.tokens.push(n);
  st.used.add(n);
  render();
}
function setOp(op){ if(!st.run || st.solved) return; st.op = op; render(); }

function undo(){
  if(st.solved || !st.run) return;
  if(st.tokens.length===0) return;
  const x = st.tokens.pop();
  if(typeof x === "number"){ st.used.delete(x); }
  if(st.tokens.length && typeof st.tokens[st.tokens.length-1] !== "number"){ st.tokens.pop(); }
  render();
}

function submit(){
  if(!st.run || st.solved) return;
  const target = TARGETS[st.idx];
  const value = safeEval(st.tokens);
  if(Number.isNaN(value)){ st.msg="Build a valid expression first."; st.msgType="bad"; render(); return; }
  const dist = Math.abs(value-target);
  st.solved = true;
  if(dist===0){ st.score += 25; st.msg=`Exact hit! ${value} matches target.`; st.msgType="good"; }
  else if(dist<=1000){ st.score += 12; st.msg=`Great! value=${value}, distance=${dist}.`; st.msgType="good"; }
  else if(dist<=100000){ st.score += 6; st.msg=`Close. value=${value}, distance=${dist}.`; st.msgType="info"; }
  else { st.lives--; st.msg=`Too far. value=${value}, distance=${dist}.`; st.msgType="bad"; if(st.lives<=0) st.run=false; }
  render();
}

function next(){
  if(!st.solved) return;
  st.idx++;
  if(st.idx>=TARGETS.length){ st.run=false; st.msg="All target dashes completed!"; st.msgType="good"; render(); return; }
  resetRound();
  render();
}

function render(){
  const done = !st.run;
  const target = TARGETS[Math.min(st.idx, TARGETS.length-1)];
  const value = safeEval(st.tokens);
  const expr = st.tokens.length ? st.tokens.join(" ") : "0";
  const dist = Number.isNaN(value) ? "-" : Math.abs(value-target).toLocaleString("en-IN");
  sim.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="k">Target</div><div class="v">${Math.min(st.idx+1,TARGETS.length)}/${TARGETS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Distance</div><div class="v" style="font-size:12px">${dist}</div></div>
    </div>
    <div class="mission">
      <h3>Target value: ${target.toLocaleString("en-IN")}</h3>
      <p>Build expression using available cards and operators.</p>
    </div>
    <div class="expr">
      <div class="big">${expr}</div>
      <div class="small">Current value: ${Number.isNaN(value) ? "invalid" : value.toLocaleString("en-IN")}</div>
    </div>
    <div class="ops">
      ${["+","-","*","/"].map(op=>`<button class="btn-op ${st.op===op?"active":""}" data-op="${op}">${op}</button>`).join("")}
    </div>
    <div class="cards">${CARDS.map(n=>`<button class="cbtn ${st.used.has(n)?"used":""}" data-card="${n}">${n.toLocaleString("en-IN")}</button>`).join("")}</div>
    <div class="actions">
      ${done ? `<button class="btn start" id="startBtn">Start Dash</button>` :
      (st.solved ? `<button class="btn next" id="nextBtn">Next Target</button>` :
      `<button class="btn reset" id="undoBtn">Undo</button><button class="btn check" id="submitBtn">Submit</button>`)}
    </div>
    ${st.msg ? `<div class="msg ${st.msgType}">${st.msg}</div>` : `<div class="msg info">Try combinations like 150000*5 and then adjust with +/- cards.</div>`}
  `;
  sim.querySelectorAll(".btn-op").forEach(b=>b.onclick=()=>setOp(b.dataset.op));
  sim.querySelectorAll(".cbtn").forEach(b=>b.onclick=()=>addCard(Number(b.dataset.card)));
  const s = sim.querySelector("#startBtn"); if(s) s.onclick=start;
  const u = sim.querySelector("#undoBtn"); if(u) u.onclick=undo;
  const sub = sim.querySelector("#submitBtn"); if(sub) sub.onclick=submit;
  const n = sim.querySelector("#nextBtn"); if(n) n.onclick=next;
}

start();
</script>
</body>
</html>
