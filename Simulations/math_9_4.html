<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0369a1">
<title>Double Bar Comparator Lab</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#0284c7,#0369a1);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}.header h1{font-size:20px;font-weight:800}.header p{font-size:12px;opacity:.92}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#ecfeff;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#0f766e;font-weight:700;text-transform:uppercase}.v{font-size:17px;font-weight:800;color:#0f172a}
.mission{background:#ecfeff;border:2px solid #99f6e4;border-radius:12px;padding:10px;margin-bottom:10px;font-size:12px;color:#134e4a}
.chart{position:relative;height:230px;background:#f8fafc;border:2px solid #cbd5e1;border-radius:10px;padding:8px}
.axis{position:absolute;left:24px;right:8px;bottom:30px;top:10px;border-left:2px solid #64748b;border-bottom:2px solid #64748b}
.bars{position:absolute;left:28px;right:10px;bottom:32px;top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:end}
.grp{display:flex;align-items:flex-end;justify-content:center;gap:6px;position:relative}
.barA,.barB{width:20px;border-radius:6px 6px 2px 2px}
.barA{background:linear-gradient(180deg,#0ea5e9,#0284c7)}
.barB{background:linear-gradient(180deg,#22c55e,#15803d)}
.lbl{position:absolute;bottom:-22px;font-size:11px;color:#334155}
.ctrls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ctrl{background:#f8fafc;border:2px solid #cbd5e1;border-radius:10px;padding:8px;text-align:center}
.t{font-size:11px;color:#475569}.n{font-size:16px;font-weight:900;color:#0f172a;font-family:'Courier New',monospace}
.row{display:flex;gap:4px;margin-top:6px}
.mini{flex:1;padding:7px;border:none;border-radius:7px;background:#dbeafe;color:#1d4ed8;font-weight:800;cursor:pointer}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.check{background:#0284c7;color:#fff}.next{background:#0f766e;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.4}
.good{background:#dcfce7;color:#166534}.bad{background:#fef2f2;color:#991b1b}.info{background:#eff6ff;color:#1e3a8a}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Double Bar Comparator Lab</h1>
    <p>Build a pair of bar graphs and match differences</p>
  </div>
  <div class="card" id="sim"></div>
</div>
<script>
const sim=document.getElementById('sim');
const ROUNDS=[
  {cats:['A','B','C'], base:[5,3,4], diff:[2,-1,3]},
  {cats:['X','Y','Z'], base:[2,6,3], diff:[1,-2,2]},
  {cats:['P','Q','R'], base:[4,4,5], diff:[-1,2,1]},
  {cats:['L','M','N'], base:[6,2,4], diff:[-2,3,0]},
  {cats:['U','V','W'], base:[3,5,2], diff:[2,1,-1]}
];
let st={run:true,idx:0,score:0,lives:3,b:[0,0,0],resolved:false,msg:'',msgType:'info'};
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function setup(){ st.b=[0,0,0]; st.resolved=false; st.msg=''; st.msgType='info'; }
function bump(i,d){ if(!st.run||st.resolved) return; st.b[i]=clamp(st.b[i]+d,0,9); render(); }
function targetB(){ const r=ROUNDS[Math.min(st.idx,ROUNDS.length-1)]; return r.base.map((v,i)=>v+r.diff[i]); }
function check(){
  if(!st.run||st.resolved) return;
  const t=targetB(); st.resolved=true;
  const ok=t.every((v,i)=>v===st.b[i]);
  if(ok){ st.score+=14; st.msg='Comparator perfect!'; st.msgType='good'; }
  else{ st.lives--; st.msg=`Need second bars: ${t.join(', ')}`; st.msgType='bad'; if(st.lives<=0) st.run=false; }
  render();
}
function next(){ if(!st.resolved) return; st.idx++; if(st.idx>=ROUNDS.length){st.run=false; st.msg='Lab complete!'; st.msgType='good'; render(); return;} setup(); render(); }
function restart(){ st={run:true,idx:0,score:0,lives:3,b:[0,0,0],resolved:false,msg:'',msgType:'info'}; setup(); render(); }
function render(){
  const done=!st.run, r=ROUNDS[Math.min(st.idx,ROUNDS.length-1)], t=targetB();
  sim.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="k">Round</div><div class="v">${Math.min(st.idx+1,ROUNDS.length)}/${ROUNDS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Max</div><div class="v">9</div></div>
    </div>
    <div class="mission">Base bars (blue): ${r.base.join(', ')}. Build green bars so difference (green-blue) is ${r.diff.join(', ')}.</div>
    <div class="chart">
      <div class="axis"></div>
      <div class="bars">
        ${r.cats.map((c,i)=>`
          <div class="grp">
            <div class="barA" style="height:${r.base[i]*18+4}px"></div>
            <div class="barB" style="height:${st.b[i]*18+4}px"></div>
            <div class="lbl">${c}</div>
          </div>
        `).join('')}
      </div>
    </div>
    <div class="ctrls">
      ${r.cats.map((c,i)=>`
        <div class="ctrl">
          <div class="t">${c}</div>
          <div class="n">${st.b[i]}</div>
          ${!done&&!st.resolved?`<div class="row"><button class="mini" data-i="${i}" data-d="-2">--</button><button class="mini" data-i="${i}" data-d="-1">-</button><button class="mini" data-i="${i}" data-d="1">+</button><button class="mini" data-i="${i}" data-d="2">++</button></div>`:''}
        </div>
      `).join('')}
    </div>
    <div class="actions">
      ${done?`<button class="btn next" id="restartBtn">Restart</button>`:st.resolved?`<button class="btn next" id="nextBtn">${st.idx===ROUNDS.length-1?'Finish':'Next'}</button>`:`<button class="btn check" id="checkBtn">Check Comparator</button>`}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Tune each green bar with fine/coarse controls.</div>`}
  `;
  sim.querySelectorAll('.mini').forEach(b=>b.onclick=()=>bump(parseInt(b.dataset.i,10),parseInt(b.dataset.d,10)));
  const c=sim.querySelector('#checkBtn'); if(c) c.onclick=check;
  const n=sim.querySelector('#nextBtn'); if(n) n.onclick=next;
  const rs=sim.querySelector('#restartBtn'); if(rs) rs.onclick=restart;
  try{
    var _r=ROUNDS[Math.min(st.idx,ROUNDS.length-1)];
    var _t=_r.base.map(function(v,i){return v+_r.diff[i];});
    var _wrong=-1; for(var _i=0;_i<_t.length;_i++){ if(st.b[_i]!==_t[_i]){_wrong=_i;break;} }
    var _all=(_wrong===-1);
    var _gl=_all?sim.querySelector('#checkBtn'):(sim.querySelector('.mini[data-i="'+_wrong+'"][data-d="1"]')||sim.querySelector('.mini[data-i="'+_wrong+'"]'));
    if(!st.run){ window.__eduRound={native:true,line:(st.msg||'Lab complete!'),voice:(st.msgType==='good'?'Done.':'Try again.'),glow:sim.querySelector('#restartBtn'),submit:sim.querySelector('#restartBtn'),key:'over-'+st.idx}; }
    else if(st.resolved){ window.__eduRound={native:true,line:st.msg,voice:(st.msgType==='good'?'Correct.':'Not quite.'),submit:sim.querySelector('#nextBtn'),key:'res-'+st.idx}; }
    else { window.__eduRound={native:true,
      hint:'Set each green bar using the blue value and its difference.',hintVoice:'Build each green bar.',
      why:'A double bar graph compares two series; here green = blue + the difference.',
      detail:'Step 1 - Read the blue bar value for the category.\nStep 2 - Add the difference (it can be negative).\nStep 3 - Set the green bar, all three, then Check.\nWhy it works - pairing bars lets you compare two data sets per category.\nTip - a negative difference makes the green bar shorter than blue.',
      line:(_all?'All green bars match - tap Check.':('Category '+_r.cats[_wrong]+': green = '+_r.base[_wrong]+' + ('+_r.diff[_wrong]+') = '+_t[_wrong]+' (it is '+st.b[_wrong]+').')),
      voice:(_all?'Tap Check.':('Set '+_r.cats[_wrong]+' green to '+_t[_wrong]+'.')),
      glow:_gl,submit:(_all?sim.querySelector('#checkBtn'):null),key:'m-'+st.idx}; }
  }catch(e){}
}
setup(); render();
</script>
  <script src="edu-coach.js"></script>
</body>
</html>
