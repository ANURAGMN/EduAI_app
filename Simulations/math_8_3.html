<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0891b2">
<title>Fraction Equivalence Slider Lab</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#0891b2,#0e7490);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}.header h1{font-size:20px;font-weight:800}.header p{font-size:12px;opacity:.92}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#ecfeff;border-radius:10px;padding:8px;text-align:center}.k{font-size:10px;color:#0f766e;font-weight:700;text-transform:uppercase}.v{font-size:17px;font-weight:800;color:#0f172a}
.mission{background:#ecfeff;border:2px solid #99f6e4;border-radius:12px;padding:10px;margin-bottom:10px;font-size:12px;color:#134e4a}
.lab{background:#f8fafc;border:2px solid #cbd5e1;border-radius:12px;padding:10px}
.eq{font-size:26px;text-align:center;font-weight:900;color:#0f172a;margin:6px 0 10px}
.row{display:grid;grid-template-columns:1fr 24px 1fr;gap:6px;align-items:center}
.slot{background:#fff;border:2px solid #cbd5e1;border-radius:10px;padding:10px;text-align:center}
.slot .n{font-size:26px;font-family:'Courier New',monospace;font-weight:900}
.slider{width:100%;margin-top:8px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.sbtn{padding:8px;border:none;border-radius:8px;background:#d1fae5;color:#065f46;font-weight:800;cursor:pointer}
.ninput{width:100%;margin-top:8px;padding:9px;border:2px solid #99f6e4;border-radius:9px;font-weight:800}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.check{background:#0f766e;color:#fff}.next{background:#0e7490;color:#fff}.retry{background:#334155;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.4}
.good{background:#dcfce7;color:#166534}.bad{background:#fef2f2;color:#991b1b}.info{background:#eff6ff;color:#1e3a8a}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Fraction Equivalence Slider Lab</h1>
    <p>Tune numerator and denominator sliders to create equivalent fractions</p>
  </div>
  <div class="card" id="sim"></div>
</div>
<script>
const sim=document.getElementById('sim');
const ROUNDS=[
  {base:[1,2], targetDen:6},
  {base:[2,3], targetDen:12},
  {base:[3,5], targetDen:20},
  {base:[4,7], targetDen:28},
  {base:[5,8], targetDen:32},
  {base:[3,4], targetDen:16}
];
let st={run:true,idx:0,score:0,lives:3,resolved:false,msg:'',msgType:'info',n:1,d:2};
function setupRound(){
  const r=ROUNDS[Math.min(st.idx,ROUNDS.length-1)];
  st.n=r.base[0]; st.d=r.targetDen; st.resolved=false; st.msg=''; st.msgType='info';
}
function setN(v){if(!st.run||st.resolved)return; st.n=parseInt(v,10); render();}
function setD(v){if(!st.run||st.resolved)return; st.d=parseInt(v,10); render();}
function nudgeN(step){
  if(!st.run||st.resolved) return;
  const r=ROUNDS[Math.min(st.idx,ROUNDS.length-1)];
  st.n=Math.max(1,Math.min(r.targetDen,st.n+step));
  render();
}
function check(){
  if(!st.run||st.resolved)return;
  const r=ROUNDS[st.idx];
  const left=r.base[0]/r.base[1], right=st.n/st.d;
  st.resolved=true;
  if(Math.abs(left-right)<1e-9 && st.d===r.targetDen){
    st.score+=12; st.msg='Equivalent fraction built perfectly.'; st.msgType='good';
  }else{
    st.lives--; const req=(r.targetDen/r.base[1])*r.base[0];
    st.msg=`Need ${req}/${r.targetDen} to match ${r.base[0]}/${r.base[1]}.`; st.msgType='bad';
    if(st.lives<=0) st.run=false;
  }
  render();
}
function retry(){if(st.resolved&&st.run){setupRound();render();}}
function next(){
  if(!st.resolved)return;
  st.idx++;
  if(st.idx>=ROUNDS.length){st.run=false;st.msg='Lab sessions complete!';st.msgType='good';render();return;}
  setupRound(); render();
}
function restart(){st={run:true,idx:0,score:0,lives:3,resolved:false,msg:'',msgType:'info',n:1,d:2}; setupRound(); render();}
function render(){
  const done=!st.run, r=ROUNDS[Math.min(st.idx,ROUNDS.length-1)];
  const equal=Math.abs(r.base[0]/r.base[1]-st.n/st.d)<1e-9;
  sim.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="k">Round</div><div class="v">${Math.min(st.idx+1,ROUNDS.length)}/${ROUNDS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">State</div><div class="v">${equal?'Equal':'Try'}</div></div>
    </div>
    <div class="mission">Build an equivalent of <b>${r.base[0]}/${r.base[1]}</b> with denominator fixed at <b>${r.targetDen}</b>.</div>
    <div class="lab">
      <div class="row">
        <div class="slot"><div style="font-size:11px;color:#475569">Base</div><div class="n">${r.base[0]}/${r.base[1]}</div></div>
        <div style="text-align:center;font-size:20px;font-weight:900;color:#0f172a">=</div>
        <div class="slot"><div style="font-size:11px;color:#475569">Your Build</div><div class="n">${st.n}/${st.d}</div></div>
      </div>
      <div style="margin-top:10px;font-size:12px;color:#0f766e">Numerator: ${st.n}</div>
      <input class="slider" type="range" min="1" max="${r.targetDen}" value="${st.n}" id="nSlider">
      <div class="steps">
        <button class="sbtn" id="nMinus5">-5</button>
        <button class="sbtn" id="nMinus1">-1</button>
        <button class="sbtn" id="nPlus1">+1</button>
        <button class="sbtn" id="nPlus5">+5</button>
      </div>
      <input class="ninput" id="nInput" type="number" min="1" max="${r.targetDen}" value="${st.n}">
      <div style="margin-top:8px;font-size:12px;color:#0f766e">Denominator: ${st.d}</div>
      <input class="slider" type="range" min="${r.targetDen}" max="${r.targetDen}" value="${st.d}" id="dSlider">
      <div class="eq">${equal?'Equivalent ✓':'Not equivalent yet'}</div>
    </div>
    <div class="actions">
      ${done?`<button class="btn next" id="restartBtn">Restart</button>`:st.resolved?`<button class="btn retry" id="retryBtn">Retry</button><button class="btn next" id="nextBtn">${st.idx===ROUNDS.length-1?'Finish':'Next'}</button>`:`<button class="btn check" id="checkBtn">Lock Build</button>`}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Slide numerator until value matches base fraction.</div>`}
  `;
  const ns=sim.querySelector('#nSlider'); if(ns) ns.oninput=e=>setN(e.target.value);
  const ds=sim.querySelector('#dSlider'); if(ds) ds.oninput=e=>setD(e.target.value);
  const ni=sim.querySelector('#nInput'); if(ni) ni.oninput=e=>setN(e.target.value);
  const nm5=sim.querySelector('#nMinus5'); if(nm5) nm5.onclick=()=>nudgeN(-5);
  const nm1=sim.querySelector('#nMinus1'); if(nm1) nm1.onclick=()=>nudgeN(-1);
  const np1=sim.querySelector('#nPlus1'); if(np1) np1.onclick=()=>nudgeN(1);
  const np5=sim.querySelector('#nPlus5'); if(np5) np5.onclick=()=>nudgeN(5);
  const c=sim.querySelector('#checkBtn'); if(c) c.onclick=check;
  const rt=sim.querySelector('#retryBtn'); if(rt) rt.onclick=retry;
  const n=sim.querySelector('#nextBtn'); if(n) n.onclick=next;
  const rs=sim.querySelector('#restartBtn'); if(rs) rs.onclick=restart;
  try{
    var _r=ROUNDS[Math.min(st.idx,ROUNDS.length-1)];
    var _factor=_r.targetDen/_r.base[1];
    var _req=_factor*_r.base[0];
    var _eqNow=Math.abs(_r.base[0]/_r.base[1]-st.n/st.d)<1e-9;
    var _nGlow=[sim.querySelector('#nSlider'),sim.querySelector('#nInput')].filter(Boolean);
    if(!st.run){ window.__eduRound={native:true,line:(st.msg||'Lab sessions complete!'),voice:(st.msgType==='good'?'Done.':'Try again.'),glow:sim.querySelector('#restartBtn'),submit:sim.querySelector('#restartBtn'),key:'over-'+st.idx}; }
    else if(st.resolved){ window.__eduRound={native:true,line:st.msg,voice:(st.msgType==='good'?'Correct.':'Not quite.'),submit:(sim.querySelector('#nextBtn')||sim.querySelector('#retryBtn')),key:'res-'+st.idx}; }
    else { window.__eduRound={native:true,
      hint:'Make '+_r.base[0]+'/'+_r.base[1]+' into '+_r.targetDen+'ths. What numerator over '+_r.targetDen+'?',hintVoice:'What numerator over '+_r.targetDen+'?',
      why:'To rewrite with a bigger denominator, multiply top and bottom by the same factor.',
      detail:'Step 1 - How many times bigger is the target denominator? '+_r.targetDen+' / '+_r.base[1]+' = '+_factor+'.\nStep 2 - Multiply the numerator by the same factor: '+_r.base[0]+' * '+_factor+' = '+_req+'.\nStep 3 - Set the numerator to '+_req+', then Check.\nWhy it works - scaling both parts equally keeps the value.\nTip - the denominator factor and numerator factor must match.',
      line:(_eqNow?(st.n+'/'+st.d+' equals '+_r.base[0]+'/'+_r.base[1]+' - tap Check.'):('Numerator is '+st.n+' - set it to '+_req+'.')),
      voice:'Set the numerator to '+_req+'.',
      glow:(_eqNow?sim.querySelector('#checkBtn'):_nGlow),submit:(_eqNow?sim.querySelector('#checkBtn'):null),key:'m-'+st.idx}; }
  }catch(e){}
}
setupRound(); render();
</script>
  <script src="edu-coach.js"></script>
</body>
</html>
