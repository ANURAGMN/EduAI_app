<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0284c7">
<title>Frequency Table Rescue</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#0284c7,#0ea5e9);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}
.header p{font-size:12px;opacity:.92}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#ecfeff;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#0f766e;font-weight:700;text-transform:uppercase}
.v{font-size:18px;font-weight:800;color:#111827}
.mission{background:linear-gradient(135deg,#ecfeff,#e0f2fe);border:2px solid #67e8f9;border-radius:12px;padding:10px;margin-bottom:10px}
.mission p{font-size:12px;color:#0c4a6e;line-height:1.45}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cell{background:#f8fafc;border:2px solid #cbd5e1;border-radius:10px;padding:8px;text-align:center}
.cell .l{font-size:11px;color:#475569}
.cell .n{font-size:18px;font-family:'Courier New',monospace;font-weight:900;color:#0f172a}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{padding:10px;border:2px solid #d1d5db;border-radius:10px;background:#fff;cursor:pointer;font-weight:800}
.opt.sel{border-color:#0284c7;background:#e0f2fe;color:#0c4a6e}
.opt.ok{border-color:#16a34a;background:#dcfce7;color:#166534}
.opt.bad{border-color:#dc2626;background:#fef2f2;color:#991b1b}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.btn.check{background:#0284c7;color:#fff}
.btn.next{background:#0f766e;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.45}
.msg.good{background:#dcfce7;color:#166534}
.msg.bad{background:#fef2f2;color:#991b1b}
.msg.info{background:#eff6ff;color:#1e3a8a}
.insight{margin-top:12px;background:linear-gradient(135deg,#ecfeff,#e0f2fe);border-left:4px solid #0284c7;border-radius:12px;padding:12px;font-size:12px;color:#111827;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Frequency Table Rescue</h1>
    <p>Recover missing frequencies from raw observations</p>
  </div>
  <div class="card" id="sim"></div>
  <div class="insight"><b>Chapter 9 focus:</b> make frequency tables from data and fill missing counts logically.</div>
</div>
<script>
const sim = document.getElementById('sim');
const ROUNDS = [
  {raw:[1,2,1,3,2,1,4,2], cat:'2', ans:3, opts:[2,3,4,5]},
  {raw:[5,6,5,7,6,6,5,8], cat:'7', ans:1, opts:[1,2,3,4]},
  {raw:[2,2,3,3,3,4,4,5], cat:'4', ans:2, opts:[1,2,3,4]},
  {raw:[9,8,9,7,8,9,7,7], cat:'8', ans:2, opts:[1,2,3,4]},
  {raw:[1,1,1,2,2,3,4,4], cat:'1', ans:3, opts:[2,3,4,5]},
  {raw:[6,6,6,5,5,4,4,4], cat:'5', ans:2, opts:[1,2,3,4]}
];

let st={run:true,idx:0,score:0,lives:3,pick:null,resolved:false,msg:'',msgType:'info'};
function choose(v){ if(!st.run||st.resolved) return; st.pick=v; render(); }
function check(){
  if(!st.run||st.resolved||st.pick===null) return;
  const r=ROUNDS[st.idx];
  st.resolved=true;
  if(st.pick===r.ans){ st.score+=12; st.msg='Correct frequency recovered.'; st.msgType='good'; }
  else { st.lives--; st.msg=`Correct count for ${r.cat} is ${r.ans}.`; st.msgType='bad'; if(st.lives<=0) st.run=false; }
  render();
}
function next(){
  if(!st.resolved) return;
  st.idx++;
  if(st.idx>=ROUNDS.length){ st.run=false; st.msg='Rescue complete!'; st.msgType='good'; render(); return; }
  st.pick=null; st.resolved=false; st.msg=''; st.msgType='info'; render();
}
function restart(){ st={run:true,idx:0,score:0,lives:3,pick:null,resolved:false,msg:'',msgType:'info'}; render(); }
function render(){
  const done=!st.run;
  const r=ROUNDS[Math.min(st.idx,ROUNDS.length-1)];
  const sample = r.raw.slice(0,4).join(', ') + ' ...';
  sim.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="k">Round</div><div class="v">${Math.min(st.idx+1,ROUNDS.length)}/${ROUNDS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Category</div><div class="v">${r.cat}</div></div>
    </div>
    <div class="mission">
      <p>From the raw data list, find frequency of category <b>${r.cat}</b>.</p>
      <div class="row">
        <div class="cell"><div class="l">Data sample</div><div class="n">${sample}</div></div>
        <div class="cell"><div class="l">Missing freq</div><div class="n">?</div></div>
      </div>
    </div>
    <div class="opts">
      ${r.opts.map(v=>{
        const cls=st.resolved?(v===r.ans?'ok':(v===st.pick?'bad':'')):(v===st.pick?'sel':'');
        return `<button class="opt ${cls}" data-v="${v}">${v}</button>`;
      }).join('')}
    </div>
    <div class="actions">
      ${done?`<button class="btn next" id="restartBtn">Restart</button>`:(st.resolved?`<button class="btn next" id="nextBtn">${st.idx===ROUNDS.length-1?'Finish':'Next'}</button>`:`<button class="btn check" id="checkBtn">Check Frequency</button>`)}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Count exact occurrences of target category.</div>`}
  `;
  sim.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(Number(b.dataset.v)));
  const c=sim.querySelector('#checkBtn'); if(c) c.onclick=check;
  const n=sim.querySelector('#nextBtn'); if(n) n.onclick=next;
  const rbtn=sim.querySelector('#restartBtn'); if(rbtn) rbtn.onclick=restart;
  try{
    var _r=ROUNDS[Math.min(st.idx,ROUNDS.length-1)];
    var _opts=Array.prototype.slice.call(sim.querySelectorAll('.opt'));
    var _ansEl=null; for(var _k=0;_k<_opts.length;_k++){ if(Number(_opts[_k].dataset.v)===_r.ans){_ansEl=_opts[_k];break;} }
    if(!st.run){ window.__eduRound={native:true,line:(st.msg||'Rescue complete!'),voice:(st.msgType==='good'?'Done.':'Try again.'),glow:sim.querySelector('#restartBtn'),submit:sim.querySelector('#restartBtn'),key:'over-'+st.idx}; }
    else if(st.resolved){ window.__eduRound={native:true,line:st.msg,voice:(st.msgType==='good'?'Correct.':'Not quite.'),submit:sim.querySelector('#nextBtn'),key:'res-'+st.idx}; }
    else { window.__eduRound={native:true,
      hint:'How many times does '+_r.cat+' appear in the data?',hintVoice:'How many times does it appear?',
      why:'Frequency is how many times a value occurs in the data.',
      detail:'Step 1 - Scan the data for every '+_r.cat+'.\nStep 2 - Tally each one you find.\nStep 3 - Tap that count.\nWhy it works - that tally is the frequency of '+_r.cat+'.\nTip - cross off each as you count so you do not double-count.',
      line:_r.cat+' appears '+_r.ans+' times.',
      voice:'It appears '+_r.ans+' times.',
      glow:(st.pick!==null?sim.querySelector('#checkBtn'):_ansEl),submit:(st.pick!==null?sim.querySelector('#checkBtn'):null),key:'m-'+st.idx}; }
  }catch(e){}
}
render();
</script>
  <script src="edu-coach.js"></script>
</body>
</html>
