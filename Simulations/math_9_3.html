<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0284c7">
<title>Data Range Outlier Patrol</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#0284c7,#0369a1);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}.header p{font-size:12px;opacity:.92}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#ecfeff;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#0f766e;font-weight:700;text-transform:uppercase}.v{font-size:17px;font-weight:800;color:#0f172a}
.mission{background:#ecfeff;border:2px solid #99f6e4;border-radius:12px;padding:10px;margin-bottom:10px;font-size:12px;color:#134e4a}
.list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:7px 9px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-weight:800;cursor:pointer}
.chip.sel{border-color:#0284c7;background:#e0f2fe;color:#0c4a6e}
.chip.lock{border-color:#16a34a;background:#dcfce7;color:#166534}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.box{background:#f8fafc;border:2px solid #cbd5e1;border-radius:10px;padding:8px;text-align:center}
.box .t{font-size:11px;color:#475569}.box .n{font-size:20px;font-weight:900;color:#0f172a;font-family:'Courier New',monospace}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.check{background:#0284c7;color:#fff}.next{background:#0f766e;color:#fff}.retry{background:#334155;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.4}
.good{background:#dcfce7;color:#166534}.bad{background:#fef2f2;color:#991b1b}.info{background:#eff6ff;color:#1e3a8a}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Data Range Outlier Patrol</h1>
    <p>Detect min, max, range and suspicious outliers</p>
  </div>
  <div class="card" id="sim"></div>
</div>
<script>
const sim=document.getElementById('sim');
const ROUNDS=[
  {data:[12,15,13,14,16,55], out:55},
  {data:[22,24,23,25,21,19], out:null},
  {data:[31,30,32,29,33,10], out:10},
  {data:[8,9,11,10,12,35], out:35},
  {data:[40,42,41,44,43,39], out:null}
];
let st={run:true,idx:0,score:0,lives:3,sel:null,resolved:false,msg:'',msgType:'info',minIn:'',maxIn:''};
function setup(){ st.sel=null; st.resolved=false; st.msg=''; st.msgType='info'; st.minIn=''; st.maxIn=''; }
function pick(v){ if(!st.run||st.resolved) return; st.sel=v; render(); }
function check(){
  if(!st.run||st.resolved) return;
  const r=ROUNDS[st.idx], arr=r.data.slice().sort((a,b)=>a-b);
  const mn=arr[0], mx=arr[arr.length-1], outOk=(r.out===null?st.sel===null:st.sel===r.out);
  st.resolved=true;
  const minOk=parseFloat(st.minIn)===mn, maxOk=parseFloat(st.maxIn)===mx;
  if(minOk&&maxOk&&outOk){ st.score+=15; st.msg='Patrol success! stats and outlier are correct.'; st.msgType='good'; }
  else{ st.lives--; st.msg=`Need min=${mn}, max=${mx}, range=${mx-mn}${r.out===null?', no outlier':', outlier='+r.out}.`; st.msgType='bad'; if(st.lives<=0) st.run=false; }
  render();
}
function next(){ if(!st.resolved) return; st.idx++; if(st.idx>=ROUNDS.length){st.run=false; st.msg='Patrol complete!'; st.msgType='good'; render(); return;} setup(); render(); }
function retry(){ if(st.run&&st.resolved){ setup(); render(); } }
function restart(){ st={run:true,idx:0,score:0,lives:3,sel:null,resolved:false,msg:'',msgType:'info',minIn:'',maxIn:''}; setup(); render(); }
function render(){
  const done=!st.run, r=ROUNDS[Math.min(st.idx,ROUNDS.length-1)];
  const arr=r.data.slice().sort((a,b)=>a-b), liveMin=arr[0], liveMax=arr[arr.length-1], liveRange=liveMax-liveMin;
  sim.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="k">Round</div><div class="v">${Math.min(st.idx+1,ROUNDS.length)}/${ROUNDS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Data size</div><div class="v">${r.data.length}</div></div>
    </div>
    <div class="mission">Mission: Enter min and max, then mark an outlier only if one clearly exists.</div>
    <div class="list">
      ${r.data.map(v=>`<button class="chip ${(st.sel===v)?'sel':''} ${(st.resolved&&r.out===v)?'lock':''}" data-v="${v}" ${done||st.resolved?'disabled':''}>${v}</button>`).join('')}
    </div>
    <div style="font-size:12px;color:#475569;margin-top:8px">Outlier selected: <b>${st.sel===null?'None':st.sel}</b></div>
    <div class="row">
      <div class="box">
        <div class="t">Min</div>
        <input id="minIn" type="number" value="${st.minIn}" ${done||st.resolved?'disabled':''} style="width:100%;margin-top:6px;padding:8px;border:2px solid #cbd5e1;border-radius:8px;font-weight:800">
      </div>
      <div class="box">
        <div class="t">Max</div>
        <input id="maxIn" type="number" value="${st.maxIn}" ${done||st.resolved?'disabled':''} style="width:100%;margin-top:6px;padding:8px;border:2px solid #cbd5e1;border-radius:8px;font-weight:800">
      </div>
    </div>
    <div class="row">
      <div class="box"><div class="t">Live Range</div><div class="n">${liveRange}</div></div>
      <div class="box"><div class="t">Sorted</div><div class="n" style="font-size:13px">${arr.join(', ')}</div></div>
    </div>
    <div class="actions">
      ${done?`<button class="btn next" id="restartBtn">Restart</button>`:st.resolved?`<button class="btn retry" id="retryBtn">Retry</button><button class="btn next" id="nextBtn">${st.idx===ROUNDS.length-1?'Finish':'Next'}</button>`:`<button class="btn check" id="checkBtn">Check Patrol</button>`}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Click a value to mark outlier, or keep none selected.</div>`}
  `;
  sim.querySelectorAll('.chip').forEach(b=>b.onclick=()=>pick(parseFloat(b.dataset.v)));
  const mi=sim.querySelector('#minIn'); if(mi) mi.oninput=e=>st.minIn=e.target.value;
  const ma=sim.querySelector('#maxIn'); if(ma) ma.oninput=e=>st.maxIn=e.target.value;
  const c=sim.querySelector('#checkBtn'); if(c) c.onclick=check;
  const n=sim.querySelector('#nextBtn'); if(n) n.onclick=next;
  const rb=sim.querySelector('#retryBtn'); if(rb) rb.onclick=retry;
  const rs=sim.querySelector('#restartBtn'); if(rs) rs.onclick=restart;
}
setup(); render();
</script>
</body>
</html>
