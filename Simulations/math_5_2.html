<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Angle Relation Signal Tower</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#2563eb,#1d4ed8);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}.header p{font-size:12px;opacity:.92}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#eff6ff;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#1d4ed8;font-weight:700;text-transform:uppercase}.v{font-size:17px;font-weight:800;color:#0f172a}
.mission{background:#eff6ff;border:2px solid #bfdbfe;border-radius:12px;padding:10px;margin-bottom:10px;font-size:12px;color:#1e3a8a}
.stage{height:250px;background:#f8fafc;border:2px solid #cbd5e1;border-radius:12px;overflow:hidden}
svg{width:100%;height:100%;display:block;touch-action:none}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.nbtn{padding:8px;border:none;border-radius:8px;background:#dbeafe;color:#1d4ed8;font-weight:800;cursor:pointer}
.nbtn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.check{background:#2563eb;color:#fff}.next{background:#0f766e;color:#fff}.retry{background:#334155;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.4}
.good{background:#dcfce7;color:#166534}.bad{background:#fef2f2;color:#991b1b}.info{background:#eff6ff;color:#1e3a8a}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Angle Relation Signal Tower</h1>
    <p>Tune transversal to broadcast the target relation angle</p>
  </div>
  <div class="card" id="sim"></div>
</div>
<script>
const sim=document.getElementById('sim');
const MISSIONS=[
  {rel:'corresponding',target:46,tol:2},
  {rel:'alternate',target:72,tol:2},
  {rel:'interior',target:112,tol:2},
  {rel:'corresponding',target:128,tol:2},
  {rel:'alternate',target:94,tol:2}
];
let st={run:true,idx:0,score:0,lives:3,resolved:false,msg:'',msgType:'info',x:48};
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function setup(){st.x=35+Math.random()*110;st.resolved=false;st.msg='';st.msgType='info';}
function value(){
  const m=MISSIONS[Math.min(st.idx,MISSIONS.length-1)];
  if(m.rel==='interior') return 180-st.x;
  return st.x;
}
function nudge(d){if(!st.run||st.resolved)return;st.x=clamp(st.x+d,10,170);render();}
function setX(v){if(!st.run||st.resolved)return;st.x=clamp(parseFloat(v)||0,10,170);render();}
function check(){
  if(!st.run||st.resolved)return;
  const m=MISSIONS[st.idx], got=value(); st.resolved=true;
  if(Math.abs(got-m.target)<=m.tol){st.score+=15;st.msg='Signal locked correctly.';st.msgType='good';}
  else{st.lives--;st.msg=`Need ${m.target}° for ${m.rel} relation. You got ${got.toFixed(1)}°.`;st.msgType='bad';if(st.lives<=0)st.run=false;}
  render();
}
function next(){if(!st.resolved)return;st.idx++;if(st.idx>=MISSIONS.length){st.run=false;st.msg='Tower missions complete!';st.msgType='good';render();return;}setup();render();}
function retry(){if(st.run&&st.resolved){setup();render();}}
function restart(){st={run:true,idx:0,score:0,lives:3,resolved:false,msg:'',msgType:'info',x:48};setup();render();}
function render(){
  const done=!st.run,m=MISSIONS[Math.min(st.idx,MISSIONS.length-1)];
  const show=value();
  sim.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="k">Round</div><div class="v">${Math.min(st.idx+1,MISSIONS.length)}/${MISSIONS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Target</div><div class="v">${m.target}°</div></div>
    </div>
    <div class="mission">Mission: tune to make <b>${m.rel}</b> angle = <b>${m.target}° ± ${m.tol}°</b>. Current relation angle: <b>${show.toFixed(1)}°</b></div>
    <div class="stage">
      <svg id="svg" viewBox="0 0 400 250">
        <rect x="0" y="0" width="400" height="250" fill="#f8fafc"/>
        <line x1="40" y1="70" x2="360" y2="70" stroke="#334155" stroke-width="4"/>
        <line x1="40" y1="180" x2="360" y2="180" stroke="#334155" stroke-width="4"/>
        <line id="tline" x1="130" y1="20" x2="270" y2="230" stroke="#2563eb" stroke-width="4"/>
        <circle cx="200" cy="125" r="6" fill="#0f172a"/>
        <circle id="handle" cx="250" cy="200" r="11" fill="#2563eb" stroke="#fff" stroke-width="3"/>
      </svg>
    </div>
    <div class="controls">
      <button class="nbtn" id="m5" ${done||st.resolved?'disabled':''}>-5°</button>
      <button class="nbtn" id="m1" ${done||st.resolved?'disabled':''}>-1°</button>
      <button class="nbtn" id="p1" ${done||st.resolved?'disabled':''}>+1°</button>
      <button class="nbtn" id="p5" ${done||st.resolved?'disabled':''}>+5°</button>
    </div>
    <div style="font-size:12px;color:#1e3a8a;margin-top:8px">Transversal angle ${st.x.toFixed(1)}°<input id="xSlider" type="range" min="10" max="170" step="0.1" value="${st.x.toFixed(1)}" style="width:100%" ${done||st.resolved?'disabled':''}></div>
    <div class="actions">
      ${done?`<button class="btn next" id="restartBtn">Restart</button>`:st.resolved?`<button class="btn retry" id="retryBtn">Retry</button><button class="btn next" id="nextBtn">${st.idx===MISSIONS.length-1?'Finish':'Next'}</button>`:`<button class="btn check" id="checkBtn">Lock Signal</button>`}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Use drag + precision controls to lock exact relation.</div>`}
  `;
  const svg=sim.querySelector('#svg'), tl=sim.querySelector('#tline'), h=sim.querySelector('#handle');
  const cx=200,cy=125,r=130;
  function paint(d){
    st.x=clamp(d,10,170);
    const rad=st.x*Math.PI/180;
    const x2=cx+Math.cos(rad)*r,y2=cy+Math.sin(rad)*r,x1=cx-Math.cos(rad)*r,y1=cy-Math.sin(rad)*r;
    tl.setAttribute('x1',x1.toFixed(1));tl.setAttribute('y1',y1.toFixed(1));tl.setAttribute('x2',x2.toFixed(1));tl.setAttribute('y2',y2.toFixed(1));
    h.setAttribute('cx',x2.toFixed(1));h.setAttribute('cy',y2.toFixed(1));
  }
  paint(st.x);
  function ptr(e){
    const b=svg.getBoundingClientRect();
    const x=(e.clientX-b.left)*(400/b.width),y=(e.clientY-b.top)*(250/b.height);
    return Math.atan2(y-cy,x-cx)*180/Math.PI;
  }
  let drag=false;
  if(!done&&!st.resolved){
    svg.addEventListener('pointerdown',e=>{drag=true;svg.setPointerCapture(e.pointerId);paint(ptr(e));render();});
    svg.addEventListener('pointermove',e=>{if(!drag)return;paint(ptr(e));render();});
    svg.addEventListener('pointerup',()=>drag=false);svg.addEventListener('pointercancel',()=>drag=false);
  }
  const bind=(id,d)=>{const el=sim.querySelector('#'+id);if(el)el.onclick=()=>nudge(d);};
  bind('m5',-5);bind('m1',-1);bind('p1',1);bind('p5',5);
  const sl=sim.querySelector('#xSlider');if(sl)sl.oninput=e=>setX(e.target.value);
  const c=sim.querySelector('#checkBtn');if(c)c.onclick=check;
  const n=sim.querySelector('#nextBtn');if(n)n.onclick=next;
  const rb=sim.querySelector('#retryBtn');if(rb)rb.onclick=retry;
  const rs=sim.querySelector('#restartBtn');if(rs)rs.onclick=restart;
}
setup();render();
</script>
</body>
</html>
