<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>Angle Pair Builder Dock</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#7c3aed,#5b21b6);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}.header p{font-size:12px;opacity:.92}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#f5f3ff;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#6d28d9;font-weight:700;text-transform:uppercase}.v{font-size:17px;font-weight:800;color:#0f172a}
.mission{background:#faf5ff;border:2px solid #ddd6fe;border-radius:12px;padding:10px;margin-bottom:10px;font-size:12px;color:#5b21b6}
.stage{height:250px;background:#fafafa;border:2px solid #cbd5e1;border-radius:12px;overflow:hidden}
svg{width:100%;height:100%;display:block;touch-action:none}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.nbtn{padding:8px;border:none;border-radius:8px;background:#ede9fe;color:#5b21b6;font-weight:800;cursor:pointer}
.nbtn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.check{background:#7c3aed;color:#fff}.next{background:#0f766e;color:#fff}.retry{background:#334155;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.4}
.good{background:#dcfce7;color:#166534}.bad{background:#fef2f2;color:#991b1b}.info{background:#eff6ff;color:#1e3a8a}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Angle Pair Builder Dock</h1>
    <p>Build matching angle pairs around an intersection</p>
  </div>
  <div class="card" id="sim"></div>
</div>
<script>
const sim=document.getElementById('sim');
const MISSIONS=[
  {mode:'vertical',target:42,tol:2,label:'Vertically opposite'},
  {mode:'linear',target:120,tol:2,label:'Linear pair'},
  {mode:'vertical',target:75,tol:2,label:'Vertically opposite'},
  {mode:'linear',target:98,tol:2,label:'Linear pair'},
  {mode:'vertical',target:134,tol:2,label:'Vertically opposite'}
];
let st={run:true,idx:0,score:0,lives:3,resolved:false,msg:'',msgType:'info',a:35};
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function setup(){ st.a=25+Math.random()*130; st.resolved=false; st.msg=''; st.msgType='info'; }
function nudge(d){ if(!st.run||st.resolved) return; st.a=clamp(st.a+d,5,175); render(); }
function setA(v){ if(!st.run||st.resolved) return; st.a=clamp(parseFloat(v)||0,5,175); render(); }
function values(){ return {a:st.a,b:180-st.a,c:st.a,d:180-st.a}; }
function pairVal(mode,v){ return mode==='vertical'?v.a:v.b; }
function check(){
  if(!st.run||st.resolved) return;
  const m=MISSIONS[st.idx], v=values(); st.resolved=true;
  const got=pairVal(m.mode,v);
  if(Math.abs(got-m.target)<=m.tol){ st.score+=15; st.msg=`Great! ${m.label} target met.`; st.msgType='good'; }
  else{ st.lives--; st.msg=`Need ${m.target}° (${m.label}). You built ${got.toFixed(1)}°.`; st.msgType='bad'; if(st.lives<=0) st.run=false; }
  render();
}
function next(){ if(!st.resolved) return; st.idx++; if(st.idx>=MISSIONS.length){st.run=false; st.msg='Dock complete!'; st.msgType='good'; render(); return;} setup(); render(); }
function retry(){ if(st.run&&st.resolved){ setup(); render(); } }
function restart(){ st={run:true,idx:0,score:0,lives:3,resolved:false,msg:'',msgType:'info',a:35}; setup(); render(); }
function render(){
  const done=!st.run, m=MISSIONS[Math.min(st.idx,MISSIONS.length-1)], v=values();
  sim.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="k">Round</div><div class="v">${Math.min(st.idx+1,MISSIONS.length)}/${MISSIONS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Target</div><div class="v">${m.target}°</div></div>
    </div>
    <div class="mission">Mission: Build <b>${m.label}</b> angle of <b>${m.target}° ± ${m.tol}°</b> by rotating line arm.</div>
    <div class="stage">
      <svg id="svg" viewBox="0 0 400 250">
        <rect x="0" y="0" width="400" height="250" fill="#fafafa"/>
        <line x1="40" y1="125" x2="360" y2="125" stroke="#334155" stroke-width="4"/>
        <line id="rotLine" x1="80" y1="175" x2="320" y2="75" stroke="#7c3aed" stroke-width="4"/>
        <circle cx="200" cy="125" r="6" fill="#0f172a"/>
        <circle id="handle" cx="300" cy="90" r="11" fill="#7c3aed" stroke="#fff" stroke-width="3"/>
        <text x="242" y="106" font-size="13" fill="#dc2626" font-weight="700">a ${v.a.toFixed(1)}°</text>
        <text x="132" y="106" font-size="13" fill="#16a34a" font-weight="700">b ${v.b.toFixed(1)}°</text>
        <text x="132" y="148" font-size="13" fill="#16a34a" font-weight="700">c ${v.c.toFixed(1)}°</text>
        <text x="242" y="148" font-size="13" fill="#dc2626" font-weight="700">d ${v.d.toFixed(1)}°</text>
      </svg>
    </div>
    <div class="row">
      <button class="nbtn" id="m5" ${done||st.resolved?'disabled':''}>-5°</button>
      <button class="nbtn" id="m1" ${done||st.resolved?'disabled':''}>-1°</button>
      <button class="nbtn" id="p1" ${done||st.resolved?'disabled':''}>+1°</button>
      <button class="nbtn" id="p5" ${done||st.resolved?'disabled':''}>+5°</button>
    </div>
    <div style="font-size:12px;color:#5b21b6;margin-top:8px">Angle control: ${v.a.toFixed(1)}°<input id="aSlider" type="range" min="5" max="175" step="0.1" value="${v.a.toFixed(1)}" style="width:100%" ${done||st.resolved?'disabled':''}></div>
    <div class="actions">
      ${done?`<button class="btn next" id="restartBtn">Restart</button>`:st.resolved?`<button class="btn retry" id="retryBtn">Retry</button><button class="btn next" id="nextBtn">${st.idx===MISSIONS.length-1?'Finish':'Next'}</button>`:`<button class="btn check" id="checkBtn">Lock Pair</button>`}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Drag the handle or use precision controls.</div>`}
  `;
  const svg=sim.querySelector('#svg'), line=sim.querySelector('#rotLine'), h=sim.querySelector('#handle');
  const cx=200, cy=125, r=120;
  function paint(deg){
    st.a=clamp(deg,5,175);
    const rad=st.a*Math.PI/180;
    const x2=cx+Math.cos(rad)*r, y2=cy-Math.sin(rad)*r;
    const x1=cx-Math.cos(rad)*r, y1=cy+Math.sin(rad)*r;
    line.setAttribute('x1',x1.toFixed(1)); line.setAttribute('y1',y1.toFixed(1));
    line.setAttribute('x2',x2.toFixed(1)); line.setAttribute('y2',y2.toFixed(1));
    h.setAttribute('cx',x2.toFixed(1)); h.setAttribute('cy',y2.toFixed(1));
  }
  paint(st.a);
  function toDeg(e){
    const rct=svg.getBoundingClientRect();
    const x=(e.clientX-rct.left)*(400/rct.width), y=(e.clientY-rct.top)*(250/rct.height);
    return Math.atan2(cy-y,x-cx)*180/Math.PI;
  }
  let drag=false;
  if(!done&&!st.resolved){
    svg.addEventListener('pointerdown',e=>{drag=true;svg.setPointerCapture(e.pointerId);paint(toDeg(e));render();});
    svg.addEventListener('pointermove',e=>{if(!drag) return;paint(toDeg(e));render();});
    svg.addEventListener('pointerup',()=>drag=false); svg.addEventListener('pointercancel',()=>drag=false);
  }
  const bind=(id,d)=>{const el=sim.querySelector('#'+id); if(el) el.onclick=()=>nudge(d);};
  bind('m5',-5); bind('m1',-1); bind('p1',1); bind('p5',5);
  const sl=sim.querySelector('#aSlider'); if(sl) sl.oninput=e=>setA(e.target.value);
  const c=sim.querySelector('#checkBtn'); if(c) c.onclick=check;
  const n=sim.querySelector('#nextBtn'); if(n) n.onclick=next;
  const retryBtn=sim.querySelector('#retryBtn'); if(retryBtn) retryBtn.onclick=retry;
  const rs=sim.querySelector('#restartBtn'); if(rs) rs.onclick=restart;
  try{
    var _m=MISSIONS[Math.min(st.idx,MISSIONS.length-1)];
    var _v=values(), _got=pairVal(_m.mode,_v), _set=(_m.mode==='vertical')?_m.target:(180-_m.target);
    var _sl=sim.querySelector('#aSlider'), _ck=sim.querySelector('#checkBtn'), _ok=Math.abs(_got-_m.target)<=_m.tol;
    if(!st.run){ window.__eduRound={native:true,line:(st.msg||'Dock complete!'),voice:(st.msgType==='good'?'Done.':'Try again.'),glow:sim.querySelector('#restartBtn'),submit:sim.querySelector('#restartBtn'),key:'over-'+st.idx}; }
    else if(st.resolved){ window.__eduRound={native:true,line:st.msg,voice:(st.msgType==='good'?'Correct.':'Not quite.'),submit:(sim.querySelector('#nextBtn')||sim.querySelector('#retryBtn')),key:'res-'+st.idx}; }
    else { window.__eduRound={native:true,
      hint:'Set the angle so the '+_m.label.toLowerCase()+' angle is '+_m.target+'°.',hintVoice:'Make the '+_m.label.toLowerCase()+' angle '+_m.target+' degrees.',
      why:(_m.mode==='vertical')?'Vertically opposite angles are equal, so the pair equals the angle you set.':'A linear pair sums to 180°, so the partner is 180 minus the angle you set.',
      detail:'Step 1 - This is a '+_m.label.toLowerCase()+'.\nStep 2 - '+((_m.mode==='vertical')?('Equal angles: set the angle to '+_m.target+'°.'):('Supplementary: set the angle to '+(180-_m.target)+'° so the partner is '+_m.target+'°.'))+'\nStep 3 - Fine-tune within '+_m.tol+'°.\nWhy it works - crossing lines make equal vertical angles and supplementary linear pairs.\nTip - a straight line splits into two angles that add to 180°.',
      line:(_ok?(_m.label+' angle is '+_got.toFixed(0)+'° - tap Check.'):('The '+_m.label.toLowerCase()+' angle is '+_got.toFixed(0)+'° - set the slider to '+_set+'° (target '+_m.target+'°).')),
      voice:'Set it to '+_set+' degrees.',
      glow:(_ok?_ck:_sl),submit:(_ok?_ck:null),key:'m-'+st.idx}; }
  }catch(e){}
}
setup(); render();
</script>
  <script src="edu-coach.js"></script>
</body>
</html>
