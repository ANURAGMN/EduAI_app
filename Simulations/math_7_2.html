<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>Angle Sum Puzzle Wheel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#7c3aed,#4338ca);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}
.header p{font-size:12px;opacity:.92}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#f5f3ff;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#6d28d9;font-weight:700;text-transform:uppercase}
.v{font-size:18px;font-weight:800;color:#111827}
.mission{background:linear-gradient(135deg,#f5f3ff,#ede9fe);border:2px solid #c4b5fd;border-radius:12px;padding:10px;margin-bottom:10px}
.mission p{font-size:12px;color:#4c1d95;line-height:1.45}
.canvas{background:#f8fafc;border:2px solid #cbd5e1;border-radius:12px;padding:6px;margin-top:8px}
svg{width:100%;height:auto;display:block;touch-action:none}
.tuner{margin-top:10px;background:#f8fafc;border:2px solid #cbd5e1;border-radius:10px;padding:8px}
.tuner .lbl{font-size:12px;color:#475569;margin-bottom:6px}
.stepRow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sbtn{padding:8px;border:none;border-radius:8px;background:#ede9fe;color:#4c1d95;font-weight:800;cursor:pointer}
.sbtn:disabled{opacity:.45;cursor:not-allowed}
.range{width:100%;margin-top:8px}
.row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.btn.check{background:#7c3aed;color:#fff}
.btn.next{background:#0ea5e9;color:#fff}
.btn.reset{background:#e2e8f0;color:#334155}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.45}
.msg.good{background:#dcfce7;color:#166534}
.msg.bad{background:#fef2f2;color:#991b1b}
.msg.info{background:#eff6ff;color:#1e3a8a}
.insight{margin-top:12px;background:linear-gradient(135deg,#f5f3ff,#ede9fe);border-left:4px solid #7c3aed;border-radius:12px;padding:12px;font-size:12px;color:#111827;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Angle Sum Puzzle Wheel</h1>
    <p>Drag spokes to satisfy target 180° or 360° sums</p>
  </div>
  <div class="card" id="sim"></div>
  <div class="insight"><b>Geometry:</b> angle around a point totals 360°; adjacent straight-line pair totals 180°.</div>
</div>
<script>
const sim = document.getElementById('sim');
const ROUNDS = [
  {type:'line', target:180, fixedA:65, fixedB:40, variable:'x', goal:75, title:'Straight-line sum'},
  {type:'around', target:360, fixedA:120, fixedB:95, variable:'x', goal:145, title:'Around-point sum'},
  {type:'line', target:180, fixedA:48, fixedB:62, variable:'x', goal:70, title:'Straight-line sum'},
  {type:'around', target:360, fixedA:85, fixedB:130, variable:'x', goal:145, title:'Around-point sum'},
  {type:'line', target:180, fixedA:98, fixedB:32, variable:'x', goal:50, title:'Straight-line sum'},
  {type:'around', target:360, fixedA:140, fixedB:80, variable:'x', goal:140, title:'Around-point sum'}
];

let st = {run:true, idx:0, score:0, lives:3, x:30, resolved:false, msg:'', msgType:'info'};
let drag = {active:false};

function setupRound(){
  st.x = 30;
  st.resolved = false;
  st.msg = '';
  st.msgType = 'info';
}

function current(){ return ROUNDS[Math.min(st.idx, ROUNDS.length-1)]; }
function sumNow(){ const r=current(); return r.fixedA + r.fixedB + st.x; }
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function xBounds(){
  const r=current();
  return r.type==='line' ? {min:1,max:179} : {min:5,max:300};
}
function setX(v){
  const b=xBounds();
  st.x=clamp(Math.round(v),b.min,b.max);
}
function nudgeX(step){
  if(!st.run||st.resolved) return;
  setX(st.x+step);
  render();
}
function slideX(v){
  if(!st.run||st.resolved) return;
  setX(parseInt(v,10));
  render();
}

function updateFromDrag(clientX, clientY){
  if(!drag.active || st.resolved || !st.run) return;
  const svg = sim.querySelector('#wheelSvg');
  if(!svg) return;
  const rect = svg.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  const ang = Math.atan2(clientY-cy, clientX-cx) * 180/Math.PI;
  const theta = (ang + 360) % 360;
  const r = current();

  if(r.type === 'line'){
    setX(theta);
  } else {
    setX(theta);
  }
  render();
}

function check(){
  if(!st.run || st.resolved) return;
  const r = current();
  st.resolved = true;
  if(st.x === r.goal){
    st.score += 12;
    st.msg = `Perfect lock! x = ${r.goal}°`;
    st.msgType = 'good';
  } else {
    st.lives -= 1;
    st.msg = `Not exact. Need x = ${r.goal}°`;
    st.msgType = 'bad';
    if(st.lives<=0) st.run=false;
  }
  render();
}

function next(){
  if(!st.resolved) return;
  st.idx++;
  if(st.idx >= ROUNDS.length){
    st.run = false;
    st.msg = 'Puzzle wheel complete!';
    st.msgType = 'good';
    render();
    return;
  }
  setupRound();
  render();
}

function resetDrag(){
  if(!st.run || st.resolved) return;
  setX(30);
  render();
}

function restart(){
  st = {run:true, idx:0, score:0, lives:3, x:30, resolved:false, msg:'', msgType:'info'};
  setupRound();
  render();
}

function render(){
  const done = !st.run;
  const r = current();
  const b = xBounds();
  const total = sumNow();
  const remaining = r.target - (r.fixedA + r.fixedB);
  const valid = total === r.target;

  const arcA = r.fixedA, arcB = r.fixedB, arcX = st.x;
  const endA = arcA;
  const endB = arcA + arcB;
  const endX = arcA + arcB + arcX;

  sim.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="k">Round</div><div class="v">${Math.min(st.idx+1,ROUNDS.length)}/${ROUNDS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Target</div><div class="v">${r.target}°</div></div>
    </div>

    <div class="mission">
      <p><b>${r.title}:</b> fixed sectors are A=${r.fixedA}°, B=${r.fixedB}°. Drag the magenta spoke to set x so total becomes ${r.target}°.</p>
      <p>Current total: <b>${total}°</b> | Required x: <b>${remaining}°</b> | Your x: <b>${st.x}°</b></p>
      <div class="canvas">
        <svg id="wheelSvg" viewBox="0 0 320 260">
          <g transform="translate(160,130)">
            <circle cx="0" cy="0" r="92" fill="#fff"/>
            <path d="${sectorPath(0,endA,92)}" fill="rgba(59,130,246,.22)" stroke="#2563eb" stroke-width="2"></path>
            <path d="${sectorPath(endA,endB,92)}" fill="rgba(16,185,129,.22)" stroke="#059669" stroke-width="2"></path>
            <path d="${sectorPath(endB,endX,92)}" fill="rgba(236,72,153,.22)" stroke="#be185d" stroke-width="2"></path>

            <line x1="0" y1="0" x2="${pt(endA,92).x}" y2="${pt(endA,92).y}" stroke="#2563eb" stroke-width="3"/>
            <line x1="0" y1="0" x2="${pt(endB,92).x}" y2="${pt(endB,92).y}" stroke="#059669" stroke-width="3"/>
            <line id="dragSpoke" x1="0" y1="0" x2="${pt(endX,92).x}" y2="${pt(endX,92).y}" stroke="#be185d" stroke-width="4"/>
            <circle id="dragHandle" cx="${pt(endX,92).x}" cy="${pt(endX,92).y}" r="10" fill="#be185d" stroke="#fff" stroke-width="3"/>

            <text x="${pt(endA/2,60).x}" y="${pt(endA/2,60).y}" font-size="12" fill="#1e3a8a" font-weight="700">${r.fixedA}°</text>
            <text x="${pt(endA+arcB/2,60).x}" y="${pt(endA+arcB/2,60).y}" font-size="12" fill="#065f46" font-weight="700">${r.fixedB}°</text>
            <text x="${pt(endB+arcX/2,60).x}" y="${pt(endB+arcX/2,60).y}" font-size="12" fill="#9d174d" font-weight="700">${st.x}°</text>

            <circle cx="0" cy="0" r="5" fill="#111827"/>
          </g>
        </svg>
      </div>
      <div class="tuner">
        <div class="lbl">Precision controls for x (drag still works)</div>
        <div class="stepRow">
          <button class="sbtn" id="xMinus5" ${done||st.resolved?'disabled':''}>-5</button>
          <button class="sbtn" id="xMinus1" ${done||st.resolved?'disabled':''}>-1</button>
          <button class="sbtn" id="xPlus1" ${done||st.resolved?'disabled':''}>+1</button>
          <button class="sbtn" id="xPlus5" ${done||st.resolved?'disabled':''}>+5</button>
        </div>
        <input id="xRange" class="range" type="range" min="${b.min}" max="${b.max}" value="${st.x}" ${done||st.resolved?'disabled':''}>
      </div>
    </div>

    <div class="row">
      ${done
        ? `<button class="btn next" id="restartBtn">Restart</button>`
        : (st.resolved
          ? `<button class="btn next" id="nextBtn">${st.idx===ROUNDS.length-1?'Finish':'Next Round'}</button>`
          : `<button class="btn reset" id="resetBtn">Reset x</button><button class="btn check" id="checkBtn">Check Sum</button>`)}
    </div>

    ${st.msg
      ? `<div class="msg ${st.msgType}">${st.msg}</div>`
      : `<div class="msg info">${valid?'Sum target hit. Press Check.':'Drag handle to tune x and hit target sum.'}</div>`}
  `;

  const handle = sim.querySelector('#dragHandle');
  if(handle && !st.resolved && !done){
    const startDrag = (e)=>{
      drag.active = true;
      const t = e.touches ? e.touches[0] : e;
      updateFromDrag(t.clientX, t.clientY);
      if(e.cancelable) e.preventDefault();
    };
    handle.addEventListener('mousedown', startDrag);
    handle.addEventListener('touchstart', startDrag, {passive:false});
  }

  const move = (e)=>{
    if(!drag.active) return;
    const t = e.touches ? e.touches[0] : e;
    updateFromDrag(t.clientX, t.clientY);
    if(e.cancelable) e.preventDefault();
  };
  const stop = ()=>{ drag.active=false; };
  window.onmousemove = move;
  window.onmouseup = stop;
  window.ontouchmove = move;
  window.ontouchend = stop;

  const ck = sim.querySelector('#checkBtn'); if(ck) ck.onclick = check;
  const nx = sim.querySelector('#nextBtn'); if(nx) nx.onclick = next;
  const rs = sim.querySelector('#resetBtn'); if(rs) rs.onclick = resetDrag;
  const rr = sim.querySelector('#restartBtn'); if(rr) rr.onclick = restart;
  try{
    var _r=current(), _goal=_r.goal, _d=_goal-st.x;
    var _sl=sim.querySelector('#xRange'), _ck=sim.querySelector('#checkBtn'), _ok=(st.x===_goal);
    if(!st.run){ window.__eduRound={native:true,line:(st.msg||'Puzzle complete!'),voice:(st.msgType==='good'?'Done.':'Try again.'),glow:sim.querySelector('#restartBtn'),submit:sim.querySelector('#restartBtn'),key:'over-'+st.idx}; }
    else if(st.resolved){ window.__eduRound={native:true,line:st.msg,voice:(st.msgType==='good'?'Correct.':'Not quite.'),submit:(sim.querySelector('#nextBtn')||sim.querySelector('#retryBtn')),key:'res-'+st.idx}; }
    else { window.__eduRound={native:true,
      hint:_r.fixedA+'° + '+_r.fixedB+'° + x = '+_r.target+'°. What is x?',hintVoice:'What is x?',
      why:'Angles on a straight line sum to 180°; angles around a point sum to 360°. Subtract the known angles.',
      detail:'Step 1 - The total is '+_r.target+'° ('+(_r.type==='line'?'straight line':'around a point')+').\nStep 2 - x = '+_r.target+' - '+_r.fixedA+' - '+_r.fixedB+' = '+_goal+'.\nStep 3 - Set x to exactly '+_goal+'°, then Check.\nWhy it works - the known angles plus x fill the whole '+(_r.type==='line'?'line':'turn')+'.\nTip - this needs the exact integer, so use +/-1 to land on it.',
      line:(_ok?('x = '+_goal+'° - tap Check.'):('x = '+st.x+'°, need '+_goal+'° - '+(_d>0?'add ':'subtract ')+Math.abs(_d)+'.')),
      voice:'x is '+_goal+' degrees.',
      glow:(_ok?_ck:_sl),submit:(_ok?_ck:null),key:'r-'+st.idx}; }
  }catch(e){}
  const xM5 = sim.querySelector('#xMinus5'); if(xM5) xM5.onclick=()=>nudgeX(-5);
  const xM1 = sim.querySelector('#xMinus1'); if(xM1) xM1.onclick=()=>nudgeX(-1);
  const xP1 = sim.querySelector('#xPlus1'); if(xP1) xP1.onclick=()=>nudgeX(1);
  const xP5 = sim.querySelector('#xPlus5'); if(xP5) xP5.onclick=()=>nudgeX(5);
  const xr = sim.querySelector('#xRange'); if(xr) xr.oninput=(e)=>slideX(e.target.value);
}

function pt(deg, r){
  const rad = deg * Math.PI / 180;
  return {x: Math.cos(rad)*r, y: Math.sin(rad)*r};
}

function sectorPath(startDeg, endDeg, r){
  const s = pt(startDeg, r), e = pt(endDeg, r);
  const large = (endDeg-startDeg) > 180 ? 1 : 0;
  return `M 0 0 L ${s.x} ${s.y} A ${r} ${r} 0 ${large} 1 ${e.x} ${e.y} Z`;
}

setupRound();
render();
</script>
  <script src="edu-coach.js"></script>
</body>
</html>
