<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#be123c">
<title>Equivalence Counterexample Hunt</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#be123c,#7c2d12);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}
.header p{font-size:12px;opacity:.92}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#fff1f2;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#9f1239;font-weight:700;text-transform:uppercase}
.v{font-size:18px;font-weight:800;color:#111827}
.mission{background:linear-gradient(135deg,#fff1f2,#ffe4e6);border:2px solid #fda4af;border-radius:12px;padding:10px;margin-bottom:10px}
.expr{font-family:'Courier New',monospace;font-size:18px;font-weight:900;color:#7f1d1d;text-align:center;margin-top:6px}
.probe{background:#f8fafc;border-radius:10px;padding:10px}
.probe p{font-size:12px;color:#334155}
.probe input{width:100%;margin-top:7px;padding:9px;border:2px solid #cbd5e1;border-radius:8px;font-weight:800}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.choice{padding:10px;border:2px solid #d1d5db;border-radius:10px;background:#fff;cursor:pointer;font-weight:800}
.choice.sel{border-color:#be123c;background:#ffe4e6;color:#9f1239}
.choice.ok{border-color:#16a34a;background:#dcfce7;color:#166534}
.choice.bad{border-color:#dc2626;background:#fef2f2;color:#991b1b}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.btn.check{background:#be123c;color:#fff}
.btn.next{background:#0ea5e9;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.45}
.msg.good{background:#dcfce7;color:#166534}
.msg.bad{background:#fef2f2;color:#991b1b}
.msg.info{background:#eff6ff;color:#1e3a8a}
.insight{margin-top:12px;background:linear-gradient(135deg,#fff1f2,#ffe4e6);border-left:4px solid #be123c;border-radius:12px;padding:12px;font-size:12px;color:#111827;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Equivalence Counterexample Hunt</h1>
    <p>Find whether expressions are always equal or break at some x</p>
  </div>
  <div class="card" id="sim"></div>
  <div class="insight"><b>Concept:</b> one counterexample is enough to prove two expressions are not always equal.</div>
</div>
<script>
const sim = document.getElementById('sim');
const CASES = [
  {L:'5u', R:'5+u', lv:x=>5*x, rv:x=>5+x, ans:'not_always'},
  {L:'10y-3', R:'10(y-3)', lv:x=>10*x-3, rv:x=>10*(x-3), ans:'not_always'},
  {L:'2(x+4)', R:'2x+8', lv:x=>2*(x+4), rv:x=>2*x+8, ans:'always'},
  {L:'x+x+1', R:'2x+1', lv:x=>x+x+1, rv:x=>2*x+1, ans:'always'},
  {L:'3a+2b', R:'5ab', lv:x=>3*x+2*x, rv:x=>5*x*x, ans:'not_always'},
  {L:'7(p+1)', R:'7p+7', lv:x=>7*(x+1), rv:x=>7*x+7, ans:'always'}
];

let st={run:true,idx:0,score:0,lives:3,x:2,pick:'',resolved:false,msg:'',msgType:'info'};
function choose(v){ if(!st.run||st.resolved) return; st.pick=v; render(); }
function check(){
  if(!st.run||st.resolved||!st.pick) return;
  const c=CASES[st.idx];
  st.resolved=true;
  if(st.pick===c.ans){ st.score+=12; st.msg='Correct classification.'; st.msgType='good'; }
  else { st.lives--; st.msg='Not correct for this pair.'; st.msgType='bad'; if(st.lives<=0) st.run=false; }
  render();
}
function next(){
  if(!st.resolved) return;
  st.idx++;
  if(st.idx>=CASES.length){ st.run=false; st.msg='Hunt complete!'; st.msgType='good'; render(); return; }
  st.x=2; st.pick=''; st.resolved=false; st.msg=''; st.msgType='info'; render();
}
function restart(){ st={run:true,idx:0,score:0,lives:3,x:2,pick:'',resolved:false,msg:'',msgType:'info'}; render(); }

function render(){
  const done=!st.run;
  const c=CASES[Math.min(st.idx,CASES.length-1)];
  const l=c.lv(st.x), r=c.rv(st.x);
  sim.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="k">Case</div><div class="v">${Math.min(st.idx+1,CASES.length)}/${CASES.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Probe x</div><div class="v">${st.x}</div></div>
    </div>
    <div class="mission">
      <div class="expr">${c.L}</div>
      <div class="expr">vs</div>
      <div class="expr">${c.R}</div>
    </div>
    <div class="probe">
      <p>Try probe value x to test quickly (not final proof).</p>
      <input id="xIn" type="number" min="-20" max="20" step="1" value="${st.x}" ${st.resolved||done?'disabled':''}>
      <p style="margin-top:6px">At x=${st.x}: left=${l}, right=${r}</p>
    </div>
    <div class="choices">
      ${[
        {k:'always',t:'Always equal'},
        {k:'not_always',t:'Not always equal'}
      ].map(o=>{
        const cls=st.resolved?(o.k===c.ans?'ok':(o.k===st.pick?'bad':'')):(o.k===st.pick?'sel':'');
        return `<button class="choice ${cls}" data-k="${o.k}">${o.t}</button>`;
      }).join('')}
    </div>
    <div class="actions">
      ${done?`<button class="btn next" id="restartBtn">Restart</button>`:(st.resolved?`<button class="btn next" id="nextBtn">${st.idx===CASES.length-1?'Finish':'Next Case'}</button>`:`<button class="btn check" id="checkBtn">Lock Classification</button>`)}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Select one option, then lock.</div>`}
  `;
  const x=sim.querySelector('#xIn'); if(x) x.oninput=()=>{ st.x=parseInt(x.value||'0',10); render(); };
  sim.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(b.dataset.k));
  const cbtn=sim.querySelector('#checkBtn'); if(cbtn) cbtn.onclick=check;
  const nbtn=sim.querySelector('#nextBtn'); if(nbtn) nbtn.onclick=next;
  const rbtn=sim.querySelector('#restartBtn'); if(rbtn) rbtn.onclick=restart;
  var _c=CASES[Math.min(st.idx,CASES.length-1)];
  var _ansEl=[].slice.call(sim.querySelectorAll('.choice')).find(function(b){return b.dataset.k===_c.ans;});
  if(!st.run){ window.__eduRound={native:true,line:(st.idx>=CASES.length?(st.msg||'Hunt complete!'):st.msg),voice:'Round over.',submit:sim.querySelector('#restartBtn'),key:'done-'+st.idx+'-'+(st.msg||'')}; }
  else if(st.resolved){ window.__eduRound={native:true,line:st.msg,voice:(st.msgType==='good'?'Correct.':'Not correct.'),submit:sim.querySelector('#nextBtn'),key:'res-'+st.idx}; }
  else { window.__eduRound={native:true,
    hint:'Is '+_c.L+' the same as '+_c.R+' for every value? Try a test x.',hintVoice:'Are they equal for every value?',
    why:'Substitute a value into both sides. If they ever differ they are not always equal; if they match for every x they are always equal.',
    detail:'Step 1 - Put your test x into both '+_c.L+' and '+_c.R+'.\nStep 2 - Compare the two results (and try another x).\nStep 3 - '+(_c.ans==='always'?'They match for every x, so tap Always equal.':'They differ for some x, so tap Not always equal.')+'\nWhy it works - equivalence must hold for all values; one counterexample breaks it.\nTip - distribute correctly: 2(x+4) = 2x+8 always, but 10(y-3) is not 10y-3.',
    line:(_c.ans==='always'?_c.L+' and '+_c.R+' are always equal.':_c.L+' and '+_c.R+' are NOT always equal.'),
    voice:(_c.ans==='always'?'Always equal.':'Not always equal.'),
    glow:_ansEl,submit:(st.pick?sim.querySelector('#checkBtn'):null),key:'c-'+st.idx}; }
}
render();
</script>
  <script src="edu-coach.js"></script>
</body>
</html>
