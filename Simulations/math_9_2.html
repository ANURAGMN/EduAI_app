<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0ea5e9">
<title>Data Organization Command Center</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#0ea5e9,#0284c7);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}
.header p{font-size:12px;opacity:.9}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#ecfeff;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#0f766e;font-weight:700;text-transform:uppercase}
.v{font-size:18px;font-weight:800;color:#0f172a}
.mission{background:linear-gradient(135deg,#ecfeff,#e0f2fe);border:2px solid #67e8f9;border-radius:12px;padding:10px;margin-bottom:10px}
.mission p{font-size:12px;color:#0c4a6e;line-height:1.45}
.tokens{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.tok{padding:8px 10px;border:2px solid #d1d5db;border-radius:10px;background:#fff;cursor:pointer;font-weight:800}
.tok.used{opacity:.35;cursor:not-allowed}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.bin{background:#f8fafc;border:2px dashed #cbd5e1;border-radius:10px;padding:8px;min-height:60px}
.bin h4{font-size:11px;color:#475569}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{padding:6px 8px;border-radius:8px;background:#e0f2fe;color:#0c4a6e;font-weight:700;font-size:12px}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.btn.reset{background:#e2e8f0;color:#334155}
.btn.check{background:#0284c7;color:#fff}
.btn.next{background:#0f766e;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.45}
.msg.good{background:#dcfce7;color:#166534}
.msg.bad{background:#fef2f2;color:#991b1b}
.msg.info{background:#eff6ff;color:#1e3a8a}
.insight{margin-top:12px;background:linear-gradient(135deg,#ecfeff,#e0f2fe);border-left:4px solid #0ea5e9;border-radius:12px;padding:12px;font-size:12px;color:#111827;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Data Organization Command Center</h1>
    <p>Sort raw observations into grouped frequency bins</p>
  </div>
  <div class="card" id="sim"></div>
  <div class="insight"><b>Chapter 9 start pack:</b> data handling begins with organizing raw data into categories and counting frequency.</div>
</div>
<script>
const sim = document.getElementById('sim');
const ROUNDS = [
  {raw:[1,2,1,3,2,1,4,2], bins:['1','2','3','4'], freq:{'1':3,'2':3,'3':1,'4':1}},
  {raw:[5,6,5,7,6,6,5,8], bins:['5','6','7','8'], freq:{'5':3,'6':3,'7':1,'8':1}},
  {raw:[2,2,3,3,3,4,4,5], bins:['2','3','4','5'], freq:{'2':2,'3':3,'4':2,'5':1}},
  {raw:[9,8,9,7,8,9,7,7], bins:['7','8','9'], freq:{'7':3,'8':2,'9':3}},
  {raw:[1,1,1,2,2,3,4,4], bins:['1','2','3','4'], freq:{'1':3,'2':2,'3':1,'4':2}},
  {raw:[6,6,6,5,5,4,4,4], bins:['4','5','6'], freq:{'4':3,'5':2,'6':3}}
];

let st={run:true,idx:0,score:0,lives:3,placed:{},used:new Set(),resolved:false,msg:'',msgType:'info'};

function setup(){
  st.placed={};
  st.used=new Set();
  st.resolved=false;
  st.msg='';
  st.msgType='info';
}

function addVal(i, bin){
  if(!st.run||st.resolved||st.used.has(i)) return;
  if(!st.placed[bin]) st.placed[bin]=[];
  st.placed[bin].push(i);
  st.used.add(i);
  render();
}

function resetRound(){ if(!st.run||st.resolved) return; setup(); render(); }

function check(){
  if(!st.run||st.resolved) return;
  const r=ROUNDS[st.idx];
  if(st.used.size!==r.raw.length){ st.msg='Classify all values first.'; st.msgType='info'; render(); return; }
  st.resolved=true;
  let ok=true;
  for(const b of r.bins){
    const got=(st.placed[b]||[]).map(i=>r.raw[i]).length;
    if(got!==r.freq[b]) ok=false;
  }
  if(ok){ st.score+=12; st.msg='Correct frequency organization!'; st.msgType='good'; }
  else { st.lives--; st.msg='Frequency mismatch in one or more bins.'; st.msgType='bad'; if(st.lives<=0) st.run=false; }
  render();
}

function next(){
  if(!st.resolved) return;
  st.idx++;
  if(st.idx>=ROUNDS.length){ st.run=false; st.msg='Command run complete!'; st.msgType='good'; render(); return; }
  setup(); render();
}

function restart(){ st={run:true,idx:0,score:0,lives:3,placed:{},used:new Set(),resolved:false,msg:'',msgType:'info'}; setup(); render(); }

function render(){
  const done=!st.run;
  const r=ROUNDS[Math.min(st.idx,ROUNDS.length-1)];
  sim.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="k">Round</div><div class="v">${Math.min(st.idx+1,ROUNDS.length)}/${ROUNDS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Placed</div><div class="v">${st.used.size}/${r.raw.length}</div></div>
    </div>
    <div class="mission">
      <p>Sort each observation into the correct category bin, then verify frequencies.</p>
    </div>
    <div class="tokens">
      ${r.raw.map((v,i)=>`<button class="tok ${st.used.has(i)?'used':''}" data-i="${i}" ${st.used.has(i)||st.resolved||done?'disabled':''}>${v}</button>`).join('')}
    </div>
    <div class="bins">
      ${r.bins.map(b=>`
        <div class="bin">
          <h4>Bin ${b} (target freq ${r.freq[b]})</h4>
          <div class="chips">${(st.placed[b]||[]).map(i=>`<span class="chip">${r.raw[i]}</span>`).join('')||'<span class="chip">empty</span>'}</div>
          ${!done&&!st.resolved?`<div class="actions" style="margin-top:8px"><button class="btn check" data-bin="${b}">Add Selected</button></div>`:''}
        </div>
      `).join('')}
    </div>
    <div class="actions">
      ${done?`<button class="btn next" id="restartBtn">Restart</button>`:(st.resolved?`<button class="btn next" id="nextBtn">${st.idx===ROUNDS.length-1?'Finish':'Next Round'}</button>`:`<button class="btn reset" id="resetBtn">Reset</button><button class="btn check" id="checkBtn">Check Frequency</button>`)}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Tap a value then tap its bin button.</div>`}
  `;
  let selected=-1;
  sim.querySelectorAll('.tok').forEach(b=>b.onclick=()=>{selected=parseInt(b.dataset.i,10);});
  sim.querySelectorAll('[data-bin]').forEach(b=>b.onclick=()=>{ if(selected!==-1) addVal(selected,b.dataset.bin); });
  const rs=sim.querySelector('#resetBtn'); if(rs) rs.onclick=resetRound;
  const c=sim.querySelector('#checkBtn'); if(c) c.onclick=check;
  const n=sim.querySelector('#nextBtn'); if(n) n.onclick=next;
  const rbtn=sim.querySelector('#restartBtn'); if(rbtn) rbtn.onclick=restart;
}
setup();
render();
</script>
</body>
</html>
