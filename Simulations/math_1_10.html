<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Population Growth Factor Radar</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#0f766e,#2563eb);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}
.header p{font-size:12px;opacity:.9}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#ecfeff;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#0f766e;font-weight:700;text-transform:uppercase}
.v{font-size:18px;font-weight:800;color:#111827}
.mission{background:linear-gradient(135deg,#ecfeff,#dbeafe);border:2px solid #7dd3fc;border-radius:12px;padding:10px;margin-bottom:10px}
.mission h3{font-size:14px;color:#134e4a}
.mission p{font-size:12px;color:#0f766e;line-height:1.45}
.vals{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.box{background:#f8fafc;border:2px solid #cbd5e1;border-radius:10px;padding:8px;text-align:center}
.box .l{font-size:11px;color:#475569}
.box .n{font-size:18px;font-family:'Courier New',monospace;font-weight:900;color:#0f172a}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{padding:10px;border:2px solid #d1d5db;border-radius:10px;background:#fff;cursor:pointer;font-weight:800}
.opt.sel{border-color:#2563eb;background:#dbeafe;color:#1d4ed8}
.opt.ok{border-color:#16a34a;background:#dcfce7;color:#166534}
.opt.bad{border-color:#dc2626;background:#fef2f2;color:#991b1b}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.btn.check{background:#0f766e;color:#fff}
.btn.next{background:#0284c7;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.45}
.msg.good{background:#dcfce7;color:#166534}
.msg.bad{background:#fef2f2;color:#991b1b}
.msg.info{background:#eff6ff;color:#1e3a8a}
.insight{margin-top:12px;background:linear-gradient(135deg,#ecfeff,#dbeafe);border-left:4px solid #0f766e;border-radius:12px;padding:12px;font-size:12px;color:#0f172a;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Population Growth Factor Radar</h1>
    <p>Estimate how many times one city fits into another</p>
  </div>
  <div class="card" id="sim"></div>
  <div class="insight"><b>Concept:</b> compare large populations by ratio (about x times), not only difference.</div>
</div>
<script>
const sim = document.getElementById('sim');

const ROUNDS = [
  {big:"Mumbai", bigPop:12442373, small:"Patna", smallPop:1684222, ans:"7.4x"},
  {big:"Bengaluru", bigPop:8443675, small:"Mysuru", smallPop:887446, ans:"9.5x"},
  {big:"Delhi", bigPop:11007835, small:"Chandigarh", smallPop:960787, ans:"11.5x"},
  {big:"Hyderabad", bigPop:6809970, small:"Vijayawada", smallPop:1048240, ans:"6.5x"},
  {big:"Kolkata", bigPop:4496694, small:"Siliguri", smallPop:513264, ans:"8.8x"},
  {big:"Chennai", bigPop:4646732, small:"Coimbatore", smallPop:1050721, ans:"4.4x"}
];

let st={run:true,idx:0,score:0,lives:3,pick:"",resolved:false,msg:"",msgType:"info"};
function fmt(n){return n.toLocaleString("en-IN");}
function choices(a){
  const x=parseFloat(a);
  return [`${(x-1.0).toFixed(1)}x`,`${(x-0.3).toFixed(1)}x`,a,`${(x+0.8).toFixed(1)}x`];
}
function choose(v){ if(!st.run||st.resolved) return; st.pick=v; render(); }
function check(){
  if(!st.run||st.resolved||!st.pick) return;
  const r=ROUNDS[st.idx];
  st.resolved=true;
  if(st.pick===r.ans){ st.score+=12; st.msg="Correct growth factor estimate."; st.msgType="good"; }
  else { st.lives--; st.msg=`Best estimate is ${r.ans}.`; st.msgType="bad"; if(st.lives<=0) st.run=false; }
  render();
}
function next(){
  if(!st.resolved) return;
  st.idx++;
  if(st.idx>=ROUNDS.length){ st.run=false; st.msg="Radar run complete!"; st.msgType="good"; render(); return; }
  st.pick=""; st.resolved=false; st.msg=""; st.msgType="info"; render();
}
function restart(){ st={run:true,idx:0,score:0,lives:3,pick:"",resolved:false,msg:"",msgType:"info"}; render(); }

function render(){
  const done=!st.run;
  const r=ROUNDS[Math.min(st.idx,ROUNDS.length-1)];
  const opts=choices(r.ans);
  sim.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="k">Round</div><div class="v">${Math.min(st.idx+1,ROUNDS.length)}/${ROUNDS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Mode</div><div class="v">Ratio</div></div>
    </div>
    <div class="mission">
      <h3>${r.big} vs ${r.small}</h3>
      <p>How many times is ${r.big} population approximately ${r.small} population?</p>
      <div class="vals">
        <div class="box"><div class="l">${r.big}</div><div class="n">${fmt(r.bigPop)}</div></div>
        <div class="box"><div class="l">${r.small}</div><div class="n">${fmt(r.smallPop)}</div></div>
      </div>
    </div>
    <div class="opts">
      ${opts.map(v=>{
        const cls=st.resolved?(v===r.ans?'ok':(v===st.pick?'bad':'')):(v===st.pick?'sel':'');
        return `<button class="opt ${cls}" data-v="${v}">${v}</button>`;
      }).join("")}
    </div>
    <div class="actions">
      ${done?`<button class="btn next" id="restartBtn">Restart</button>`:(st.resolved?`<button class="btn next" id="nextBtn">${st.idx===ROUNDS.length-1?'Finish':'Next'}</button>`:`<button class="btn check" id="checkBtn">Check Factor</button>`)}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Selected: <b>${st.pick||'-'}</b></div>`}
  `;
  sim.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(b.dataset.v));
  const c=sim.querySelector('#checkBtn'); if(c) c.onclick=check;
  const n=sim.querySelector('#nextBtn'); if(n) n.onclick=next;
  const rbtn=sim.querySelector('#restartBtn'); if(rbtn) rbtn.onclick=restart;
}
render();
</script>
</body>
</html>
