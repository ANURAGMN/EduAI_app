<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0284c7">
<title>Decimal Borrow Bridge</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#0284c7,#0ea5e9);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}
.header p{font-size:12px;opacity:.92}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#ecfeff;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#0f766e;font-weight:700;text-transform:uppercase}
.v{font-size:18px;font-weight:800;color:#111827}
.mission{background:linear-gradient(135deg,#ecfeff,#e0f2fe);border:2px solid #67e8f9;border-radius:12px;padding:10px;margin-bottom:10px}
.mission h3{font-size:14px;color:#155e75}
.expr{font-family:'Courier New',monospace;font-size:26px;font-weight:900;color:#0c4a6e;text-align:center;margin-top:6px}
.entry{background:#f8fafc;border-radius:10px;padding:10px;margin-top:10px}
.entry input{width:100%;margin-top:6px;padding:10px;border:2px solid #cbd5e1;border-radius:8px;font-size:16px;font-weight:800}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.step{padding:10px;border:none;border-radius:10px;background:#e0f2fe;color:#0c4a6e;font-weight:800;cursor:pointer}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.btn.check{background:#0284c7;color:#fff}
.btn.next{background:#0f766e;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.45}
.msg.good{background:#dcfce7;color:#166534}
.msg.bad{background:#fef2f2;color:#991b1b}
.msg.info{background:#eff6ff;color:#1e3a8a}
.insight{margin-top:12px;background:linear-gradient(135deg,#ecfeff,#e0f2fe);border-left:4px solid #0284c7;border-radius:12px;padding:12px;font-size:12px;color:#0f172a;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Decimal Borrow Bridge</h1>
    <p>Cross subtraction gaps using decimal borrowing correctly</p>
  </div>
  <div class="card" id="sim"></div>
  <div class="insight"><b>Concept:</b> when decimal part is smaller, borrow 1 from whole number (or left place) and continue subtraction.</div>
</div>
<script>
const sim = document.getElementById('sim');
const ROUNDS = [
  {a:12.4,b:6.7,ans:5.7,h:'Borrow 1 unit -> 11.14 tenths style'},
  {a:8.03,b:2.19,ans:5.84,h:'Borrow across decimal places'},
  {a:20.0,b:13.8,ans:6.2,h:'Convert 20.0 to 19.10 tenths mentally'},
  {a:17.00,b:16.198,ans:0.802,h:'Borrow through zeros carefully'},
  {a:5.6,b:2.3,ans:3.3,h:'Direct subtraction without borrow also appears'},
  {a:9.1,b:4.95,ans:4.15,h:'Tenths < hundredths case needs borrow'}
];

let st={run:true,idx:0,score:0,lives:3,ans:'',resolved:false,msg:'',msgType:'info'};
function fmt(v){ return Number(v).toFixed(3).replace(/\.?0+$/,''); }
function setup(){ st.ans=''; st.resolved=false; st.msg=''; st.msgType='info'; }
function nudge(d){ if(!st.run||st.resolved) return; const cur=parseFloat(st.ans||'0'); st.ans=String(Number((cur+d).toFixed(3))); render(); }
function check(){
  if(!st.run||st.resolved) return;
  const r=ROUNDS[st.idx]; const got=parseFloat(st.ans);
  if(!Number.isFinite(got)){ st.msg='Enter a valid answer.'; st.msgType='info'; render(); return; }
  st.resolved=true;
  if(Math.abs(got-r.ans)<1e-9){ st.score+=12; st.msg='Correct bridge crossing!'; st.msgType='good'; }
  else { st.lives--; st.msg=`Correct value is ${fmt(r.ans)}. Hint: ${r.h}`; st.msgType='bad'; if(st.lives<=0) st.run=false; }
  render();
}
function next(){
  if(!st.resolved) return;
  st.idx++;
  if(st.idx>=ROUNDS.length){ st.run=false; st.msg='Bridge run complete!'; st.msgType='good'; render(); return; }
  setup(); render();
}
function restart(){ st={run:true,idx:0,score:0,lives:3,ans:'',resolved:false,msg:'',msgType:'info'}; setup(); render(); }

function render(){
  const done=!st.run;
  const r=ROUNDS[Math.min(st.idx,ROUNDS.length-1)];
  sim.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="k">Round</div><div class="v">${Math.min(st.idx+1,ROUNDS.length)}/${ROUNDS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Hint</div><div class="v" style="font-size:11px">Borrow</div></div>
    </div>
    <div class="mission">
      <h3>Subtract decimals</h3>
      <div class="expr">${fmt(r.a)} - ${fmt(r.b)}</div>
      <div style="font-size:12px;color:#155e75;text-align:center;margin-top:4px">${r.h}</div>
    </div>
    <div class="entry">
      <div style="font-size:12px;color:#334155">Your answer</div>
      <input id="ansIn" type="number" step="0.001" value="${st.ans}" placeholder="Type decimal result">
      <div class="steps">
        <button class="step" id="m01">-0.1</button>
        <button class="step" id="p01">+0.1</button>
        <button class="step" id="p001">+0.01</button>
      </div>
    </div>
    <div class="actions">
      ${done?`<button class="btn next" id="restartBtn">Restart</button>`:(st.resolved?`<button class="btn next" id="nextBtn">${st.idx===ROUNDS.length-1?'Finish':'Next Round'}</button>`:`<button class="btn check" id="checkBtn">Check Subtraction</button>`)}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Align decimal places before borrowing.</div>`}
  `;
  const a=sim.querySelector('#ansIn'); if(a){ a.oninput=()=>{st.ans=a.value;}; a.disabled=st.resolved||done; }
  const m01=sim.querySelector('#m01'); if(m01) m01.onclick=()=>nudge(-0.1);
  const p01=sim.querySelector('#p01'); if(p01) p01.onclick=()=>nudge(0.1);
  const p001=sim.querySelector('#p001'); if(p001) p001.onclick=()=>nudge(0.01);
  const c=sim.querySelector('#checkBtn'); if(c) c.onclick=check;
  const n=sim.querySelector('#nextBtn'); if(n) n.onclick=next;
  const rr=sim.querySelector('#restartBtn'); if(rr) rr.onclick=restart;
  // --- V5 coach: align decimal points, subtract with borrowing ---
  if(done){
    window.__eduRound={native:true,line:(st.idx>=ROUNDS.length?(st.msg||'Bridge run complete!'):st.msg),voice:'Round over.',submit:sim.querySelector('#restartBtn'),key:'done-'+st.idx+'-'+(st.msg||'')};
  } else if(st.resolved){
    window.__eduRound={native:true,line:st.msg,voice:(st.msgType==='good'?'Correct.':'Not correct.'),submit:sim.querySelector('#nextBtn'),key:'res-'+st.idx};
  } else {
    window.__eduRound={native:true,
      hint:'Subtract '+fmt(r.a)+' − '+fmt(r.b)+'. Line up the decimal points and borrow where needed.',
      hintVoice:'What is the difference?',
      why:'Write both numbers with the same number of decimal places, line up the points, then subtract column by column — borrowing 1 from the next place (worth 10) when the top digit is smaller.',
      detail:'Step 1 — Write '+fmt(r.a)+' and '+fmt(r.b)+' with points aligned, padding with zeros.\nStep 2 — '+r.h+'\nStep 3 — Subtract column by column to get '+fmt(r.ans)+'.\nWhy it works — borrowing moves 1 unit from the next-higher place, which is worth 10 of the current place.\nTip — pad '+fmt(r.a)+' with zeros so it has as many decimals as '+fmt(r.b)+' before subtracting.',
      line:fmt(r.a)+' − '+fmt(r.b)+' = '+fmt(r.ans)+'.',
      voice:'The answer is '+fmt(r.ans),
      input:sim.querySelector('#ansIn'), inputHint:fmt(r.ans),
      submit:(st.ans!==''?sim.querySelector('#checkBtn'):null),
      key:'r-'+st.idx};
  }
}
setup();
render();
</script>
  <script src="edu-coach.js"></script>
</body>
</html>
