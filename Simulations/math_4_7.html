<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4338ca">
<title>Pattern Rule Lockpick</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#4338ca,#7c3aed);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}
.header p{font-size:12px;opacity:.9}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#eef2ff;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#4338ca;font-weight:700;text-transform:uppercase}
.v{font-size:18px;font-weight:800;color:#111827}
.mission{background:linear-gradient(135deg,#eef2ff,#ede9fe);border:2px solid #c4b5fd;border-radius:12px;padding:10px;margin-bottom:10px}
.mission h3{font-size:14px;color:#312e81}
.seq{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{background:#111827;color:#fff;border-radius:999px;padding:6px 10px;font-family:'Courier New',monospace;font-size:13px;font-weight:800}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.box{background:#f8fafc;border:2px solid #cbd5e1;border-radius:10px;padding:8px}
.box p{font-size:11px;color:#334155}
.box input{width:100%;margin-top:6px;padding:8px;border:2px solid #cbd5e1;border-radius:8px;font-weight:800}
.stepRow{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.mini{padding:7px;border:none;border-radius:8px;background:#e2e8f0;color:#1e293b;font-weight:900;cursor:pointer}
.preview{margin-top:10px;padding:10px;border-radius:10px;background:#f8fafc}
.preview p{font-size:12px;color:#334155}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.btn.check{background:#4338ca;color:#fff}
.btn.next{background:#0ea5e9;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.45}
.msg.good{background:#dcfce7;color:#166534}
.msg.bad{background:#fef2f2;color:#991b1b}
.msg.info{background:#eff6ff;color:#1e3a8a}
.insight{margin-top:12px;background:linear-gradient(135deg,#eef2ff,#ede9fe);border-left:4px solid #4338ca;border-radius:12px;padding:12px;font-size:12px;color:#0f172a;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Pattern Rule Lockpick</h1>
    <p>Crack the rule a(n)=m*n+b to unlock each gate</p>
  </div>
  <div class="card" id="sim"></div>
  <div class="insight"><b>NCERT focus:</b> detect linear number patterns and express them as algebraic rules with variable n.</div>
</div>
<script>
const sim = document.getElementById('sim');

const MISSIONS = [
  {seq:[5,8,11,14], m:3, b:2},
  {seq:[2,7,12,17], m:5, b:-3},
  {seq:[9,13,17,21], m:4, b:5},
  {seq:[1,4,7,10], m:3, b:-2},
  {seq:[10,16,22,28], m:6, b:4},
  {seq:[7,12,17,22], m:5, b:2}
];

let st = {run:true, idx:0, score:0, lives:3, m:1, b:0, resolved:false, msg:'', msgType:'info'};

function clampInt(v,min,max){
  if(!Number.isFinite(v)) return 0;
  const n = Math.trunc(v);
  return Math.max(min, Math.min(max, n));
}

function updateLivePreview(){
  const p5 = st.m*5 + st.b;
  const rule = sim.querySelector('#ruleTxt');
  if(rule) rule.textContent = `a(n) = ${st.m}n${st.b>=0?'+':''}${st.b}`;
  const p5Txt = sim.querySelector('#p5Txt');
  if(p5Txt) p5Txt.textContent = String(p5);
  const p5Stat = sim.querySelector('#p5Stat');
  if(p5Stat) p5Stat.textContent = String(p5);
}

function setParam(key, raw){
  if(!st.run || st.resolved) return;
  st[key] = clampInt(raw, -20, 20);
  updateLivePreview();
}

function nudge(key, delta){
  if(!st.run || st.resolved) return;
  setParam(key, st[key] + delta);
  const inp = sim.querySelector(key==='m' ? '#mIn' : '#bIn');
  if(inp) inp.value = st[key];
}

function start(){
  st = {run:true, idx:0, score:0, lives:3, m:1, b:0, resolved:false, msg:'', msgType:'info'};
  render();
}

function resetGuess(){
  st.m = 1;
  st.b = 0;
  st.resolved = false;
  st.msg = '';
  st.msgType = 'info';
  render();
}

function check(){
  if(!st.run || st.resolved) return;
  const m = MISSIONS[st.idx];
  st.resolved = true;
  if(st.m===m.m && st.b===m.b){
    st.score += 14;
    st.msg = `Rule cracked: a(n)=${m.m}n${m.b>=0?'+':''}${m.b}.`;
    st.msgType = 'good';
  } else {
    st.lives -= 1;
    st.msg = `Not matched. Expected next term is ${m.m*5+m.b}, your rule gives ${st.m*5+st.b}.`;
    st.msgType = 'bad';
    if(st.lives<=0) st.run=false;
  }
  render();
}

function next(){
  if(!st.resolved) return;
  st.idx += 1;
  if(st.idx>=MISSIONS.length){
    st.run = false;
    st.msg = 'All pattern locks opened!';
    st.msgType = 'good';
    render();
    return;
  }
  st.m = 1;
  st.b = 0;
  st.resolved = false;
  st.msg = '';
  st.msgType = 'info';
  render();
}

function render(){
  const done = !st.run;
  const m = MISSIONS[Math.min(st.idx, MISSIONS.length-1)];
  const p5 = st.m*5 + st.b;

  sim.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="k">Gate</div><div class="v">${Math.min(st.idx+1,MISSIONS.length)}/${MISSIONS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">n=5</div><div class="v" id="p5Stat">${p5}</div></div>
    </div>

    <div class="mission">
      <h3>Find the linear rule</h3>
      <div class="seq">${m.seq.map(v=>`<span class="pill">${v}</span>`).join('')}<span class="pill">?</span></div>
    </div>

    <div class="controls">
      <div class="box">
        <p>m (slope)</p>
        <input id="mIn" inputmode="numeric" type="number" min="-20" max="20" step="1" value="${st.m}" ${(st.resolved||done)?'disabled':''}>
        <div class="stepRow">
          <button class="mini" id="mMinus" ${(st.resolved||done)?'disabled':''}>-1</button>
          <button class="mini" id="mPlus" ${(st.resolved||done)?'disabled':''}>+1</button>
        </div>
      </div>
      <div class="box">
        <p>b (intercept)</p>
        <input id="bIn" inputmode="numeric" type="number" min="-20" max="20" step="1" value="${st.b}" ${(st.resolved||done)?'disabled':''}>
        <div class="stepRow">
          <button class="mini" id="bMinus" ${(st.resolved||done)?'disabled':''}>-1</button>
          <button class="mini" id="bPlus" ${(st.resolved||done)?'disabled':''}>+1</button>
        </div>
      </div>
    </div>

    <div class="preview">
      <p>Your rule: <b id="ruleTxt">a(n) = ${st.m}n${st.b>=0?'+':''}${st.b}</b></p>
      <p>Predicted next term (n=5): <b id="p5Txt">${p5}</b></p>
    </div>

    <div class="actions">
      ${done ? `<button class="btn next" id="startBtn">Start Lockpick Run</button>` :
      (st.resolved ? `<button class="btn next" id="nextBtn">${st.idx===MISSIONS.length-1?'Finish':'Next Gate'}</button>` :
      `<button class="btn check" id="checkBtn">Test Rule</button>`)}
    </div>
    ${!done ? `<div class="actions"><button class="btn next" id="resetBtn">Reset Guess</button></div>` : ``}

    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Tip: common difference gives m, then use first term to get b.</div>`}
  `;

  const mi = sim.querySelector('#mIn');
  if(mi){
    mi.oninput = ()=>setParam('m', parseInt(mi.value||'0',10));
    mi.onchange = ()=>{ st.m = clampInt(parseInt(mi.value||'0',10), -20, 20); mi.value = st.m; updateLivePreview(); };
  }
  const bi = sim.querySelector('#bIn');
  if(bi){
    bi.oninput = ()=>setParam('b', parseInt(bi.value||'0',10));
    bi.onchange = ()=>{ st.b = clampInt(parseInt(bi.value||'0',10), -20, 20); bi.value = st.b; updateLivePreview(); };
  }
  const mm = sim.querySelector('#mMinus'); if(mm) mm.onclick=()=>nudge('m',-1);
  const mp = sim.querySelector('#mPlus'); if(mp) mp.onclick=()=>nudge('m',1);
  const bm = sim.querySelector('#bMinus'); if(bm) bm.onclick=()=>nudge('b',-1);
  const bp = sim.querySelector('#bPlus'); if(bp) bp.onclick=()=>nudge('b',1);
  const c = sim.querySelector('#checkBtn'); if(c) c.onclick=check;
  const n = sim.querySelector('#nextBtn'); if(n) n.onclick=next;
  const s = sim.querySelector('#startBtn'); if(s) s.onclick=start;
  const r = sim.querySelector('#resetBtn'); if(r) r.onclick=resetGuess;
  try{
    var _m=MISSIONS[Math.min(st.idx,MISSIONS.length-1)];
    var _ok=(st.m===_m.m&&st.b===_m.b);
    if(!st.run){ window.__eduRound={native:true,line:(st.idx>=MISSIONS.length?(st.msg||'All locks opened!'):'Tap Start to begin.'),voice:(st.idx>=MISSIONS.length?'Complete.':'Tap start.'),glow:sim.querySelector('#startBtn'),submit:sim.querySelector('#startBtn'),key:'start-'+st.idx}; }
    else if(st.resolved){ window.__eduRound={native:true,line:st.msg,voice:(st.msgType==='good'?'Correct.':'Not matched.'),submit:sim.querySelector('#nextBtn'),key:'res-'+st.idx}; }
    else { window.__eduRound={native:true,
      hint:'Sequence '+_m.seq.join(', ')+'. Find the step m and offset b for a(n) = m n + b.',hintVoice:'What are m and b?',
      why:'The common difference between terms is m; then b makes term 1 correct: b = first - m.',
      detail:'Step 1 - Common difference: '+_m.seq[1]+' - '+_m.seq[0]+' = '+_m.m+', so m = '+_m.m+'.\nStep 2 - Term 1 is '+_m.seq[0]+' at n=1, so b = '+_m.seq[0]+' - '+_m.m+' = '+_m.b+'.\nStep 3 - Rule a(n) = '+_m.m+'n'+(_m.b>=0?'+':'')+_m.b+'. Set m='+_m.m+', b='+_m.b+', then Test Rule.\nWhy it works - a constant step is the coefficient of n; b shifts the whole line.\nTip - check term 2: '+_m.m+'x2'+(_m.b>=0?'+':'')+_m.b+' = '+(_m.m*2+_m.b)+'.',
      line:(_ok?'m and b are set right - tap Test Rule.':'Set m = '+_m.m+' and b = '+_m.b+'.'),
      voice:(_ok?'Test the rule.':'Set m and b.'),
      glow:(_ok?sim.querySelector('#checkBtn'):sim.querySelector(st.m!==_m.m?'#mIn':'#bIn')),
      submit:(_ok?sim.querySelector('#checkBtn'):null),key:'r-'+st.idx}; }
  }catch(e){}
}

start();
</script>
  <script src="edu-coach.js"></script>
</body>
</html>
