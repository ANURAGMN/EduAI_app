<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#059669">
<title>Simplify Combo Crusher</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#059669,#0ea5e9);min-height:100vh}
#app{max-width:420px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}
.header p{font-size:12px;opacity:.9}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#ecfdf5;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#065f46;font-weight:700;text-transform:uppercase}
.v{font-size:18px;font-weight:800;color:#111827}
.mission{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:2px solid #86efac;border-radius:12px;padding:10px;margin-bottom:10px}
.expr{font-family:'Courier New',monospace;font-size:20px;font-weight:900;text-align:center;color:#0f172a}
.hint{font-size:12px;color:#166534;margin-top:4px}
.answer{display:flex;gap:6px;margin-top:8px}
.answer input{flex:1;padding:10px;border:2px solid #a7f3d0;border-radius:10px;font-weight:800;font-size:14px}
.btn{padding:10px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.btn.check{background:#059669;color:#fff}
.btn.retry{background:#e2e8f0;color:#334155}
.btn.next{background:#0ea5e9;color:#fff}
.btn.start{background:linear-gradient(135deg,#059669,#0ea5e9);color:#fff;width:100%}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.45}
.msg.good{background:#dcfce7;color:#166534}
.msg.bad{background:#fef2f2;color:#991b1b}
.msg.info{background:#eff6ff;color:#1e3a8a}
.insight{margin-top:12px;background:linear-gradient(135deg,#ecfdf5,#dbeafe);border-left:4px solid #059669;border-radius:12px;padding:12px;font-size:12px;color:#0f172a}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Simplify Combo Crusher</h1>
    <p>Type simplified form under pressure</p>
  </div>
  <div class="card" id="sim"></div>
  <div class="insight"><b>Combo rule:</b> 2+ consecutive correct simplifications increase multiplier points.</div>
</div>
<script>
const sim = document.getElementById('sim');
const MISSIONS = [
  {q:'5c + 3c + 10c', a:'18c', tip:'Like terms: add coefficients only.'},
  {q:'l + b + l + b', a:'2l+2b', tip:'Group same variables.'},
  {q:'(40x+75y)-(6x+10y)', a:'34x+65y', tip:'Minus before bracket flips signs.'},
  {q:'3a+9b-6+8a-4b-7a+16', a:'4a+5b+10', tip:'Combine a, b, then constants.'},
  {q:'2d-d-(d-c)', a:'c', tip:'Expand and cancel like terms.'}
];
let st={run:false,idx:0,score:0,lives:3,combo:0,resolved:false,msg:'',msgType:'info'};
function norm(s){return s.replace(/\s+/g,'').toLowerCase();}
function start(){st={run:true,idx:0,score:0,lives:3,combo:0,resolved:false,msg:'',msgType:'info'};render();}
function retry(){st.resolved=false;st.msg='';st.msgType='info';render();}
function check(){
  if(!st.run||st.resolved) return;
  const m=MISSIONS[st.idx];
  const inp=(sim.querySelector('#ans')?.value||'').trim();
  st.resolved=true;
  if(norm(inp)===norm(m.a)){
    st.combo++;
    const pts=10+Math.max(0,(st.combo-1)*3);
    st.score+=pts;
    st.msg=`Correct! +${pts} points.`;
    st.msgType='good';
  }else{
    st.combo=0;
    st.lives--;
    st.msg=`Not correct. Expected form: ${m.a}`;
    st.msgType='bad';
    if(st.lives<=0) st.run=false;
  }
  render();
}
function next(){
  if(!st.resolved) return;
  st.idx++;
  if(st.idx>=MISSIONS.length){st.run=false;st.msg='Combo round complete!';st.msgType='good';render();return;}
  st.resolved=false;st.msg='';st.msgType='info';render();
}
function render(){
  const done=!st.run;
  const m=MISSIONS[Math.min(st.idx,MISSIONS.length-1)];
  sim.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="k">Mission</div><div class="v">${Math.min(st.idx+1,MISSIONS.length)}/${MISSIONS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Combo</div><div class="v">${st.combo}</div></div>
    </div>
    <div class="mission">
      <div class="expr">${m.q}</div>
      <div class="hint">${m.tip}</div>
    </div>
    ${done?`<button class="btn start" id="startBtn">Start Crusher Run</button>`:`
      <div class="answer">
        <input id="ans" placeholder="type simplified form" ${st.resolved?'disabled':''}>
        ${st.resolved?`<button class="btn retry" id="retryBtn">Retry</button><button class="btn next" id="nextBtn">Next</button>`:`<button class="btn check" id="checkBtn">Check</button>`}
      </div>
    `}
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Keep variable ordering consistent (e.g., 2l+2b).</div>`}
  `;
  const s=sim.querySelector('#startBtn'); if(s) s.onclick=start;
  const c=sim.querySelector('#checkBtn'); if(c) c.onclick=check;
  const r=sim.querySelector('#retryBtn'); if(r) r.onclick=retry;
  const n=sim.querySelector('#nextBtn'); if(n) n.onclick=next;
  try{
    var _m=MISSIONS[Math.min(st.idx,MISSIONS.length-1)];
    if(!st.run){ window.__eduRound={native:true,line:(st.idx>=MISSIONS.length?(st.msg||'Round complete!'):'Tap Start to begin.'),voice:(st.idx>=MISSIONS.length?'Complete.':'Tap start.'),glow:sim.querySelector('#startBtn'),submit:sim.querySelector('#startBtn'),key:'start-'+st.idx}; }
    else if(st.resolved){ window.__eduRound={native:true,line:st.msg,voice:(st.msgType==='good'?'Correct.':'Not correct.'),submit:(sim.querySelector('#nextBtn')||sim.querySelector('#retryBtn')),key:'res-'+st.idx}; }
    else { window.__eduRound={native:true,
      hint:'Simplify '+_m.q+'. '+_m.tip,hintVoice:'Simplify the expression.',
      why:'Open brackets (a minus flips inside signs), then combine like terms only.',
      detail:'Step 1 - Open any brackets; a minus in front flips every inside sign.\nStep 2 - Group like terms (same letters), add coefficients; keep constants together.\nStep 3 - Type the simplified form: '+_m.a+'.\nWhy it works - only like terms count the same thing, so their coefficients add.\nTip - '+_m.tip,
      line:'Simplified form: '+_m.a+'.',voice:'The simplified form.',
      input:sim.querySelector('#ans'),inputHint:_m.a,submit:sim.querySelector('#checkBtn'),key:'r-'+st.idx}; }
  }catch(e){}
}
start();
</script>
  <script src="edu-coach.js"></script>
</body>
</html>
