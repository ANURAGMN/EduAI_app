<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0284c7">
<title>Pictograph Icon Scale Studio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#0284c7,#0369a1);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}.header p{font-size:12px;opacity:.92}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#ecfeff;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#0f766e;font-weight:700;text-transform:uppercase}.v{font-size:17px;font-weight:800;color:#0f172a}
.mission{background:#ecfeff;border:2px solid #67e8f9;border-radius:12px;padding:10px;margin-bottom:10px;font-size:12px;color:#0c4a6e}
.rows{display:grid;gap:8px}
.row{background:#f8fafc;border:2px solid #cbd5e1;border-radius:10px;padding:8px}
.rowTop{display:flex;justify-content:space-between;align-items:center}
.icons{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap;font-size:18px}
.ctrl{display:flex;gap:4px}
.mini{padding:6px 8px;border:none;border-radius:8px;background:#dbeafe;color:#1d4ed8;font-weight:800;cursor:pointer}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.check{background:#0284c7;color:#fff}.next{background:#0f766e;color:#fff}.retry{background:#334155;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.4}
.good{background:#dcfce7;color:#166534}.bad{background:#fef2f2;color:#991b1b}.info{background:#eff6ff;color:#1e3a8a}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Pictograph Icon Scale Studio</h1>
    <p>Build pictographs with correct icon scales</p>
  </div>
  <div class="card" id="sim"></div>
</div>
<script>
const sim=document.getElementById('sim');
const MISSIONS=[
  {scale:2, cats:['A','B','C'], vals:[4,6,2], icon:'⭐'},
  {scale:5, cats:['Red','Blue','Green'], vals:[10,5,15], icon:'🍎'},
  {scale:3, cats:['Bus','Car','Bike'], vals:[6,9,3], icon:'🚌'},
  {scale:4, cats:['P','Q','R'], vals:[8,4,12], icon:'🔷'},
  {scale:2, cats:['Mon','Tue','Wed'], vals:[6,4,8], icon:'📘'}
];
let st={run:true,idx:0,score:0,lives:3,resolved:false,msg:'',msgType:'info',icons:[0,0,0]};
function setup(){ const m=MISSIONS[st.idx]; st.icons=Array(m.cats.length).fill(0); st.resolved=false; st.msg=''; st.msgType='info'; }
function adjust(i,d){
  if(!st.run||st.resolved) return;
  st.icons[i]=Math.max(0,Math.min(9,st.icons[i]+d));
  render();
}
function check(){
  if(!st.run||st.resolved) return;
  const m=MISSIONS[st.idx];
  st.resolved=true;
  const ok=m.vals.every((v,i)=>st.icons[i]*m.scale===v);
  if(ok){ st.score+=12; st.msg='Pictograph scale matched correctly.'; st.msgType='good'; }
  else{ st.lives--; st.msg='Icon counts do not match scale values yet.'; st.msgType='bad'; if(st.lives<=0) st.run=false; }
  render();
}
function next(){
  if(!st.resolved) return;
  st.idx++;
  if(st.idx>=MISSIONS.length){ st.run=false; st.msg='Studio complete!'; st.msgType='good'; render(); return; }
  setup(); render();
}
function retry(){ if(st.run&&st.resolved){ setup(); render(); } }
function restart(){ st={run:true,idx:0,score:0,lives:3,resolved:false,msg:'',msgType:'info',icons:[0,0,0]}; setup(); render(); }
function render(){
  const done=!st.run, m=MISSIONS[Math.min(st.idx,MISSIONS.length-1)];
  sim.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="k">Round</div><div class="v">${Math.min(st.idx+1,MISSIONS.length)}/${MISSIONS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Scale</div><div class="v">1 ${m.icon} = ${m.scale}</div></div>
    </div>
    <div class="mission">Mission: choose icon count so each category value is represented exactly.</div>
    <div class="rows">
      ${m.cats.map((c,i)=>`
        <div class="row">
          <div class="rowTop">
            <div><b>${c}</b> target: ${m.vals[i]}</div>
            <div class="ctrl">${!done&&!st.resolved?`<button class="mini" data-i="${i}" data-d="-2">--</button><button class="mini" data-i="${i}" data-d="-1">-</button><button class="mini" data-i="${i}" data-d="1">+</button><button class="mini" data-i="${i}" data-d="2">++</button>`:''}</div>
          </div>
          <div style="margin-top:4px;font-size:12px;color:#334155">Current: ${st.icons[i]} ${m.icon} = ${st.icons[i]*m.scale}</div>
          <div class="icons">${m.icon.repeat(st.icons[i])||'—'}</div>
        </div>
      `).join('')}
    </div>
    <div class="actions">
      ${done?`<button class="btn next" id="restartBtn">Restart</button>`:st.resolved?`<button class="btn retry" id="retryBtn">Retry</button><button class="btn next" id="nextBtn">${st.idx===MISSIONS.length-1?'Finish':'Next'}</button>`:`<button class="btn check" id="checkBtn">Check Pictograph</button>`}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Use +/- controls to tune icon counts quickly.</div>`}
  `;
  sim.querySelectorAll('.mini').forEach(b=>b.onclick=()=>adjust(parseInt(b.dataset.i,10),parseInt(b.dataset.d,10)));
  const c=sim.querySelector('#checkBtn'); if(c) c.onclick=check;
  const n=sim.querySelector('#nextBtn'); if(n) n.onclick=next;
  const r=sim.querySelector('#retryBtn'); if(r) r.onclick=retry;
  const rs=sim.querySelector('#restartBtn'); if(rs) rs.onclick=restart;
  try{
    var _m=MISSIONS[Math.min(st.idx,MISSIONS.length-1)];
    var _wrong=-1; for(var _i=0;_i<_m.vals.length;_i++){ if(st.icons[_i]*_m.scale!==_m.vals[_i]){_wrong=_i;break;} }
    var _all=(_wrong===-1);
    var _gl=_all?sim.querySelector('#checkBtn'):(sim.querySelector('.mini[data-i="'+_wrong+'"][data-d="1"]')||sim.querySelector('.mini[data-i="'+_wrong+'"]'));
    var _need=_all?0:_m.vals[_wrong]/_m.scale;
    if(!st.run){ window.__eduRound={native:true,line:(st.msg||'Studio complete!'),voice:(st.msgType==='good'?'Done.':'Try again.'),glow:sim.querySelector('#restartBtn'),submit:sim.querySelector('#restartBtn'),key:'over-'+st.idx}; }
    else if(st.resolved){ window.__eduRound={native:true,line:st.msg,voice:(st.msgType==='good'?'Correct.':'Not quite.'),submit:(sim.querySelector('#nextBtn')||sim.querySelector('#retryBtn')),key:'res-'+st.idx}; }
    else { window.__eduRound={native:true,
      hint:'Each icon stands for '+_m.scale+'. How many icons for each value?',hintVoice:'How many icons?',
      why:'In a pictograph each icon = the scale, so icons needed = value divided by scale.',
      detail:'Step 1 - Read the scale: one icon = '+_m.scale+' units.\nStep 2 - Icons needed = value ÷ '+_m.scale+'.\nStep 3 - Set each category, then Check.\nWhy it works - the key/scale converts icons to a count.\nTip - if it does not divide evenly you would need a part-icon (these divide evenly).',
      line:(_all?'All rows match - tap Check.':('Category '+_m.cats[_wrong]+': '+_m.vals[_wrong]+' ÷ '+_m.scale+' = '+_need+' icons (you have '+st.icons[_wrong]+').')),
      voice:(_all?'Tap Check.':('Set '+_m.cats[_wrong]+' to '+_need+' icons.')),
      glow:_gl,submit:(_all?sim.querySelector('#checkBtn'):null),key:'m-'+st.idx}; }
  }catch(e){}
}
setup(); render();
</script>
  <script src="edu-coach.js"></script>
</body>
</html>
