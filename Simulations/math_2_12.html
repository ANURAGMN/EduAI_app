<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f59e0b">
<title>Subtract Nine Jetpack</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#f59e0b,#ea580c);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}
.header p{font-size:12px;opacity:.92}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#fff7ed;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#9a3412;font-weight:700;text-transform:uppercase}
.v{font-size:18px;font-weight:800;color:#111827}
.mission{background:linear-gradient(135deg,#fff7ed,#ffedd5);border:2px solid #fdba74;border-radius:12px;padding:10px;margin-bottom:10px}
.mission h3{font-size:14px;color:#9a3412}
.big{font-family:'Courier New',monospace;font-size:24px;font-weight:900;color:#7c2d12;text-align:center;margin-top:6px}
.steps{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.step{padding:10px;border:2px solid #d1d5db;border-radius:10px;background:#fff;cursor:pointer;font-weight:800}
.step.sel{border-color:#ea580c;background:#ffedd5;color:#9a3412}
.step.ok{border-color:#16a34a;background:#dcfce7;color:#166534}
.step.bad{border-color:#dc2626;background:#fef2f2;color:#991b1b}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.btn.check{background:#ea580c;color:#fff}
.btn.next{background:#16a34a;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.45}
.msg.good{background:#dcfce7;color:#166534}
.msg.bad{background:#fef2f2;color:#991b1b}
.msg.info{background:#eff6ff;color:#1e3a8a}
.insight{margin-top:12px;background:linear-gradient(135deg,#fff7ed,#ffedd5);border-left:4px solid #f59e0b;border-radius:12px;padding:12px;font-size:12px;color:#111827;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Subtract Nine Jetpack</h1>
    <p>Use the -10 then +1 trick to land fast</p>
  </div>
  <div class="card" id="sim"></div>
  <div class="insight"><b>Concept:</b> x-9 = x-10+1. Overshoot and compensate is faster and less error-prone.</div>
</div>
<script>
const sim = document.getElementById('sim');
const ROUNDS = [36,74,125,208,499,903];
let st = {run:true,idx:0,score:0,lives:3,pick:'',resolved:false,msg:'',msgType:'info'};

function options(n){
  const a = n-9;
  return [
    {k:'direct', label:`${n} - 9 = ${a}`, value:a},
    {k:'jet', label:`${n} - 10 + 1 = ${a}`, value:a},
    {k:'wrong', label:`${n} - 10 = ${n-10}`, value:n-10}
  ];
}

function choose(k){ if(!st.run||st.resolved) return; st.pick=k; render(); }

function check(){
  if(!st.run||st.resolved||!st.pick) return;
  const n = ROUNDS[st.idx];
  const ops = options(n);
  st.resolved = true;
  if(st.pick==='jet'){
    st.score += 12;
    st.msg = 'Perfect jetpack move! Subtract 10 and add back 1.';
    st.msgType = 'good';
  }else{
    st.lives -= 1;
    st.msg = `Best strategy is ${n}-10+1 = ${n-9}.`;
    st.msgType = 'bad';
    if(st.lives<=0) st.run=false;
  }
  render();
}

function next(){
  if(!st.resolved) return;
  st.idx++;
  if(st.idx>=ROUNDS.length){ st.run=false; st.msg='Jetpack run complete!'; st.msgType='good'; render(); return; }
  st.pick=''; st.resolved=false; st.msg=''; st.msgType='info'; render();
}

function restart(){ st={run:true,idx:0,score:0,lives:3,pick:'',resolved:false,msg:'',msgType:'info'}; render(); }

function render(){
  const done = !st.run;
  const n = ROUNDS[Math.min(st.idx,ROUNDS.length-1)];
  const ops = options(n);
  sim.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="k">Round</div><div class="v">${Math.min(st.idx+1,ROUNDS.length)}/${ROUNDS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Target</div><div class="v">${n}</div></div>
    </div>
    <div class="mission">
      <h3>Compute ${n} - 9</h3>
      <div class="big">${n} - 9 = ?</div>
    </div>
    <div class="steps">
      ${ops.map(o=>{
        const cls = st.resolved ? (o.k==='jet'?'ok':(o.k===st.pick?'bad':'')) : (o.k===st.pick?'sel':'');
        return `<button class="step ${cls}" data-k="${o.k}">${o.label}</button>`;
      }).join('')}
    </div>
    <div class="actions">
      ${done?`<button class="btn next" id="restartBtn">Restart</button>`:(st.resolved?`<button class="btn next" id="nextBtn">${st.idx===ROUNDS.length-1?'Finish':'Next'}</button>`:`<button class="btn check" id="checkBtn">Confirm Strategy</button>`)}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Select the best mental-math strategy, then confirm.</div>`}
  `;
  sim.querySelectorAll('.step').forEach(b=>b.onclick=()=>choose(b.dataset.k));
  const c=sim.querySelector('#checkBtn'); if(c) c.onclick=check;
  const nbtn=sim.querySelector('#nextBtn'); if(nbtn) nbtn.onclick=next;
  const r=sim.querySelector('#restartBtn'); if(r) r.onclick=restart;
}
render();
</script>
  <script src="edu-coach.js"></script>
</body>
</html>
