<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Row Column Formula Raider</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#4f46e5,#0ea5e9);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}
.header p{font-size:12px;opacity:.92}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#eef2ff;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#4338ca;font-weight:700;text-transform:uppercase}
.v{font-size:18px;font-weight:800;color:#111827}
.mission{background:linear-gradient(135deg,#eef2ff,#e0e7ff);border:2px solid #c4b5fd;border-radius:12px;padding:10px;margin-bottom:10px}
.mission h3{font-size:14px;color:#312e81}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.cell{background:#f8fafc;border:2px solid #cbd5e1;border-radius:8px;padding:8px;text-align:center;font-family:'Courier New',monospace;font-weight:800}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.box{background:#f8fafc;border:2px solid #cbd5e1;border-radius:10px;padding:8px}
.box p{font-size:11px;color:#334155}
.box input{width:100%;margin-top:6px;padding:8px;border:2px solid #cbd5e1;border-radius:8px;font-weight:800}
.preview{margin-top:10px;padding:10px;background:#f8fafc;border-radius:10px}
.preview p{font-size:12px;color:#334155}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.btn.check{background:#4f46e5;color:#fff}
.btn.next{background:#0ea5e9;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.45}
.msg.good{background:#dcfce7;color:#166534}
.msg.bad{background:#fef2f2;color:#991b1b}
.msg.info{background:#eff6ff;color:#1e3a8a}
.insight{margin-top:12px;background:linear-gradient(135deg,#eef2ff,#e0e7ff);border-left:4px solid #4f46e5;border-radius:12px;padding:12px;font-size:12px;color:#111827;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Row Column Formula Raider</h1>
    <p>Find the formula for grid value at (r,c)</p>
  </div>
  <div class="card" id="sim"></div>
  <div class="insight"><b>Concept:</b> in 4-column running-number grids, value at row r and column c is 4(r-1)+c.</div>
</div>
<script>
const sim = document.getElementById('sim');
const ROUNDS = [
  {r:7,c:3,val:27},
  {r:9,c:4,val:36},
  {r:12,c:1,val:45},
  {r:15,c:2,val:58},
  {r:20,c:4,val:80},
  {r:25,c:3,val:99}
];

let st = {run:true, idx:0, score:0, lives:3, a:4, b:0, resolved:false, msg:'', msgType:'info'};

function start(){ st={run:true,idx:0,score:0,lives:3,a:4,b:0,resolved:false,msg:'',msgType:'info'}; render(); }
function resetGuess(){ if(!st.run) return; st.a=4; st.b=0; st.resolved=false; st.msg=''; st.msgType='info'; render(); }

function check(){
  if(!st.run || st.resolved) return;
  const r = ROUNDS[st.idx];
  const pred = st.a*(r.r-1)+r.c+st.b;
  st.resolved = true;
  if(pred===r.val && st.a===4 && st.b===0){
    st.score += 12;
    st.msg = 'Formula locked! V = 4(r-1)+c';
    st.msgType = 'good';
  } else {
    st.lives--;
    st.msg = `Not exact. At (${r.r},${r.c}) expected ${r.val}.`;
    st.msgType = 'bad';
    if(st.lives<=0) st.run=false;
  }
  render();
}

function next(){
  if(!st.resolved) return;
  st.idx++;
  if(st.idx>=ROUNDS.length){ st.run=false; st.msg='Raid complete!'; st.msgType='good'; render(); return; }
  st.a=4; st.b=0; st.resolved=false; st.msg=''; st.msgType='info'; render();
}

function render(){
  const done = !st.run;
  const r = ROUNDS[Math.min(st.idx,ROUNDS.length-1)];
  const pred = st.a*(r.r-1)+r.c+st.b;
  const base = (r.r-1)*4 + 1;
  sim.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="k">Round</div><div class="v">${Math.min(st.idx+1,ROUNDS.length)}/${ROUNDS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Target</div><div class="v">${r.val}</div></div>
    </div>
    <div class="mission">
      <h3>Predict value at row ${r.r}, col ${r.c}</h3>
      <p>Use formula V = a(r-1)+c+b and tune a,b.</p>
      <div class="grid">
        <div class="cell">${base}</div><div class="cell">${base+1}</div><div class="cell">${base+2}</div><div class="cell">${base+3}</div>
      </div>
    </div>
    <div class="form">
      <div class="box"><p>a coefficient</p><input id="aIn" type="number" min="-20" max="20" step="1" value="${st.a}" ${st.resolved||done?'disabled':''}></div>
      <div class="box"><p>b offset</p><input id="bIn" type="number" min="-50" max="50" step="1" value="${st.b}" ${st.resolved||done?'disabled':''}></div>
    </div>
    <div class="preview">
      <p>Your formula: <b>V = ${st.a}(r-1)+c${st.b>=0?'+':''}${st.b}</b></p>
      <p>Predicted at (${r.r},${r.c}): <b>${pred}</b></p>
    </div>
    <div class="actions">
      ${done?`<button class="btn next" id="startBtn">Restart Raider</button>`:(st.resolved?`<button class="btn next" id="nextBtn">${st.idx===ROUNDS.length-1?'Finish':'Next Round'}</button>`:`<button class="btn check" id="checkBtn">Lock Formula</button>`)}
    </div>
    ${!done?`<div class="actions"><button class="btn next" id="resetBtn">Reset Guess</button></div>`:''}
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Hint: row jump is +4 each row in 4-column grids.</div>`}
  `;
  const ai=sim.querySelector('#aIn'); if(ai) ai.oninput=()=>{ st.a=parseInt(ai.value||'0',10); render(); };
  const bi=sim.querySelector('#bIn'); if(bi) bi.oninput=()=>{ st.b=parseInt(bi.value||'0',10); render(); };
  const c=sim.querySelector('#checkBtn'); if(c) c.onclick=check;
  const n=sim.querySelector('#nextBtn'); if(n) n.onclick=next;
  const s=sim.querySelector('#startBtn'); if(s) s.onclick=start;
  const rs=sim.querySelector('#resetBtn'); if(rs) rs.onclick=resetGuess;
}
start();
</script>
</body>
</html>
