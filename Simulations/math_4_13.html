<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>Word to Formula Signal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#1d4ed8,#0ea5e9);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}
.header p{font-size:12px;opacity:.9}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#eff6ff;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#1d4ed8;font-weight:700;text-transform:uppercase}
.v{font-size:18px;font-weight:800;color:#0f172a}
.mission{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:2px solid #93c5fd;border-radius:12px;padding:10px;margin-bottom:10px}
.mission h3{font-size:14px;color:#1e3a8a}
.mission p{font-size:13px;color:#1d4ed8;margin-top:4px;line-height:1.4}
.opts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
.opt{padding:10px;border:2px solid #d1d5db;border-radius:10px;background:#fff;cursor:pointer;font-family:'Courier New',monospace;font-size:14px;font-weight:800}
.opt.sel{border-color:#1d4ed8;background:#dbeafe;color:#1e3a8a}
.opt.ok{border-color:#16a34a;background:#dcfce7;color:#166534}
.opt.bad{border-color:#dc2626;background:#fef2f2;color:#991b1b}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.btn.check{background:#1d4ed8;color:#fff}
.btn.next{background:#16a34a;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.45}
.msg.good{background:#dcfce7;color:#166534}
.msg.bad{background:#fef2f2;color:#991b1b}
.msg.info{background:#eff6ff;color:#1e3a8a}
.insight{margin-top:12px;background:linear-gradient(135deg,#eff6ff,#dbeafe);border-left:4px solid #1d4ed8;border-radius:12px;padding:12px;font-size:12px;color:#0f172a;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Word to Formula Signal</h1>
    <p>Decode scenario text into correct algebraic expression</p>
  </div>
  <div class="card" id="sim"></div>
  <div class="insight"><b>Concept:</b> translate words into algebra precisely (times vs plus, less than vs minus).</div>
</div>
<script>
const sim = document.getElementById('sim');
const MISSIONS = [
  {text:'Cost of c coconuts at ₹35 each', ans:'35c', opts:['35+c','c/35','35c','c-35']},
  {text:'Shabnam is 3 years older than Aftab (a)', ans:'a+3', opts:['3a','a+3','a-3','3+a+a']},
  {text:'Perimeter of a square of side q', ans:'4q', opts:['q+4','4+q','4q','q/4']},
  {text:'Total stories in 8 weeks if 5 per week', ans:'5*8', opts:['8+5','5*8','5-8','8/5']},
  {text:'3 less than 10 times y', ans:'10y-3', opts:['10(y-3)','10y-3','y-13','10+y-3']},
  {text:'30x + 20y (x rotis, y pulao plates) total cost', ans:'30x+20y', opts:['50xy','30x+20y','30+y+20+x','20x+30y']}
];

let st = {run:true, idx:0, score:0, lives:3, pick:'', resolved:false, msg:'', msgType:'info'};

function choose(v){ if(!st.run || st.resolved) return; st.pick=v; render(); }
function check(){
  if(!st.run || st.resolved || !st.pick) return;
  const m = MISSIONS[st.idx];
  st.resolved = true;
  if(st.pick===m.ans){ st.score += 12; st.msg='Signal matched! Correct formula.'; st.msgType='good'; }
  else { st.lives--; st.msg=`Not correct. Expected: ${m.ans}.`; st.msgType='bad'; if(st.lives<=0) st.run=false; }
  render();
}
function next(){
  if(!st.resolved) return;
  st.idx += 1;
  if(st.idx>=MISSIONS.length){ st.run=false; st.msg='All signals decoded!'; st.msgType='good'; render(); return; }
  st.pick=''; st.resolved=false; st.msg=''; st.msgType='info'; render();
}
function restart(){ st={run:true,idx:0,score:0,lives:3,pick:'',resolved:false,msg:'',msgType:'info'}; render(); }

function render(){
  const done = !st.run;
  const m = MISSIONS[Math.min(st.idx, MISSIONS.length-1)];
  sim.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="k">Mission</div><div class="v">${Math.min(st.idx+1,MISSIONS.length)}/${MISSIONS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Mode</div><div class="v">Decode</div></div>
    </div>
    <div class="mission">
      <h3>Translate to expression</h3>
      <p>${m.text}</p>
    </div>
    <div class="opts">
      ${m.opts.map(v=>{
        const cls = st.resolved ? (v===m.ans?'ok':(v===st.pick?'bad':'')) : (v===st.pick?'sel':'');
        return `<button class="opt ${cls}" data-v="${v}">${v}</button>`;
      }).join('')}
    </div>
    <div class="actions">
      ${done ? `<button class="btn next" id="restartBtn">Restart Run</button>` :
      (st.resolved ? `<button class="btn next" id="nextBtn">${st.idx===MISSIONS.length-1?'Finish':'Next Mission'}</button>` :
      `<button class="btn check" id="checkBtn">Check Formula</button>`)}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Selected: <b>${st.pick||'-'}</b>. Then check.</div>`}
  `;
  sim.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(b.dataset.v));
  const c=sim.querySelector('#checkBtn'); if(c) c.onclick=check;
  const n=sim.querySelector('#nextBtn'); if(n) n.onclick=next;
  const r=sim.querySelector('#restartBtn'); if(r) r.onclick=restart;
  var _m=MISSIONS[Math.min(st.idx,MISSIONS.length-1)];
  var _ansEl=[].slice.call(sim.querySelectorAll('.opt')).find(function(b){return b.dataset.v===_m.ans;});
  if(!st.run){ window.__eduRound={native:true,line:(st.idx>=MISSIONS.length?(st.msg||'Complete!'):st.msg),voice:'Round over.',submit:sim.querySelector('#restartBtn'),key:'done-'+st.idx+'-'+(st.msg||'')}; }
  else if(st.resolved){ window.__eduRound={native:true,line:st.msg,voice:(st.msgType==='good'?'Correct.':'Not correct.'),submit:sim.querySelector('#nextBtn'),key:'res-'+st.idx}; }
  else { window.__eduRound={native:true,
    hint:'Which expression matches: '+_m.text+'?',hintVoice:'Which expression matches the phrase?',
    why:'Translate the phrase to symbols: "times" is a coefficient, "less than / older than" can change the order and sign.',
    detail:'Step 1 - Read: '+_m.text+'.\nStep 2 - Turn each part into symbols (times becomes a coefficient; "less than" subtracts from the first quantity).\nStep 3 - That gives '+_m.ans+', so tap it.\nWhy it works - the expression is the phrase in symbols, and word order can reverse (3 less than 10y is 10y - 3).\nTip - "10 times y" is 10y, not 10 + y.',
    line:'Expression: '+_m.ans+'.',voice:'The answer is '+_m.ans,
    glow:_ansEl,submit:(st.pick?sim.querySelector('#checkBtn'):null),key:'m-'+st.idx}; }
}
render();
</script>
  <script src="edu-coach.js"></script>
</body>
</html>
