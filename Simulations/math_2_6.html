<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Estimation Duel Grid</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#0f766e,#2563eb);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}
.header p{font-size:12px;opacity:.9}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#ecfeff;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#0f766e;font-weight:700;text-transform:uppercase}
.v{font-size:18px;font-weight:800;color:#111827}
.mission{background:linear-gradient(135deg,#ecfeff,#dbeafe);border:2px solid #7dd3fc;border-radius:12px;padding:10px;margin-bottom:10px}
.expr{font-family:'Courier New',monospace;font-size:22px;font-weight:900;color:#0f172a;text-align:center;margin-top:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{padding:10px;border:2px solid #d1d5db;border-radius:10px;background:#fff;cursor:pointer;font-weight:800}
.opt.sel{border-color:#0f766e;background:#d1fae5;color:#065f46}
.opt.ok{border-color:#16a34a;background:#dcfce7;color:#166534}
.opt.bad{border-color:#dc2626;background:#fef2f2;color:#991b1b}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.btn.check{background:#0f766e;color:#fff}
.btn.next{background:#0284c7;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.45}
.msg.good{background:#dcfce7;color:#166534}
.msg.bad{background:#fef2f2;color:#991b1b}
.msg.info{background:#eff6ff;color:#1e3a8a}
.insight{margin-top:12px;background:linear-gradient(135deg,#ecfeff,#dbeafe);border-left:4px solid #0f766e;border-radius:12px;padding:12px;font-size:12px;color:#111827;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Estimation Duel Grid</h1>
    <p>Pick closest estimate before exact value</p>
  </div>
  <div class="card" id="sim"></div>
  <div class="insight"><b>Concept:</b> compare approximate results quickly, then verify with exact arithmetic.</div>
</div>
<script>
const sim = document.getElementById('sim');
const ROUNDS = [
  {expr:'4,63,128 + 4,19,682', exact:882810, opts:[800000,850000,900000,882810]},
  {expr:'29,19,000 + 9,91,000', exact:3910000, opts:[3900000,4000000,3800000,3910000]},
  {expr:'6,72,85,183 nearest crore', exact:70000000, opts:[60000000,70000000,67000000,68000000]},
  {expr:'3,87,69,957 nearest lakh', exact:38800000, opts:[38700000,38800000,39000000,38500000]},
  {expr:'9,99,999 + 2,01,001', exact:1201000, opts:[1000000,1200000,1300000,1201000]},
  {expr:'5,40,200 - 1,89,700', exact:350500, opts:[350000,300000,360000,350500]}
];

let st={run:true,idx:0,score:0,lives:3,pick:null,resolved:false,msg:'',msgType:'info'};
function fmt(n){return Math.round(n).toLocaleString('en-IN');}
function choose(v){ if(!st.run||st.resolved) return; st.pick=v; render(); }
function check(){
  if(!st.run||st.resolved||st.pick===null) return;
  const r=ROUNDS[st.idx];
  st.resolved=true;
  const dist=Math.abs(st.pick-r.exact);
  const best=Math.min(...r.opts.map(v=>Math.abs(v-r.exact)));
  if(dist===best){ st.score+=12; st.msg=`Great estimate. Exact: ${fmt(r.exact)}.`; st.msgType='good'; }
  else { st.lives--; st.msg=`Closer estimate exists. Exact: ${fmt(r.exact)}.`; st.msgType='bad'; if(st.lives<=0) st.run=false; }
  render();
}
function next(){
  if(!st.resolved) return;
  st.idx++;
  if(st.idx>=ROUNDS.length){ st.run=false; st.msg='Duel complete!'; st.msgType='good'; render(); return; }
  st.pick=null; st.resolved=false; st.msg=''; st.msgType='info'; render();
}
function restart(){ st={run:true,idx:0,score:0,lives:3,pick:null,resolved:false,msg:'',msgType:'info'}; render(); }

function render(){
  const done=!st.run;
  const r=ROUNDS[Math.min(st.idx,ROUNDS.length-1)];
  sim.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="k">Round</div><div class="v">${Math.min(st.idx+1,ROUNDS.length)}/${ROUNDS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Mode</div><div class="v">Estimate</div></div>
    </div>
    <div class="mission">
      <div style="font-size:12px;color:#0f766e">Choose closest estimate:</div>
      <div class="expr">${r.expr}</div>
    </div>
    <div class="opts">
      ${r.opts.map(v=>{
        const cls=st.resolved?(Math.abs(v-r.exact)===Math.min(...r.opts.map(x=>Math.abs(x-r.exact)))?'ok':(v===st.pick?'bad':'')):(v===st.pick?'sel':'');
        return `<button class="opt ${cls}" data-v="${v}">${fmt(v)}</button>`;
      }).join('')}
    </div>
    <div class="actions">
      ${done?`<button class="btn next" id="restartBtn">Restart</button>`:(st.resolved?`<button class="btn next" id="nextBtn">${st.idx===ROUNDS.length-1?'Finish':'Next Round'}</button>`:`<button class="btn check" id="checkBtn">Lock Estimate</button>`)}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Pick quickly, then verify exact value.</div>`}
  `;
  sim.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(Number(b.dataset.v)));
  const c=sim.querySelector('#checkBtn'); if(c) c.onclick=check;
  const n=sim.querySelector('#nextBtn'); if(n) n.onclick=next;
  const rbtn=sim.querySelector('#restartBtn'); if(rbtn) rbtn.onclick=restart;
  // --- V5 coach: pick the option closest to the true value ---
  var _best=r.opts.reduce(function(a,b){return Math.abs(b-r.exact)<Math.abs(a-r.exact)?b:a;},r.opts[0]);
  var _bestEl=[].slice.call(sim.querySelectorAll('.opt')).find(function(b){return Number(b.dataset.v)===_best;});
  if(done){
    window.__eduRound={native:true,line:(st.idx>=ROUNDS.length?(st.msg||'Duel complete!'):st.msg),voice:'Round over.',submit:sim.querySelector('#restartBtn'),key:'done-'+st.idx};
  } else if(st.resolved){
    window.__eduRound={native:true,line:st.msg,voice:(st.msgType==='good'?'Correct.':'Not the closest.'),submit:sim.querySelector('#nextBtn'),key:'res-'+st.idx};
  } else if(/nearest/i.test(r.expr)){
    // Rounding round — the answer IS the rounded value, so don't call it "exact/estimate".
    var _place=((r.expr.match(/nearest\s+([a-z]+)/i)||[])[1]||'given place');
    var _numPart=r.expr.replace(/\s*nearest.*/i,'').trim();
    window.__eduRound={native:true,
      hint:'Round '+_numPart+' to the nearest '+_place+'. Which option is the rounded value?',
      hintVoice:'Which option is the rounded value?',
      why:'Look at the digit just after the '+_place+' place: 5 or more rounds up, less rounds down.',
      detail:'Step 1 — Round '+_numPart+' to the nearest '+_place+'.\nStep 2 — Check the digit just after the '+_place+' place and compare it to the halfway mark.\nStep 3 — '+_numPart+' rounds to '+fmt(_best)+', so tap it.\nWhy it works — you snap to the nearest multiple of a '+_place+'; the halfway value is the tipping point.\nTip — only the digit right after the place decides up or down.',
      line:'Nearest '+_place+': '+fmt(_best)+'.',
      voice:'Rounds to '+fmt(_best),
      glow:_bestEl,
      submit:st.pick!==null?sim.querySelector('#checkBtn'):null,
      key:'r-'+st.idx};
  } else {
    // Estimate round (sum/difference).
    window.__eduRound={native:true,
      hint:'Estimate '+r.expr+'. Round each number, then pick the option closest to the true total.',
      hintVoice:'Which option is closest?',
      why:'Round each number to a friendly place, combine them, then pick the option nearest your estimate. The true total is '+fmt(r.exact)+'.',
      detail:'Step 1 — The problem: '+r.expr+'.\nStep 2 — Rounding each number, the total is about '+fmt(r.exact)+'.\nStep 3 — Compare each option with '+fmt(r.exact)+'; '+fmt(_best)+' is the closest, so tap it.\nWhy it works — estimating with round numbers gets you close quickly, then you pick the nearest choice.\nTip — round both numbers the same way before combining.',
      line:'Closest option: '+fmt(_best)+' (true total '+fmt(r.exact)+').',
      voice:'Choose '+fmt(_best),
      glow:_bestEl,
      submit:st.pick!==null?sim.querySelector('#checkBtn'):null,
      key:'r-'+st.idx};
  }
}
render();
</script>
  <script src="edu-coach.js"></script>
</body>
</html>
