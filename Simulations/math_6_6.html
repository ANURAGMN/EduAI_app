<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Number Parity Switchboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#2563eb,#0ea5e9);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}
.header p{font-size:12px;opacity:.92}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#eff6ff;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#1d4ed8;font-weight:700;text-transform:uppercase}
.v{font-size:18px;font-weight:800;color:#111827}
.mission{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:2px solid #93c5fd;border-radius:12px;padding:10px;margin-bottom:10px}
.mission p{font-size:12px;color:#1e3a8a;line-height:1.45}
.expr{font-family:'Courier New',monospace;font-size:22px;font-weight:900;color:#1e3a8a;text-align:center;margin-top:6px}
.switches{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.sw{padding:10px;border:2px solid #d1d5db;border-radius:10px;background:#fff;cursor:pointer;font-weight:800}
.sw.sel{border-color:#2563eb;background:#dbeafe;color:#1d4ed8}
.sw.ok{border-color:#16a34a;background:#dcfce7;color:#166534}
.sw.bad{border-color:#dc2626;background:#fef2f2;color:#991b1b}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.btn.check{background:#2563eb;color:#fff}
.btn.next{background:#0ea5e9;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.45}
.msg.good{background:#dcfce7;color:#166534}
.msg.bad{background:#fef2f2;color:#991b1b}
.msg.info{background:#eff6ff;color:#1e3a8a}
.insight{margin-top:12px;background:linear-gradient(135deg,#eff6ff,#dbeafe);border-left:4px solid #2563eb;border-radius:12px;padding:12px;font-size:12px;color:#111827;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Number Parity Switchboard</h1>
    <p>Route expressions to Odd/Even outcomes quickly</p>
  </div>
  <div class="card" id="sim"></div>
  <div class="insight"><b>Chapter 6 seed:</b> number play with odd-even parity patterns under operations.</div>
</div>
<script>
const sim = document.getElementById('sim');
const ROUNDS = [
  {expr:'17 + 24', ans:'odd'},
  {expr:'31 + 9', ans:'even'},
  {expr:'22 + 14', ans:'even'},
  {expr:'41 - 18', ans:'odd'},
  {expr:'6 × 7', ans:'even'},
  {expr:'9 × 11', ans:'odd'}
];

function evalExpr(s){
  try{
    return Function(`"use strict"; return (${s.replace('×','*')});`)();
  }catch{return null;}
}

let st={run:true,idx:0,score:0,lives:3,pick:'',resolved:false,msg:'',msgType:'info'};
function choose(v){ if(!st.run||st.resolved) return; st.pick=v; render(); }
function check(){
  if(!st.run||st.resolved||!st.pick) return;
  const r=ROUNDS[st.idx];
  st.resolved=true;
  if(st.pick===r.ans){ st.score+=12; st.msg='Correct parity route.'; st.msgType='good'; }
  else { st.lives--; st.msg=`Not correct. ${r.expr} is ${r.ans}.`; st.msgType='bad'; if(st.lives<=0) st.run=false; }
  render();
}
function next(){
  if(!st.resolved) return;
  st.idx++;
  if(st.idx>=ROUNDS.length){ st.run=false; st.msg='Switchboard complete!'; st.msgType='good'; render(); return; }
  st.pick=''; st.resolved=false; st.msg=''; st.msgType='info'; render();
}
function restart(){ st={run:true,idx:0,score:0,lives:3,pick:'',resolved:false,msg:'',msgType:'info'}; render(); }
function render(){
  const done=!st.run;
  const r=ROUNDS[Math.min(st.idx,ROUNDS.length-1)];
  const v=evalExpr(r.expr);
  sim.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="k">Round</div><div class="v">${Math.min(st.idx+1,ROUNDS.length)}/${ROUNDS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Value</div><div class="v">${v===null?'-':v}</div></div>
    </div>
    <div class="mission">
      <p>Classify the expression result as odd or even.</p>
      <div class="expr">${r.expr}</div>
    </div>
    <div class="switches">
      ${['odd','even'].map(v2=>{
        const cls=st.resolved?(v2===r.ans?'ok':(v2===st.pick?'bad':'')):(v2===st.pick?'sel':'');
        return `<button class="sw ${cls}" data-v="${v2}">${v2.toUpperCase()}</button>`;
      }).join('')}
    </div>
    <div class="actions">
      ${done?`<button class="btn next" id="restartBtn">Restart</button>`:(st.resolved?`<button class="btn next" id="nextBtn">${st.idx===ROUNDS.length-1?'Finish':'Next Round'}</button>`:`<button class="btn check" id="checkBtn">Route Output</button>`)}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Select parity then route.</div>`}
  `;
  sim.querySelectorAll('.sw').forEach(b=>b.onclick=()=>choose(b.dataset.v));
  const c=sim.querySelector('#checkBtn'); if(c) c.onclick=check;
  const n=sim.querySelector('#nextBtn'); if(n) n.onclick=next;
  const rbtn=sim.querySelector('#restartBtn'); if(rbtn) rbtn.onclick=restart;
  try{
    var _r=ROUNDS[Math.min(st.idx,ROUNDS.length-1)];
    var _g=[].slice.call(sim.querySelectorAll('.sw')).find(function(b){return b.dataset.v===_r.ans;});
    var _ck=sim.querySelector('#checkBtn');
    if(!st.run){ window.__eduRound={native:true,line:(st.msg||'Switchboard complete!'),voice:(st.msgType==='good'?'Done.':'Try again.'),glow:sim.querySelector('#restartBtn'),submit:sim.querySelector('#restartBtn'),key:'over-'+st.idx}; }
    else if(st.resolved){ window.__eduRound={native:true,line:st.msg,voice:(st.msgType==='good'?'Correct.':'Not quite.'),submit:(sim.querySelector('#nextBtn')||sim.querySelector('#retryBtn')),key:'res-'+st.idx}; }
    else { window.__eduRound={native:true,
      hint:'Is '+_r.expr+' odd or even?',hintVoice:'Odd or even?',
      why:'Same-parity sum/difference is even, mixed is odd; a product is even if any factor is even.',
      detail:'Step 1 - Note each number parity in '+_r.expr+'.\nStep 2 - Sum/difference: same parity -> even, different -> odd. Product: any even factor -> even.\nStep 3 - So '+_r.expr+' is '+_r.ans+' - tap it.\nWhy it works - parity depends only on the last bit, not the full value.\nTip - you do not need the actual total.',
      line:_r.expr+' is '+_r.ans+'.',voice:'It is '+_r.ans+'.',
      glow:_g,submit:(st.pick?_ck:null),key:'r-'+st.idx}; }
  }catch(e){}
}
render();
</script>
  <script src="edu-coach.js"></script>
</body>
</html>
