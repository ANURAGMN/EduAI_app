<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Transversal Pair Match Lab</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#0f766e,#0284c7);min-height:100vh}
#app{max-width:430px;margin:auto;padding:10px}
.header{text-align:center;color:#fff;padding:12px}
.header h1{font-size:20px;font-weight:800}
.header p{font-size:12px;opacity:.92}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#ecfeff;border-radius:10px;padding:8px;text-align:center}
.k{font-size:10px;color:#0f766e;font-weight:700;text-transform:uppercase}
.v{font-size:18px;font-weight:800;color:#111827}
.mission{background:linear-gradient(135deg,#ecfeff,#dbeafe);border:2px solid #67e8f9;border-radius:12px;padding:10px;margin-bottom:10px}
.mission p{font-size:12px;color:#155e75;line-height:1.45}
svg{width:100%;height:240px;background:#f8fafc;border-radius:12px;border:2px solid #cbd5e1}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.chip{padding:10px;border:2px solid #d1d5db;border-radius:10px;background:#fff;cursor:pointer;font-weight:800}
.chip.sel{border-color:#0284c7;background:#e0f2fe;color:#0c4a6e}
.chip.ok{border-color:#16a34a;background:#dcfce7;color:#166534}
.chip.bad{border-color:#dc2626;background:#fef2f2;color:#991b1b}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.btn.check{background:#0284c7;color:#fff}
.btn.next{background:#0f766e;color:#fff}
.msg{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;line-height:1.45}
.msg.good{background:#dcfce7;color:#166534}
.msg.bad{background:#fef2f2;color:#991b1b}
.msg.info{background:#eff6ff;color:#1e3a8a}
.insight{margin-top:12px;background:linear-gradient(135deg,#ecfeff,#dbeafe);border-left:4px solid #0f766e;border-radius:12px;padding:12px;font-size:12px;color:#111827;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Transversal Pair Match Lab</h1>
    <p>Match angle pairs by relation type</p>
  </div>
  <div class="card" id="sim"></div>
  <div class="insight"><b>Goal:</b> identify corresponding, alternate interior, and co-interior pairs correctly.</div>
</div>
<script>
const sim = document.getElementById('sim');
const ROUNDS = [
  {ask:'corresponding', pair:['a1','a2']},
  {ask:'alternate interior', pair:['a3','a6']},
  {ask:'co-interior', pair:['a3','a5']},
  {ask:'corresponding', pair:['a4','a8']},
  {ask:'alternate interior', pair:['a4','a5']},
  {ask:'co-interior', pair:['a4','a6']}
];
const ALL = ['a1','a2','a3','a4','a5','a6','a7','a8'];
let st={run:true,idx:0,score:0,lives:3,picks:[],resolved:false,msg:'',msgType:'info'};

function setup(){ st.picks=[]; st.resolved=false; st.msg=''; st.msgType='info'; }
function togglePick(v){
  if(!st.run||st.resolved) return;
  if(st.picks.includes(v)) st.picks=st.picks.filter(x=>x!==v);
  else if(st.picks.length<2) st.picks.push(v);
  else st.picks=[st.picks[1],v];
  render();
}
function sameSet(a,b){ return a.length===b.length && a.every(x=>b.includes(x)); }
function check(){
  if(!st.run||st.resolved||st.picks.length!==2) return;
  const r=ROUNDS[st.idx];
  st.resolved=true;
  if(sameSet(st.picks,r.pair)){ st.score+=12; st.msg='Correct pair match.'; st.msgType='good'; }
  else { st.lives--; st.msg=`Correct pair: ${r.pair[0]} & ${r.pair[1]}`; st.msgType='bad'; if(st.lives<=0) st.run=false; }
  render();
}
function next(){
  if(!st.resolved) return;
  st.idx++;
  if(st.idx>=ROUNDS.length){ st.run=false; st.msg='Match lab complete!'; st.msgType='good'; render(); return; }
  setup(); render();
}
function restart(){ st={run:true,idx:0,score:0,lives:3,picks:[],resolved:false,msg:'',msgType:'info'}; setup(); render(); }

function drawDiagram(){
  return `
    <svg viewBox="0 0 360 240" aria-label="parallel lines with transversal and angle labels">
      <line x1="40" y1="70" x2="320" y2="70" stroke="#334155" stroke-width="3"/>
      <line x1="40" y1="170" x2="320" y2="170" stroke="#334155" stroke-width="3"/>
      <line x1="130" y1="20" x2="230" y2="220" stroke="#dc2626" stroke-width="3"/>
      ${[['a1',155,48],['a2',188,48],['a3',154,88],['a4',188,88],['a5',199,150],['a6',165,150],['a7',198,190],['a8',164,190]]
        .map(([id,x,y])=>`<text x="${x}" y="${y}" font-size="14" font-weight="800" fill="${st.picks.includes(id)?'#0284c7':'#111827'}">${id}</text>`).join('')}
    </svg>
  `;
}

function render(){
  const done=!st.run;
  const r=ROUNDS[Math.min(st.idx,ROUNDS.length-1)];
  sim.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="k">Round</div><div class="v">${Math.min(st.idx+1,ROUNDS.length)}/${ROUNDS.length}</div></div>
      <div class="stat"><div class="k">Score</div><div class="v">${st.score}</div></div>
      <div class="stat"><div class="k">Lives</div><div class="v">${st.lives}</div></div>
      <div class="stat"><div class="k">Pick</div><div class="v">${st.picks.length}/2</div></div>
    </div>
    <div class="mission"><p>Select the pair that forms <b>${r.ask}</b>.</p></div>
    ${drawDiagram()}
    <div class="chips">
      ${ALL.map(v=>{
        const cls=st.resolved?(r.pair.includes(v)?'ok':(st.picks.includes(v)?'bad':'')):(st.picks.includes(v)?'sel':'');
        return `<button class="chip ${cls}" data-v="${v}">${v}</button>`;
      }).join('')}
    </div>
    <div class="actions">
      ${done?`<button class="btn next" id="restartBtn">Restart</button>`:(st.resolved?`<button class="btn next" id="nextBtn">${st.idx===ROUNDS.length-1?'Finish':'Next'}</button>`:`<button class="btn check" id="checkBtn">Check Pair</button>`)}
    </div>
    ${st.msg?`<div class="msg ${st.msgType}">${st.msg}</div>`:`<div class="msg info">Tap exactly two labels, then check.</div>`}
  `;
  sim.querySelectorAll('.chip').forEach(b=>b.onclick=()=>togglePick(b.dataset.v));
  const c=sim.querySelector('#checkBtn'); if(c) c.onclick=check;
  const n=sim.querySelector('#nextBtn'); if(n) n.onclick=next;
  const rbtn=sim.querySelector('#restartBtn'); if(rbtn) rbtn.onclick=restart;
}
setup();
render();
</script>
</body>
</html>
