<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Avatar Lip Sync</title>

    <style>
        :root {
          --mouth-ease: cubic-bezier(.22,.61,.36,1);
          --mouth-speed: 120ms;
        }

        body {
          margin: 0;
          background: transparent;
          overflow: hidden;
          font-family: system-ui, sans-serif;
        }

        .container {
          position: fixed;
          inset: 0;
          display: grid;
          place-items: center;
        }

        .stage {
          position: relative;
          width: 100%;
          height: 100%;
        }

        .character {
          width: 100%;
          height: 100%;
          object-fit: contain;
          display: block;
        }

        /* ---- MOUTH ---- */
        .mouth-container {
          position: absolute;
          left: 50%;
          top: 48%;
          transform: translate(-50%, -30%);
          width: 12%;
          aspect-ratio: 3/1;
          pointer-events: none;
          filter: drop-shadow(0 2px 2px rgba(0,0,0,.25));
        }

        .mouth {
          width: 100%;
          height: 100%;
          transform-origin: center;
          animation: breathe 4s ease-in-out infinite;
        }

        @keyframes breathe {
          0%,100% { transform: scale(1); }
          50% { transform: scale(1.03); }
        }

        .mouth-set g {
          opacity: 0;
          transform: scale(.9);
          transition:
            opacity var(--mouth-speed) var(--mouth-ease),
            transform var(--mouth-speed) var(--mouth-ease);
        }

        .mouth-set g.active {
          opacity: 1;
          transform: scale(1);
        }

        /* ---- DEBUG ---- */
        .debug-info {
          position: fixed;
          bottom: 10px;
          left: 10px;
          background: rgba(0,0,0,.6);
          color: #0f0;
          font-family: monospace;
          padding: 6px;
          font-size: 12px;
          border-radius: 6px;
          display: none;
        }

        .container.debug .debug-info { display: block; }
    </style>
</head>

<body>
<div class="container" id="container">
    <div class="stage">
        <img id="characterImage" class="character" src="images/boy.png"/>

        <div class="mouth-container">
            <svg class="mouth" viewBox="-50 -50 100 100">
                <g class="mouth-set" id="mouthSet">
                    <g data-viseme="rest"><path d="M-26 6 q26 10 52 0" fill="#c33"/></g>
                    <g data-viseme="closed"><rect x="-30" y="-6" width="60" height="12" rx="6" fill="#9b2b2b"/></g>
                    <g data-viseme="wide"><ellipse cx="0" cy="6" rx="42" ry="14" fill="#9b2b2b"/></g>
                    <g data-viseme="open"><ellipse cx="0" cy="8" rx="36" ry="22" fill="#9b2b2b"/></g>
                    <g data-viseme="round"><ellipse cx="0" cy="6" rx="22" ry="26" fill="#9b2b2b"/></g>
                    <g data-viseme="f_v"><path d="M-28 6 q28 -24 56 0" stroke="#000" stroke-width="3"/></g>
                    <g data-viseme="th"><rect x="-18" y="0" width="36" height="8" rx="4" fill="#9b2b2b"/></g>
                    <g data-viseme="smush"><ellipse cx="0" cy="6" rx="28" ry="12" fill="#9b2b2b"/></g>
                    <g data-viseme="kiss"><ellipse cx="0" cy="6" rx="16" ry="12" fill="#9b2b2b"/></g>
                </g>
            </svg>
        </div>
    </div>

    <div class="debug-info">
        Viseme: <b id="dbgViseme">rest</b>
    </div>
</div>

<script>
    /* =====================
       CORE ANIMATION ENGINE
    ===================== */
    const mouthSet = document.getElementById("mouthSet");
    const dbg = document.getElementById("dbgViseme");
    let queue = [], timer = null, running = false;

    function setViseme(v) {
      mouthSet.querySelectorAll("[data-viseme]").forEach(g=>g.classList.remove("active"));
      const el = mouthSet.querySelector(`[data-viseme="${v}"]`);
      if (el) el.classList.add("active");
      dbg.textContent = v;
    }

    function playNext() {
      if (!running) return;
      if (!queue.length) {
        setViseme("rest");
        running = false;
        return;
      }
      const f = queue.shift();
      setViseme(f.v);
      timer = setTimeout(playNext, f.d);
    }

    function stop() {
      running = false;
      queue.length = 0;
      clearTimeout(timer);
      setViseme("rest");
    }

    /* =====================
       PUBLIC ANDROID API
    ===================== */
    window.AndroidLipSyncAPI = {
      startLipSync(text, rate = .75) {
        stop();
        queue = buildQueue(text, rate);
        running = true;
        playNext();
      },
      stopLipSync: stop,
      toggleDebug: v => document.getElementById("container").classList.toggle("debug", v)
    };

    /* =====================
       SIMPLE G2P (you can keep your Kannada one)
    ===================== */
    function buildQueue(text, rate) {
      const frames = [];
      for (const ch of text.toLowerCase()) {
        if ("aeiou".includes(ch)) frames.push({v:"open",d:240});
        else if ("pbm".includes(ch)) frames.push({v:"closed",d:160});
        else frames.push({v:"rest",d:120});
      }
      return frames.map(f => ({...f, d: f.d / rate}));
    }

    setViseme("rest");
</script>
</body>
</html>
